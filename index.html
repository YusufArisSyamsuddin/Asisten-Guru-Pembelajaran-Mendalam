});
window.addEventListener('unhandledrejection', function(event) {

const Accordion = ({ title, icon, subtitle, children, defaultOpen = false, isCompleted, onToggleComplete, headerColorClass = "bg-blue-100 text-blue-700" }) => {
  const [isOpen, setIsOpen] = useState(defaultOpen);

  return (

const LabelWithHint = ({ children, hint, className="block text-slate-700 font-semibold mb-1", onRegenerate, isLoading }) => {
  const [showHint, setShowHint] = useState(false);
  const labelText = typeof children === "string" ? children : "";
  const defaultHint = defaultLabelHints[labelText] || "";
  const effectiveHint = [hint, defaultHint && hint !== defaultHint ? defaultHint : ""].filter(Boolean).join("\n\n");

  return (
    <div className="mb-1 w-full">
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2">
          <label className={className}>{children}</label>
          {onRegenerate ? (
            <button 
              type="button" 
              onClick={onRegenerate} 
              disabled={isLoading} 
              className={`w-6 h-6 shrink-0 flex items-center justify-center rounded-full transition-all shadow-sm border ${isLoading ? 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed' : 'bg-fuchsia-100 text-fuchsia-600 border-fuchsia-200 hover:bg-fuchsia-600 hover:text-white'}`} 
              title="Generate ulang bagian ini saja"
            >
              <i className={`fas fa-sync-alt text-[10px] ${isLoading ? 'fa-spin' : ''}`}></i>
            </button>
          ) : null}
        </div>
        {effectiveHint ? <button type="button" onClick={() => setShowHint(!showHint)} className={`ml-2 shrink-0 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded transition-colors flex items-center shadow-sm ${showHint ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-white border border-slate-300 text-slate-500 hover:bg-slate-100 hover:text-slate-800'}`} title="Klik untuk bantuan pengisian"><i className={`fas ${showHint ? 'fa-times' : 'fa-info-circle'} mr-1`}></i> <span className="hidden sm:inline">{showHint ? 'Tutup' : 'Petunjuk'}</span></button> : null}
      </div>
      {showHint ? <div className="mt-2 mb-3 p-3 bg-blue-50/80 border border-blue-200 text-blue-800 text-xs rounded-lg shadow-inner leading-relaxed whitespace-pre-wrap"><i className="fas fa-lightbulb text-yellow-500 mr-2 text-sm"></i>{effectiveHint}</div> : null}
    </div>
  );
};

    return (candidates.find(k => typeof k === "string" && k.trim()) || "").trim();
  };

      const remaining = activityTabs.filter(tab => tab.id !== id);
      const fallback = remaining[0];
      localStorage.setItem('asistenGuruTabs_v1', JSON.stringify(remaining));
      localStorage.setItem('asistenGuruActiveTab_v1', id === activeTabId ? fallback.id : activeTabId);
      setActivityTabs(remaining);
      if (id === activeTabId) {
        setActiveTabId(fallback.id);
        setRppData(normalizeActivityData(fallback.data));
        setCompletedSteps({});
        setAiHistory([]);
      }
    });
  };

  const getAssessmentBlueprint = (data = rppData) => {
    const source = Array.isArray(data.rencanaAsesmen) && data.rencanaAsesmen.length ? data.rencanaAsesmen : defaultAssessmentPlan;
    return source.map((row, index) => ({
      id: row.id || `plan-${index}`,
      bentuk: normalizeBentuk(row.bentuk),
      jumlah: Math.max(0, parseInt(row.jumlah, 10) || 0),
      level: ["C1","C2","C3","C4","C5","C6"].includes(cleanStr(row.level).toUpperCase()) ? cleanStr(row.level).toUpperCase() : "C4"
    })).filter(row => row.bentuk && row.jumlah > 0);
  };

  const expandAssessmentBlueprint = (data = rppData) => getAssessmentBlueprint(data).flatMap(row => Array.from({ length: row.jumlah }, () => ({ bentuk: row.bentuk, level: row.level })));

  const getAssessmentPlanText = (data = rppData) => {
    const blueprint = getAssessmentBlueprint(data);
    return blueprint.length ? blueprint.map(row => `${row.jumlah} soal ${row.bentuk} level ${row.level}`).join("; ") : "Gunakan pola minimal 10 soal dengan dominasi C4-C6.";
  };

  const toggleStep = (id) => setCompletedSteps(p => ({ ...p, [id]: !p[id] }));
  const handleInputChange = (e) => {
    const { name, value } = e.target;
    setRppData(p => {
      const next = { ...p, [name]: value };
      if (name !== "jumlahPertemuan") return next;
      const pertemuanPembelajaran = syncPertemuanPembelajaran(next, getJumlahPertemuanValue(value));
      const withPertemuan = mirrorFirstPertemuanFields({ ...next, pertemuanPembelajaran }, pertemuanPembelajaran);
      return { ...withPertemuan, lkpd: mapLkpdRows(withPertemuan.lkpd, withPertemuan) };
    });
  };
  const handlePertemuanFieldChange = (index, fieldKey, value) => {
    setRppData(prev => {
      const pertemuanPembelajaran = syncPertemuanPembelajaran(prev).map((row, rowIndex) => (
        rowIndex === index ? { ...row, [fieldKey]: value } : row
      ));
      const next = { ...prev, pertemuanPembelajaran };
      return index === 0 ? mirrorFirstPertemuanFields(next, pertemuanPembelajaran) : next;
    });
  };
  const handleProfilChange = (k) => setRppData(p => ({ ...p, profilLulusan: { ...p.profilLulusan, [k]: !p.profilLulusan[k] } }));
  const handleKseChange = (k) => setRppData(p => ({ ...p, kseLulusan: { ...p.kseLulusan, [k]: !p.kseLulusan[k] } }));
  const handleTableChange = (a, i, f, v) => setRppData(p => { const n = [...p[a]]; n[i] = { ...n[i], [f]: v }; return { ...p, [a]: n }; });
  const addTableRow = (a, d) => setRppData(p => ({ ...p, [a]: [...p[a], { id: Date.now(), ...d }] }));
  const removeTableRow = (a, id) => confirmPopup("Hapus Baris?", "Baris ini akan dihapus dari tabel. Lanjutkan?", () => setRppData(p => ({ ...p, [a]: p[a].filter(i => i.id !== id) })));
  const saveAiSnapshot = (label) => setAiHistory(h => [...h.slice(-7), { label, data: JSON.parse(JSON.stringify(rppData)) }]);
  const undoLastAI = () => {
    const last = aiHistory[aiHistory.length - 1];
    if (!last) return;
    setRppData(last.data);
    setAiHistory(h => h.slice(0, -1));
    notify("Undo Berhasil", `Data dikembalikan ke kondisi sebelum ${last.label}.`, "success");
  };
  
  const resetRppData = () => confirmPopup("Kosongkan Semua Form?", "Semua isian, tabel, dan riwayat undo akan dikosongkan. Lanjutkan?", () => {
    setRppData({...defaultDataObj});
    setCompletedSteps({});
    setAiHistory([]);
    setIsEditing(true);
    setInstruksiKhusus("");
    setInstruksiKhususAsesmen("");
    setInstruksiKhususLkpd("");
  });

  const cleanStr = (str) => {
    if (!str) return "";
    let cleaned = String(str).replace(/\r\n/g, '\n').replace(/\\n/g, '\n').replace(/\*\*/g, '').replace(/\*/g, '');
    cleaned = cleaned.replace(/([^\n])\s+((?:\d+[\.\)]|[A-D][\.\)]|[-•])\s+)/g, '$1\n$2');
    cleaned = cleaned.replace(/([^\n])\s+(Skor\s+\d+(?:-\d+)?\s*[:=])/gi, '$1\n$2');
    cleaned = cleaned.replace(/([^\n])\s+((?:Sangat baik|Baik|Cukup|Perlu bimbingan|Tidak menunjukkan evidensi)\s*[:=])/gi, '$1\n$2');
    cleaned = cleaned.replace(/\n\s*\n/g, '\n'); 
    return cleaned.trim();
  };

  const countMeaningfulLines = (value) => cleanStr(value).split(/\n+/).filter(line => line.replace(/^[-\d\.\)\s]+/, '').trim().length > 18).length;
  const hasNumberedOneToThree = (value) => [1, 2, 3].every(num => new RegExp(`(^|\\n)\\s*${num}[\\.)]\\s+`, "i").test(cleanStr(value)));
  const removeRepeatedTargetTriplet = (value) => {
    const text = cleanStr(value);
    const lines = text.split(/\n+/).map(line => line.trim()).filter(Boolean);
    if (!lines.length) return "";
    const secondStart = lines.findIndex((line, index) => index > 0 && /^1[\.)]\s+/.test(line) && hasNumberedOneToThree(lines.slice(0, index).join('\n')) && hasNumberedOneToThree(lines.slice(index).join('\n')));
    return secondStart > -1 ? lines.slice(0, secondStart).join('\n') : text;
  };

  const ensureSituasiNyata = (value, data = rppData) => {
    const text = cleanStr(value);
    if (countMeaningfulLines(text) >= 3 && /(lingkungan|sekolah|rumah|sekitar|lokal|siswa|data|fakta|pengamatan|kasus|fenomena)/i.test(text)) return text;
    const topic = cleanStr(data.topik) || "topik pembelajaran";
    const school = cleanStr(data.namaSekolah) || "sekolah";
    return cleanStr(`${text ? `${text}\n` : ""}1. Konteks lokal: Siswa mengaitkan ${topic} dengan fenomena yang dapat diamati di ${school}, rumah, atau lingkungan sekitar.\n2. Masalah nyata: Siswa menelaah peristiwa/kasus sederhana yang dekat dengan pengalaman mereka sehingga konsep tidak dipelajari secara abstrak.\n3. Bukti awal: Siswa memakai pengamatan, cerita, data sederhana, foto, peta, tabel, atau hasil diskusi sebagai jangkar pembelajaran bermakna.`);
  };

  const ensureExperienceText = (value, label, data = rppData) => {
    const text = removeRepeatedTargetTriplet(value);
    if (hasNumberedOneToThree(text)) return text;
    if (countMeaningfulLines(text) >= 3 && /(konsep|bukti|data|kasus|strategi|refleksi|menerapkan|menganalisis|menyimpulkan|mengevaluasi|merancang)/i.test(text)) return text;
    const topic = cleanStr(data.topik) || "materi";
    const templates = {
      memahami: `1. Siswa mengaktifkan pengetahuan awal tentang ${topic} melalui pertanyaan pemantik dan contoh nyata.\n2. Siswa mengeksplorasi konsep kunci dengan membaca/mengamati data, gambar, kasus, atau demonstrasi singkat.\n3. Siswa menjelaskan makna konsep dengan bahasanya sendiri dan memeriksa miskonsepsi bersama guru.`,
      mengaplikasi: `1. Siswa menerapkan konsep ${topic} pada kasus baru yang dekat dengan kehidupan mereka.\n2. Siswa memakai bukti/data sederhana untuk memilih strategi, menyusun alasan, dan membuat produk/kinerja.\n3. Siswa membandingkan hasil kerja dengan kriteria keberhasilan dan memperbaiki jawabannya melalui umpan balik.`,
      merefleksi: `1. Siswa menuliskan strategi berpikir yang paling membantu saat memahami ${topic}.\n2. Siswa menilai bukti pemahaman dirinya, kesulitan yang tersisa, dan bantuan yang dibutuhkan.\n3. Siswa merumuskan rencana perbaikan belajar untuk pertemuan atau tugas berikutnya.`
    };
    if (/(^|\n)\s*\d+[\.)]\s+/.test(text)) return text;
    return cleanStr(`${text ? `${text}\n` : ""}${templates[label] || templates.memahami}`);
  };

  useEffect(() => {
    setRppData(prev => {
      const rows = syncPertemuanPembelajaran(prev);
      let changed = false;
      const cleanedRows = rows.map(row => {
        const next = { ...row };
        ["pengalamanMemahami", "pengalamanMengaplikasi", "pengalamanMerefleksi"].forEach(key => {
          const cleaned = removeRepeatedTargetTriplet(next[key]);
          if (cleaned !== next[key]) {
            next[key] = cleaned;
            changed = true;
          }
        });
        return next;
      });
      if (!changed) return prev;
      return mirrorFirstPertemuanFields({ ...prev, pertemuanPembelajaran: cleanedRows }, cleanedRows);
    });
  }, []);

  const normalizeBentuk = (value) => {
    const v = cleanStr(value).toLowerCase();
    if (v.includes("kompleks")) return "PG Kompleks";
    if (v.includes("jodoh")) return "Menjodohkan";
    if (v.includes("isian")) return "Isian Singkat";
    if (v.includes("urai")) return "Uraian";
    if (v.includes("praktik") || v.includes("praktek") || v.includes("kinerja")) return "Praktik";
    if (v.includes("proyek") || v.includes("projek")) return "Proyek";
    if (v === "pg" || v.includes("pilihan ganda")) return "PG";
    return cleanStr(value);
  };

  const getBentukPenilaianList = (kisi = rppData.kisiKisi) => {
    const list = [];
    (kisi || []).forEach(k => {
      const bentuk = normalizeBentuk(k.bentuk);
      if (bentuk && !list.includes(bentuk)) list.push(bentuk);
    });
    return list.length ? list : ["Tertulis"];
  };

  const buildDefaultRubrik = (bentuk) => ({
    bentukPenilaian: bentuk,
    skor: skorBentuk[bentuk] || "4 = sangat baik\n3 = baik\n2 = cukup\n1 = perlu bimbingan\n0 = tidak menunjukkan evidensi",
    kriteria: bentuk === "PG" ? "Benar bila siswa memilih satu jawaban yang paling tepat sesuai indikator soal.\nSalah bila jawaban tidak sesuai, kosong, atau memilih lebih dari satu opsi." :
      bentuk === "PG Kompleks" ? "Nilai penuh hanya diberikan bila dua pilihan benar dipilih seluruhnya.\nJika ada satu pilihan salah, kurang satu pilihan benar, atau memilih lebih dari dua, skor menjadi 0." :
      bentuk === "Menjodohkan" ? "Tersedia minimal 4 premis dan 4 pasangan.\nSetiap pasangan benar bernilai 1 sampai total 4.\nPasangan salah, ganda, atau kosong bernilai 0 pada pasangan tersebut." :
      bentuk === "Isian Singkat" ? "Skor 2 bila istilah/angka/jawaban tepat.\nSkor 1 bila inti jawaban benar tetapi kurang lengkap.\nSkor 0 bila salah atau kosong." :
      bentuk === "Uraian" ? "Skor 5: jawaban lengkap, konsep tepat, alasan kuat, dan memakai bukti/konteks.\nSkor 3-4: konsep tepat tetapi alasan/bukti belum lengkap.\nSkor 1-2: sebagian konsep benar tetapi penalaran lemah.\nSkor 0: tidak menjawab atau tidak sesuai indikator." :
      `Kriteria disusun sesuai evidensi ${bentuk}: proses, produk/kinerja, ketepatan konsep, penggunaan bukti, dan refleksi siswa.`
  });

  const stripLeadingLabel = (text, labels = []) => {
    let value = cleanStr(text);
    labels.forEach(label => {
      value = value.replace(new RegExp(`^\\s*${label}\\s*[:=\\-]\\s*`, "i"), "");
    });
    return cleanStr(value);
  };

  const stripRubrikLabels = (text) => cleanStr(text)
    .replace(/(^|\n)\s*Kriteria\s*[:=]\s*/gi, '$1')
    .replace(/(^|\n)\s*Deskripsi\s*Indikator\s*Penilaian\s*[:=]\s*/gi, '$1')
    .replace(/\n\s*\n/g, '\n')
    .trim();

  const getMaxScoreByFormOrText = (form, scoreText = "") => {
    const fixedMax = { "PG": "1", "PG Kompleks": "2", "Menjodohkan": "4", "Isian Singkat": "2", "Uraian": "5" };
    if (fixedMax[form]) return fixedMax[form];
    const nums = (cleanStr(scoreText).match(/\d+/g) || []).map(Number);
    if (nums.length) return String(Math.max(...nums));
    return form === "Praktik" || form === "Proyek" ? "4" : "-";
  };

  const getRubrikRangeByFormOrText = (form, scoreText = "") => {
    const fixedRange = { "PG": "0-1", "PG Kompleks": "0-2", "Menjodohkan": "0-4", "Isian Singkat": "0-2", "Uraian": "0-5", "Praktik": "0-10", "Proyek": "0-10" };
    const raw = cleanStr(scoreText);
    const directRange = raw.match(/\b\d+\s*-\s*\d+\b/);
    if (directRange && raw.split(/\n+/).length === 1) return directRange[0].replace(/\s*/g, '');
    if (fixedRange[form]) return fixedRange[form];
    const nums = (raw.match(/\d+/g) || []).map(Number);
    return nums.length ? `0-${Math.max(...nums)}` : "0-4";
  };

  const buildScoreRepresentation = (rangeText, criteriaText, form = "") => {
    const range = cleanStr(rangeText);
    let criteria = stripRubrikLabels(criteriaText);
    // ===== PERBAIKAN ENTER OTOMATIS =====
    criteria = criteria
      .replace(/\s+(?=Skor\s+\d+)/gi, '\n')
      .replace(/;\s*(?=Skor\s+\d+)/gi, '\n')
      .replace(/\.\s*(?=Skor\s+\d+)/gi, '.\n');

    // ====================================
    if (/Skor\s+\d+(?:\s*-\s*\d+)?\s*:/i.test(criteria)) return criteria;
    let source = range || skorBentuk[form] || "";
    if (/^Rentang\s+Nilai\s*:/i.test(criteria)) {
      source = criteria.replace(/^Rentang\s+Nilai\s*:\s*/i, '');
      criteria = "";
    }
    const lines = source.replace(/^Rentang\s+Nilai\s*:\s*/i, '').split(/\n+/).map(line => line.trim()).filter(Boolean);
    const converted = lines.map(line => {
      const match = line.match(/^(?:Skor\s*)?(\d+(?:\s*-\s*\d+)?)\s*(?:=|:|-)\s*(.+)$/i);
      if (!match) return line;
      const score = match[1].replace(/\s+/g, '');
      const desc = match[2].trim();
      return `Skor ${score}: ${desc.charAt(0).toUpperCase() + desc.slice(1)}`;
    }).filter(Boolean);
    if (converted.length) return converted.join('\n');
    return criteria || `Skor ${getRubrikRangeByFormOrText(form, range)}: Deskripsi capaian disesuaikan dengan indikator penilaian.`;
  };

  const normalizeRubrikRow = (row = {}, fallbackForm = "") => {
    if (!fallbackForm && !cleanStr(row.bentukPenilaian) && !cleanStr(row.skor) && !cleanStr(row.kriteria)) {
      return { id: row.id || Date.now() + 'r', bentukPenilaian: "", skor: "", kriteria: "" };
    }
    const bentuk = normalizeBentuk(row.bentukPenilaian || row.bentuk || row.jenis || fallbackForm);
    const fallback = buildDefaultRubrik(bentuk || fallbackForm || "Tertulis");
    const rawScore = cleanStr(row.skor);
    const rawCriteria = cleanStr(row.kriteria);
    const sourceRange = (rawScore && (/[=:-]/.test(rawScore) || rawScore.split(/\n+/).length > 1)) ? rawScore : fallback.skor;
    const sourceCriteria = rawCriteria || fallback.kriteria;
    return {
      id: row.id || Date.now() + 'r',
      bentukPenilaian: bentuk || fallback.bentukPenilaian,
      skor: getRubrikRangeByFormOrText(bentuk, rawScore || fallback.skor),
      kriteria: buildScoreRepresentation(sourceRange, sourceCriteria, bentuk)
    };
  };

  const kkoByLevel = { C1: "mengidentifikasi", C2: "menjelaskan", C3: "menerapkan", C4: "menganalisis", C5: "mengevaluasi", C6: "merancang" };
  const getExpectedAssessmentSequence = (planData = rppData) => {
    const planned = expandAssessmentBlueprint(planData);
    const hasPlanRows = Array.isArray(planData.rencanaAsesmen) && planData.rencanaAsesmen.length > 0;
    if (!planned.length && hasPlanRows) return [];
    const total = planned.length || 10;
    return Array.from({ length: total }).map((_, i) => planned[i] || { bentuk: bentukSoalUrut[i] || "Uraian", level: i < 2 ? "C3" : i < 8 ? "C4" : "C5" });
  };
  const getAssessmentSequenceText = (planData = rppData) => {
    const sequence = getExpectedAssessmentSequence(planData);
    return sequence.length ? sequence.map((shape, index) => `No. ${index + 1}: ${shape.bentuk} level ${shape.level}`).join('\n') : "Belum ada rencana soal valid.";
  };
  const getDefaultKisiRow = (shape, index, planData = rppData) => {
    const topic = cleanStr(planData.topik) || "materi pembelajaran";
    const context = cleanStr(planData.situasiNyataSiswa) || "situasi nyata di lingkungan siswa";
    const tp = cleanStr(planData.tp).replace(/\n+/g, '; ').slice(0, 260) || "tujuan pembelajaran pada modul ajar";
    const verb = kkoByLevel[shape.level] || "menganalisis";
    return {
      materi: topic,
      indikator: `${verb.charAt(0).toUpperCase() + verb.slice(1)} ${topic} melalui stimulus/kasus kontekstual tentang ${context} sesuai TP modul: ${tp}.`,
      level: shape.level,
      bentuk: shape.bentuk,
      nomor: String(index + 1)
    };
  };

  const mapKisiRows = (rows, planData = rppData) => {
    const expected = getExpectedAssessmentSequence(planData);
    return expected.map((shape, i) => {
      const k = rows?.[i] || {};
      const level = cleanStr(k.level).toUpperCase();
      const fallback = getDefaultKisiRow(shape, i, planData);
      const finalLevel = shape.level || (["C1","C2","C3","C4","C5","C6"].includes(level) ? level : fallback.level);
      const finalBentuk = shape.bentuk || normalizeBentuk(k.bentuk) || fallback.bentuk;
      return {
        id: Date.now() + 'k' + i,
        materi: cleanStr(k.materi) || fallback.materi,
        indikator: cleanStr(k.indikator) || fallback.indikator,
        level: finalLevel,
        bentuk: finalBentuk,
        nomor: String(i + 1)
      };
    });
  };

  const hasCompleteChoiceOptions = (text) => ["A","B","C","D"].every(l => new RegExp(`(^|\\n|\\s)${l}\\s*[\\).:-]`, "i").test(cleanStr(text)));

  const splitChoiceOptionsFromSoal = (soal, opsi, bentuk) => {
    const form = normalizeBentuk(bentuk);
    const question = cleanStr(soal);
    let options = cleanStr(opsi);
    if (!["PG", "PG Kompleks"].includes(form)) return { soal: question, opsi: options };
    const match = question.match(/(^|\n|\s)A\s*[\).:-]\s*/i);
    if (!match) return { soal: question, opsi: options };
    const start = match.index + (match[1] ? match[1].length : 0);
    const candidate = cleanStr(question.slice(start));
    if (!hasCompleteChoiceOptions(candidate)) return { soal: question, opsi: options };
    return {
      soal: cleanStr(question.slice(0, start)),
      opsi: hasCompleteChoiceOptions(options) ? options : candidate
    };
  };

  const splitMatchingOptionsFromSoal = (soal, opsi) => {
    const question = cleanStr(soal);
    const options = cleanStr(opsi);
    if (/(premis|kelompok\s*a|kolom\s*a).*(respon|kelompok\s*b|kolom\s*b)/is.test(options)) return { soal: question, opsi: options };
    const match = question.match(/((?:premis\s*\/\s*kolom\s*a|kelompok\s*a|kolom\s*a)\s*:?\s*[\s\S]*)/i);
    if (!match || !/(respon|kelompok\s*b|kolom\s*b)/i.test(match[1])) return { soal: question, opsi: options };
    return { soal: cleanStr(question.slice(0, match.index)), opsi: options || cleanStr(match[1]) };
  };

  const normalizeChoiceOptionsText = (text) => {
    let value = cleanStr(text);
    if (/(premis|kelompok\s*a|kolom\s*a).*(respon|kelompok\s*b|kolom\s*b)/is.test(value)) {
      value = value.replace(/(?:premis|kelompok\s*a|kolom\s*a)\s*:?\s*[\s\S]*?(?:respon\s*\/\s*)?(?:kelompok\s*b|kolom\s*b)\s*:?\s*/i, '');
    }
    value = value.replace(/,\s*(?=\n\s*[A-D]\s*[\).:-])/gi, '\n').replace(/,\s*$/gm, '');
    const matches = [...value.matchAll(/(^|\n|,|;)\s*([A-D])\s*[\).:-]\s*([\s\S]*?)(?=(?:\n|,|;)\s*[A-D]\s*[\).:-]|$)/gi)];
    if (matches.length >= 4) {
      return matches.slice(0, 4).map(match => `${match[2].toUpperCase()}. ${cleanStr(match[3]).replace(/,\s*$/g, '')}`).join('\n');
    }
    return value;
  };

  const normalizeMatchingOptionsText = (text) => {
    let value = cleanStr(text);
    value = value
      .replace(/((?:^|\n)\s*\d+\s*[\).:-][^\n]*?)\s*\/\s*(?:Respon\s*\/\s*)?(?:Kolom|Kelompok)\s*B\s*:?\s*/gi, '$1\nRespon / Kolom B:\n')
      .replace(/(?:^|\n)\s*(?:Respon\s*\/\s*)?(?:Kolom|Kelompok)\s*B\s*:?\s*/gi, '\nRespon / Kolom B:\n')
      .replace(/Respon\s*\n+\s*Respon\s*\/\s*(?:Kolom|Kelompok)\s*B\s*:/gi, 'Respon / Kolom B:')
      .replace(/(?:Respon\s*\/\s*(?:Kolom|Kelompok)\s*B\s*:?\s*){2,}/gi, 'Respon / Kolom B:\n')
      .replace(/,\s*(?=\n\s*(?:\d+|[A-H])\s*[\).:-])/gi, '\n')
      .replace(/,\s*$/gm, '');
    return cleanStr(value);
  };

  const hasClearStimulus = (text) => {
    const value = cleanStr(text);
    return value.length >= 110 && /(data|kasus|tabel|grafik|cerita|situasi|pengamatan|informasi|hasil|lingkungan|siswa|sekolah|angka|jumlah|fakta|laporan|observasi)/i.test(value);
  };

  const ensureStimulusQuality = (text, kisiRow, index, form) => {
    const value = cleanStr(text);
    if (hasClearStimulus(value)) return value;
    const materi = cleanStr(kisiRow?.materi) || cleanStr(rppData.topik) || "materi pembelajaran";
    const indikator = cleanStr(kisiRow?.indikator) || `indikator soal nomor ${index + 1}`;
    const context = cleanStr(rppData.situasiNyataSiswa) || "lingkungan sekolah dan kehidupan sehari-hari siswa";
    const level = cleanStr(kisiRow?.level) || "C4";
    const intro = `Dalam konteks ${context}, siswa mempelajari ${materi} melalui informasi/kasus yang memuat data atau fakta sederhana. Gunakan informasi tersebut untuk ${level} sesuai indikator: ${indikator}.`;
    const task = value || `Tentukan jawaban yang paling tepat berdasarkan stimulus tersebut.`;
    return cleanStr(`${intro}\n${task}`);
  };

  const normalizeAnswerGuideText = (text) => stripLeadingLabel(text, [
    "Pedoman\\s+Jawaban",
    "Pedoman\\s+jawab",
    "Kunci\\s+Jawaban",
    "Jawaban\\s+Uraian",
    "Jawaban",
    "Rubrik\\s+ringkas"
  ]);

  const buildMatchingTemplate = (kisiRow, index) => {
    const materi = cleanStr(kisiRow?.materi) || cleanStr(rppData.topik) || "materi";
    const indikator = cleanStr(kisiRow?.indikator) || `indikator soal nomor ${index + 1}`;
    return `Premis / Kolom A:\n1. Pernyataan tentang konsep utama ${materi}.\n2. Bukti/gejala yang harus dianalisis sesuai indikator.\n3. Dampak atau akibat dari proses pada ${materi}.\n4. Tindakan/kesimpulan yang tepat berdasarkan kasus.\n\nRespon / Kolom B:\nA. Konsep kunci yang sesuai dengan premis nomor 3.\nB. Bukti atau gejala yang sesuai dengan premis nomor 1.\nC. Dampak/akibat yang sesuai dengan premis nomor 4.\nD. Tindakan/kesimpulan yang sesuai dengan premis nomor 2.\n\nAcuan indikator: ${indikator}`;
  };

  const normalizeBankRowByKisi = (rawRow, kisiRow, index) => {
    const b = rawRow || {};
    const form = normalizeBentuk(kisiRow?.bentuk || bentukSoalUrut[index] || "");
    let split = splitChoiceOptionsFromSoal(b.soal, b.opsi, form);
    if (form === "Menjodohkan") split = splitMatchingOptionsFromSoal(split.soal, split.opsi);
    const fallbackSoal = `Bacalah stimulus kontekstual tentang ${cleanStr(kisiRow?.materi) || cleanStr(rppData.topik) || "materi"} berikut. Hubungkan setiap premis dengan respon yang paling tepat berdasarkan indikator: ${cleanStr(kisiRow?.indikator) || "indikator pembelajaran"}.`;
    let soal = ensureStimulusQuality(split.soal || fallbackSoal, kisiRow, index, form);
    let opsi = cleanStr(split.opsi);
    let kunci = cleanStr(b.kunci);
    if (form === "PG" || form === "PG Kompleks") opsi = normalizeChoiceOptionsText(opsi);
    if (form === "Menjodohkan") {
      opsi = normalizeMatchingOptionsText(opsi);
      const needsMatchingTemplate = countMatchingParts(opsi).premis < 4 || countMatchingParts(opsi).respon < 4;
      if (needsMatchingTemplate) opsi = buildMatchingTemplate(kisiRow, index);
      if (!kunci && needsMatchingTemplate) kunci = "1-B, 2-D, 3-A, 4-C";
    }
    if (form === "Isian Singkat") {
      if (!kunci && opsi && opsi !== "-") kunci = normalizeAnswerGuideText(opsi);
      opsi = "-";
    }
    if (form === "Uraian") {
      const guide = normalizeAnswerGuideText(opsi) || normalizeAnswerGuideText(kunci);
      opsi = guide || "-";
      kunci = "-";
    }
    if (form === "Praktik" || form === "Proyek") {
      opsi = normalizeAnswerGuideText(opsi) || normalizeAnswerGuideText(kunci) || "-";
      kunci = "-";
    }
    return {
      id: Date.now() + 'b' + index,
      soal,
      opsi,
      kunci: normalizeBankKey(kunci, form)
    };
  };

  const mapBankRows = (rows, kisi = rppData.kisiKisi) => {
    const total = kisi?.length || rows?.length || 0;
    return Array.from({ length: total }).map((_, i) => normalizeBankRowByKisi(rows?.[i], kisi?.[i], i));
  };

  const getBankRowForDisplay = (row, index) => {
    const kisi = rppData.kisiKisi[index] || { bentuk: bentukSoalUrut[index] || "" };
    const normalized = normalizeBankRowByKisi(row, kisi, index);
    return { ...row, soal: normalized.soal, opsi: normalized.opsi, kunci: normalized.kunci };
  };

  const getPertemuanActivitySummary = (data = rppData) => syncPertemuanPembelajaran(data).map((row, index) => (
    `Pertemuan ${index + 1}: Awal=${cleanStr(row.kegiatanAwal) || '-'} | Inti=${cleanStr(row.kegiatanInti) || '-'} | Penutup=${cleanStr(row.kegiatanPenutup) || '-'} | Target=${[row.pengalamanMemahami, row.pengalamanMengaplikasi, row.pengalamanMerefleksi].filter(Boolean).join(' | ') || '-'}`
  )).join('\n');

  const getDefaultLkpdRow = (index, data = rppData) => {
    const pertemuan = syncPertemuanPembelajaran(data)[index] || {};
    const topic = cleanStr(data.topik) || "topik pembelajaran";
    const tp = cleanStr(data.tp).replace(/\n+/g, '; ').slice(0, 300) || "tujuan pembelajaran pada modul ajar";
    const kegiatanInti = cleanStr(pertemuan.kegiatanInti) || "kegiatan inti pembelajaran";
    const asesmen = [pertemuan.asesmenAwal, pertemuan.asesmenProses, pertemuan.asesmenAkhir].map(cleanStr).filter(Boolean).join('\n');
    return {
      id: `lkpd-${index + 1}`,
      pertemuan: `Pertemuan ${index + 1}`,
      judul: `LKPD Pertemuan ${index + 1}: ${topic}`,
      tujuan: `1. Siswa mengerjakan aktivitas LKPD untuk mencapai TP modul: ${tp}.\n2. Siswa menghasilkan bukti belajar yang selaras dengan kegiatan pembelajaran pertemuan ${index + 1}.`,
      petunjuk: "1. Baca setiap instruksi dengan teliti.\n2. Kerjakan secara mandiri atau berkelompok sesuai arahan guru.\n3. Gunakan data, bukti, atau hasil pengamatan dari kegiatan pembelajaran.\n4. Tulis jawaban dengan alasan yang jelas.",
      sumberBahan: `Bahan/sumber: catatan kegiatan, materi esensial ${topic}, konteks nyata siswa, alat tulis, dan media/alat yang digunakan pada kegiatan inti.`,
      langkahKerja: `1. Amati atau baca kembali stimulus/kasus yang digunakan pada kegiatan inti.\n2. Kerjakan tugas sesuai alur kegiatan: ${kegiatanInti}\n3. Catat data, temuan, atau alasan penting yang mendukung jawaban.\n4. Susun produk/jawaban akhir sesuai kriteria keberhasilan.\n5. Periksa kembali jawaban menggunakan umpan balik guru/teman.`,
      produkBukti: `Produk/bukti belajar: jawaban LKPD, catatan data/pengamatan, kesimpulan, dan/atau produk kinerja yang sesuai dengan asesmen pertemuan.\nAcuan asesmen: ${asesmen || "asesmen awal, proses, dan akhir pada modul ajar."}`,
      refleksi: "1. Bagian mana yang paling membantu pemahamanmu?\n2. Bukti apa yang menunjukkan kamu sudah memahami materi?\n3. Kesulitan apa yang masih perlu dibantu?\n4. Apa perbaikan yang akan kamu lakukan pada tugas berikutnya?"
    };
  };

  const normalizeLkpdRow = (row = {}, index = 0, data = rppData) => {
    const fallback = getDefaultLkpdRow(index, data);
    return {
      id: row.id || fallback.id,
      pertemuan: cleanStr(row.pertemuan) || fallback.pertemuan,
      judul: cleanStr(row.judul) || fallback.judul,
      tujuan: cleanStr(row.tujuan) || fallback.tujuan,
      petunjuk: cleanStr(row.petunjuk) || fallback.petunjuk,
      sumberBahan: cleanStr(row.sumberBahan || row.bahanSumber || row.sumber) || fallback.sumberBahan,
      langkahKerja: cleanStr(row.langkahKerja || row.aktivitas || row.kegiatan) || fallback.langkahKerja,
      produkBukti: cleanStr(row.produkBukti || row.bukti || row.produk) || fallback.produkBukti,
      refleksi: cleanStr(row.refleksi) || fallback.refleksi
    };
  };

  const mapLkpdRows = (rows, data = rppData) => {
    const pertemuanRows = syncPertemuanPembelajaran(data);
    return pertemuanRows.map((_, index) => normalizeLkpdRow(Array.isArray(rows) ? rows[index] : {}, index, data));
  };

  useEffect(() => {
    const expectedLength = syncPertemuanPembelajaran(rppData).length;
    if ((rppData.lkpd || []).length === expectedLength) return;
    setRppData(prev => ({ ...prev, lkpd: mapLkpdRows(prev.lkpd, prev) }));
  }, [rppData.jumlahPertemuan, (rppData.lkpd || []).length]);

  useEffect(() => {
    if (!rppData.bankSoal.length) return;
    const normalizedRows = rppData.bankSoal.map((row, index) => ({ ...row, ...normalizeBankRowByKisi(row, rppData.kisiKisi[index] || { bentuk: bentukSoalUrut[index] || "" }, index), id: row.id }));
    const hasMovedOptions = normalizedRows.some((row, index) => row.soal !== rppData.bankSoal[index].soal || row.opsi !== rppData.bankSoal[index].opsi || row.kunci !== rppData.bankSoal[index].kunci);
    if (hasMovedOptions) setRppData(prev => ({ ...prev, bankSoal: normalizedRows }));
  }, [rppData.bankSoal, rppData.kisiKisi]);

  useEffect(() => {
    if (!rppData.rubrikPenilaian.length) return;
    const needsMigration = rppData.rubrikPenilaian.some(row => {
      const skor = cleanStr(row.skor);
      const kriteria = cleanStr(row.kriteria);
      return /^Rentang\s+Nilai\s*:/i.test(kriteria) ||
        /(^|\n)\s*Kriteria\s*[:=]/i.test(kriteria) ||
        /^Skor\s+\d+(?:\s*-\s*\d+)?\s*:/i.test(skor);
    });
    if (!needsMigration) return;
    const normalizedRows = rppData.rubrikPenilaian.map(row => ({ ...normalizeRubrikRow(row), id: row.id }));
    setRppData(prev => ({ ...prev, rubrikPenilaian: normalizedRows }));
  }, [rppData.rubrikPenilaian.length]);

  const countMatchingParts = (text) => {
    const clean = cleanStr(text);
    const premis = (clean.match(/(^|\n|\s)\d+\s*[\).:-]/g) || []).length;
    const respon = (clean.match(/(^|\n|\s)[A-H]\s*[\).:-]/gi) || []).length;
    return { premis, respon };
  };

  const countMatchingKeys = (text) => (cleanStr(text).match(/\d+\s*[-=]\s*[A-H]/gi) || []).length;

  const extractKeyLetters = (text) => {
    const upper = cleanStr(text).toUpperCase();
    const spaced = upper.match(/\b[A-D]\b/g) || [];
    if (spaced.length) return [...new Set(spaced)];
    const compact = upper.replace(/[^A-D]/g, '');
    if (/^[A-D]{1,4}$/.test(compact)) return [...new Set(compact.split(''))];
    return [];
  };

  const normalizeBankKey = (text, form) => {
    const normalizedForm = normalizeBentuk(form);
    const raw = cleanStr(text);
    if (!raw) return "";
    if (normalizedForm === "PG") {
      const letters = extractKeyLetters(raw);
      return letters.length === 1 ? letters[0] : raw;
    }
    if (normalizedForm === "PG Kompleks") {
      const letters = extractKeyLetters(raw).sort();
      return letters.length === 2 ? `${letters[0]} dan ${letters[1]}` : raw;
    }
    return raw;
  };

  const extractListItems = (text, markerPattern) => {
    const source = cleanStr(text).replace(/\s*\|\s*/g, '\n');
    const marker = new RegExp(`(^|\\n|,|;)\\s*${markerPattern}\\s*[\\).:-]\\s*`, 'gi');
    const matches = [...source.matchAll(marker)];
    return matches.map((m, idx) => {
      const label = m[2];
      const start = m.index + m[0].length;
      const end = idx + 1 < matches.length ? matches[idx + 1].index : source.length;
      const value = source.slice(start, end).replace(/^[\s,;|:\-]+|[\s,;|:\-]+$/g, '');
      return { label, value };
    }).filter(item => item.value);
  };

  const parseMatchingOptions = (text) => {
    const source = normalizeMatchingOptionsText(text);
    const split = source.match(/(?:premis|kelompok\s*a|kolom\s*a)\s*:?\s*([\s\S]*?)(?:respon|kelompok\s*b|kolom\s*b)\s*:?\s*([\s\S]*)/i);
    const premisSource = split ? split[1] : source;
    const responSource = split ? split[2] : source;
    return {
      premis: extractListItems(premisSource, '(\\d+)'),
      respon: extractListItems(responSource, '([A-H])')
    };
  };

  const hasRubrikScoreLogic = (form, scoreText, criteriaText = "") => {
    const score = cleanStr(`${scoreText || ""}\n${criteriaText || ""}`);
    if (!score) return false;
    if (form === "PG") return /\b1\b/.test(score) && /\b0\b/.test(score);
    if (form === "PG Kompleks") return /\b2\b/.test(score) && /\b0\b/.test(score);
    if (form === "Menjodohkan") return /\b4\b/.test(score) && /\b3\b/.test(score) && /\b2\b/.test(score) && /\b1\b/.test(score) && /\b0\b/.test(score);
    if (form === "Isian Singkat") return /\b2\b/.test(score) && /\b1\b/.test(score) && /\b0\b/.test(score);
    if (form === "Uraian") return /\b5\b/.test(score) && /\b4\b/.test(score) && /\b3\b/.test(score) && /\b2\b/.test(score) && /\b1\b/.test(score) && /\b0\b/.test(score);
    if (form === "Praktik" || form === "Proyek") return /\b10\b/.test(score) && /\b0\b/.test(score);
    return /\b4\b/.test(score) && /\b3\b/.test(score) && /\b2\b/.test(score) && /\b1\b/.test(score);
  };

  const mapRubrikByKisi = (rows, kisi = rppData.kisiKisi) => {
    const forms = getBentukPenilaianList(kisi);
    const byForm = {};
    (rows || []).forEach((row, i) => {
      const bentuk = normalizeBentuk(row.bentukPenilaian || row.bentuk || row.jenis || forms[i]);
      if (bentuk && !byForm[bentuk]) byForm[bentuk] = row;
    });
    return forms.map((bentuk, i) => {
      const src = byForm[bentuk] || {};
      return { ...normalizeRubrikRow(src, bentuk), id: src.id || Date.now() + 'r' + i, bentukPenilaian: bentuk };
    });
  };

  const syncRubrikFromKisi = () => {
    setRppData(prev => ({ ...prev, rubrikPenilaian: mapRubrikByKisi([], prev.kisiKisi) }));
    notify("Rubrik Disinkronkan", "Rubrik sudah dibuat ulang berdasarkan bentuk penilaian unik di kisi-kisi. Kolom skor hanya berisi skor maksimal, sedangkan rentang nilai masuk ke deskripsi.", "success");
  };

  const validateAssessmentStructure = (data = rppData) => {
    const warnings = [];
    const kisi = data.kisiKisi || [];
    const bank = data.bankSoal || [];
    const rubrik = data.rubrikPenilaian || [];
    const blueprint = getAssessmentBlueprint(data);
    const expectedSequence = getExpectedAssessmentSequence(data);
    const expectedTotal = expectedSequence.length;
    const requiredForms = kisi.length ? getBentukPenilaianList(kisi) : [...new Set(blueprint.map(row => row.bentuk))];
    if (expectedTotal < 1) warnings.push("Rencana Jumlah Soal belum valid. Isi minimal satu bentuk soal dengan jumlah lebih dari 0.");
    if (kisi.length !== expectedTotal) warnings.push(`Kisi-kisi harus tepat ${expectedTotal} baris sesuai rencana jumlah soal, saat ini ${kisi.length}.`);
    const hotsCount = kisi.filter(k => ["C4","C5","C6"].includes(k.level)).length;
    if (kisi.length >= expectedTotal && hotsCount < Math.ceil(expectedTotal * 0.6)) warnings.push(`Kisi-kisi perlu dominan C4-C6, saat ini baru ${hotsCount} indikator.`);
    const expectedGroups = {};
    const actualGroups = {};
    expectedSequence.forEach(shape => {
      const key = `${shape.bentuk}|${shape.level}`;
      expectedGroups[key] = (expectedGroups[key] || 0) + 1;
    });
    kisi.forEach(row => {
      const key = `${normalizeBentuk(row.bentuk)}|${cleanStr(row.level).toUpperCase()}`;
      actualGroups[key] = (actualGroups[key] || 0) + 1;
    });
    Object.keys(expectedGroups).forEach(key => {
      const [form, level] = key.split('|');
      const actual = actualGroups[key] || 0;
      if (actual !== expectedGroups[key]) warnings.push(`Rencana ${form} level ${level} harus tepat ${expectedGroups[key]} soal, saat ini ${actual}.`);
    });
    Object.keys(actualGroups).forEach(key => {
      if (!expectedGroups[key]) {
        const [form, level] = key.split('|');
        warnings.push(`Kisi-kisi memuat ${actualGroups[key]} soal ${form} level ${level} di luar rencana.`);
      }
    });
    kisi.forEach((k, i) => {
      if (!["C1","C2","C3","C4","C5","C6"].includes(cleanStr(k.level).toUpperCase())) warnings.push(`Kisi-kisi nomor ${i + 1}: level kognitif belum valid.`);
      const expected = expectedSequence[i];
      if (expected) {
        if (String(k.nomor || i + 1) !== String(i + 1)) warnings.push(`Kisi-kisi nomor ${i + 1}: kolom nomor harus ${i + 1}.`);
        if (normalizeBentuk(k.bentuk) !== expected.bentuk) warnings.push(`Kisi-kisi nomor ${i + 1}: bentuk harus ${expected.bentuk} sesuai rencana.`);
        if (cleanStr(k.level).toUpperCase() !== expected.level) warnings.push(`Kisi-kisi nomor ${i + 1}: level harus ${expected.level} sesuai rencana.`);
      }
      if (cleanStr(k.indikator) && ![data.tp, data.cp, data.materiEsensial, data.topik].some(src => cleanStr(src).split(/\s+/).some(word => word.length > 6 && cleanStr(k.indikator).toLowerCase().includes(word.toLowerCase())))) {
        warnings.push(`Kisi-kisi nomor ${i + 1}: indikator perlu lebih tampak menurunkan CP/TP/materi modul.`);
      }
    });
    if (bank.length !== expectedTotal) warnings.push(`Bank soal harus tepat ${expectedTotal} butir sesuai rencana jumlah soal, saat ini ${bank.length}.`);
    bank.forEach((b, i) => {
      const bentuk = normalizeBentuk(kisi[i]?.bentuk || expectedSequence[i]?.bentuk);
      const normalizedBankRow = normalizeBankRowByKisi(b, kisi[i] || expectedSequence[i], i);
      const opsi = cleanStr(normalizedBankRow.opsi);
      const kunci = cleanStr(normalizedBankRow.kunci).toUpperCase();
      const letters = extractKeyLetters(kunci);
      if (!hasClearStimulus(normalizedBankRow.soal)) warnings.push(`Soal ${i + 1}: stimulus HOTS/literasi-numerasi perlu dibuat lebih jelas.`);
      if ((bentuk === "PG" || bentuk === "PG Kompleks") && !["A","B","C","D"].every(l => new RegExp(`(^|\\n|\\s)${l}[\\).:-]`, "i").test(opsi))) warnings.push(`Soal ${i + 1}: opsi A-D belum lengkap.`);
      if (bentuk === "PG" && letters.length !== 1) warnings.push(`Soal ${i + 1}: PG biasa harus punya 1 kunci.`);
      if (bentuk === "PG Kompleks" && letters.length !== 2) warnings.push(`Soal ${i + 1}: PG Kompleks harus tepat 2 kunci benar.`);
      if (bentuk === "Menjodohkan") {
        const parts = countMatchingParts(opsi);
        const keys = countMatchingKeys(normalizedBankRow.kunci);
        if (!/(premis|kelompok\s*a|kolom\s*a).*(respon|kelompok\s*b|kolom\s*b)/is.test(opsi)) warnings.push(`Soal ${i + 1}: menjodohkan harus memuat Premis/Kelompok A dan Respon/Kelompok B.`);
        if (parts.premis < 4 || parts.respon < 4 || keys < 4) warnings.push(`Soal ${i + 1}: menjodohkan minimal 4 premis, 4 respon, dan 4 pasangan kunci.`);
        if (/1\s*[-=]\s*A.*2\s*[-=]\s*B.*3\s*[-=]\s*C.*4\s*[-=]\s*D/is.test(b.kunci)) warnings.push(`Soal ${i + 1}: pasangan menjodohkan masih terlalu berurutan, acak posisi respon agar tidak mudah ditebak.`);
      }
      if (bentuk === "Uraian" && (!opsi || opsi === "-")) warnings.push(`Soal ${i + 1}: uraian perlu pedoman/kunci jawaban ringkas di kolom pedoman jawab.`);
      if (bentuk === "Isian Singkat" && !cleanStr(normalizedBankRow.kunci)) warnings.push(`Soal ${i + 1}: isian singkat perlu kunci jawaban singkat yang pasti.`);
      if ((bentuk === "Praktik" || bentuk === "Proyek") && !/(rambu|pedoman|langkah|produk|kinerja|kriteria|rubrik)/i.test(opsi)) warnings.push(`Soal ${i + 1}: ${bentuk} perlu rambu/pedoman pengerjaan di kolom pedoman jawab.`);
    });
    requiredForms.forEach(form => {
      if (!rubrik.some(r => normalizeBentuk(r.bentukPenilaian) === form)) warnings.push(`Rubrik belum memuat bentuk penilaian: ${form}.`);
    });
    rubrik.forEach((r, i) => {
      const form = normalizeBentuk(r.bentukPenilaian);
      if (!cleanStr(r.bentukPenilaian)) warnings.push(`Rubrik nomor ${i + 1}: bentuk penilaian belum diisi.`);
      if (!hasRubrikScoreLogic(form, r.skor, r.kriteria)) warnings.push(`Rubrik ${r.bentukPenilaian || i + 1}: aturan skor belum sesuai bentuk penilaian.`);
    });
    return warnings;
  };

  const validateLkpdStructure = (data = rppData) => {
    const warnings = [];
    const pertemuanRows = syncPertemuanPembelajaran(data);
    const lkpdRows = Array.isArray(data.lkpd) ? data.lkpd : [];
    if (lkpdRows.length !== pertemuanRows.length) warnings.push(`LKPD harus tepat ${pertemuanRows.length} bagian sesuai jumlah pertemuan, saat ini ${lkpdRows.length}.`);
    lkpdRows.forEach((row, index) => {
      const merged = cleanStr(`${row.judul} ${row.tujuan} ${row.petunjuk} ${row.sumberBahan} ${row.langkahKerja} ${row.produkBukti} ${row.refleksi}`).toLowerCase();
      const pertemuanText = cleanStr(`${pertemuanRows[index]?.kegiatanAwal} ${pertemuanRows[index]?.kegiatanInti} ${pertemuanRows[index]?.kegiatanPenutup} ${pertemuanRows[index]?.pengalamanMemahami} ${pertemuanRows[index]?.pengalamanMengaplikasi} ${pertemuanRows[index]?.pengalamanMerefleksi} ${pertemuanRows[index]?.asesmenAwal} ${pertemuanRows[index]?.asesmenProses} ${pertemuanRows[index]?.asesmenAkhir}`).toLowerCase();
      if (!cleanStr(row.judul)) warnings.push(`LKPD pertemuan ${index + 1}: judul belum diisi.`);
      if (countMeaningfulLines(row.tujuan) < 1) warnings.push(`LKPD pertemuan ${index + 1}: tujuan belum jelas.`);
      if (countMeaningfulLines(row.langkahKerja) < 3) warnings.push(`LKPD pertemuan ${index + 1}: langkah kerja perlu minimal 3 langkah operasional.`);
      if (!/(produk|bukti|jawaban|data|hasil|kinerja|kesimpulan)/i.test(row.produkBukti || "")) warnings.push(`LKPD pertemuan ${index + 1}: produk/bukti belajar perlu lebih eksplisit.`);
      if (pertemuanText && merged && !pertemuanText.split(/\s+/).some(word => word.length > 7 && merged.includes(word))) warnings.push(`LKPD pertemuan ${index + 1}: isi perlu lebih tampak mengikuti kegiatan pembelajaran pertemuan tersebut.`);
    });
    return warnings;
  };

  const callGeminiAPI = async (payload) => {
    const apiKey = getActiveApiKey(); 
    const model = apiKey ? "gemini-2.5-flash" : "gemini-2.5-flash-preview-09-2025";
    const baseUrl = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent`;
    const url = apiKey ? baseUrl : `${baseUrl}?key=`;
    
    const delays = [1000, 2000, 4000, 8000]; 
    let lastError = null;

      }
    } catch (error) {

  const handleRegenerateBankItem = async (index) => {
    const kisi = rppData.kisiKisi[index];

    const mapelCpGuidance = getMapelCpGuidance(rppData.mapel, rppData.kelas);
    const prompt = `Generate ulang SATU butir Bank Soal nomor ${index + 1} sesuai kisi-kisi berikut.

KONTEKS:

ATURAN:
1. Kolom soal hanya berisi stimulus HOTS/literasi-numerasi minimal 3 kalimat atau 2 kalimat panjang dan pertanyaan/perintah. Stimulus harus memuat konteks, data/fakta/angka/informasi, dan masalah yang perlu dianalisis. Jangan masukkan opsi A-D, premis-respon, pedoman jawaban, atau kunci ke kolom soal.

   - Isian Singkat: isi "-"; kunci berisi jawaban singkat pasti.

Keluarkan JSON object murni: {"soal":"...","opsi":"...","kunci":"..."}`;

    const payload = {
      contents: [{ parts: [{ text: prompt }] }],

      generationConfig: stableGenerationConfig({
        temperature: 0.12,

        responseMimeType: "application/json",

        bank[index] = { ...bank[index], ...mapped, id: bank[index]?.id || mapped.id };

      });
      const warnings = validateAssessmentStructure({ ...rppData, bankSoal: rppData.bankSoal.map((row, i) => i === index ? mapped : row) }).filter(w => w.includes(`Soal ${index + 1}:`));

  const escapeHtml = (txt) => cleanStr(txt).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const normalizeInlineWordText = (txt) => cleanStr(txt).replace(/\s*\n+\s*/g, ' ').replace(/\s{2,}/g, ' ').trim();
  const formatKeyForExport = (key, form) => normalizeBankKey(key, form);
  const formatText = (txt) => {
    const lines = cleanStr(txt).split(/\n+/).map(line => line.trim()).filter(Boolean);
    if (!lines.length) return '';
    const getMarker = (line) => {
      let match = line.match(/^(\d+)[\.)]\s+(.+)$/);
      if (match) return { type: 'num', tag: 'ol', attr: `class="num-list" style="margin-top:0;margin-bottom:0;margin-left:0pt;padding-left:0pt;text-align:justify" start="${parseInt(match[1], 10) || 1}"`, text: match[2] };
      match = line.match(/^([A-Z])[\.)]\s+(.+)$/);
      if (match) return { type: 'upper', tag: 'ol', attr: `class="letter-list" style="margin-top:0;margin-bottom:0;margin-left:0pt;padding-left:0pt;text-align:justify" type="A" start="${match[1].charCodeAt(0) - 64}"`, text: match[2] };
      match = line.match(/^([a-z])[\.)]\s+(.+)$/);
      if (match) return { type: 'lower', tag: 'ol', attr: `class="lower-letter-list" style="margin-top:0;margin-bottom:0;margin-left:0pt;padding-left:0pt;text-align:justify" type="a" start="${match[1].charCodeAt(0) - 96}"`, text: match[2] };
      match = line.match(/^[-•]\s+(.+)$/);
      if (match) return { type: 'bullet', tag: 'ul', attr: 'class="bullet-list" style="margin-top:0;margin-bottom:0;margin-left:0pt;padding-left:0pt;text-align:justify"', text: match[1] };
      return null;
    };
    const html = [];
    let list = null;
    const flushList = () => {
      if (!list) return;
      html.push(`<${list.tag} ${list.attr}>${list.items.map(item => `<li style="margin:0 0 1pt 0;text-align:justify;line-height:1.05;mso-line-height-rule:exactly">${escapeHtml(item)}</li>`).join('')}</${list.tag}>`);
      list = null;
    };
    lines.forEach(line => {
      const marker = getMarker(line);
      if (marker) {
        const sameList = list && list.type === marker.type && list.tag === marker.tag;
        if (!sameList) {
          flushList();
          list = { type: marker.type, tag: marker.tag, attr: marker.attr, items: [] };
        }
        list.items.push(marker.text);
      } else {
        flushList();
        html.push(`<p class="text-line">${escapeHtml(line)}</p>`);
      }
    });
    flushList();
    return html.join('');
  };
  const formatAssessmentText = (txt) => {
    let value = cleanStr(txt);

    value = value.replace(/(^|\n)\s*(\d+[\.)])\s*\n+\s*(Teknik|Bukti|Cara\s+membaca|Tindak\s+lanjut)\s*:/gi, '$1$2 $3:');
    const marker = /(?:^|\n|\s)(?:\d+[\.)]\s*)?(Teknik|Bukti|Cara\s+membaca|Tindak\s+lanjut)\s*:/gi;
    const matches = [...value.matchAll(marker)];
    if (!matches.length) return formatText(value);
    const items = matches.map((match, index) => {
      const labelRaw = match[1].replace(/\s+/g, " ").toLowerCase();
      const canonical = labelRaw === "cara membaca" ? "Cara membaca" : labelRaw === "tindak lanjut" ? "Tindak lanjut" : labelRaw.charAt(0).toUpperCase() + labelRaw.slice(1);
      const start = match.index + match[0].length;
      const end = index + 1 < matches.length ? matches[index + 1].index : value.length;
      const body = cleanStr(value.slice(start, end).replace(/^\s*[\n;,-]+/, ''));
      return { label: canonical, body };

    return `<ol class="num-list" style="margin-top:0;margin-bottom:0;margin-left:0pt;padding-left:8pt;text-align:justify">${items.map(item => `<li style="margin:0 0 1pt 0;text-align:justify;line-height:1.05;mso-line-height-rule:exactly"><strong>${item.label}:</strong> ${escapeHtml(item.body)}</li>`).join('')}</ol>`;

    if (!items.length) return formatText(value);

    return `<ol class="letter-list choice-list" type="A" start="${start}" style="margin-top:0;margin-bottom:0;margin-left:0pt;padding-left:8pt;text-align:left">${items.map(match => `<li style="margin:0 0 1pt 0;text-align:left;line-height:1.05;mso-line-height-rule:exactly">${escapeHtml(normalizeInlineWordText(match[3]))}</li>`).join('')}</ol>`;

  const formatOptionsForWord = (text, form) => {

    if (normalizedForm === "Uraian" || normalizedForm === "Praktik" || normalizedForm === "Proyek") return formatText(normalizeAnswerGuideText(text) || "-");
    if (normalizedForm !== "Menjodohkan") return formatText(text);

    const rows = Array.from({ length: maxRows }).map((_, i) => {

    let pKeys = Object.keys(profilLabels);

    const kseHtml = formatChecklistForWord(kKeys, kseLabels, rppData.kseLulusan, "#1e40af");
    const pertemuanWordRows = syncPertemuanPembelajaran(rppData).map((pertemuan, index) => `

  const getActivityConsequenceWarnings = () => {
    const warnings = [];

    Object.keys(rppData.profilLulusan || {}).filter(k => rppData.profilLulusan[k]).forEach(k => {
      const label = profilLabels[k].toLowerCase().split(/\s+/).find(w => w.length > 6);

    });
    Object.keys(rppData.kseLulusan || {}).filter(k => rppData.kseLulusan[k]).forEach(k => {
      const label = kseLabels[k].toLowerCase().split(/\s+/).find(w => w.length > 6);

    if (Object.values(rppData.profilLulusan || {}).some(Boolean) && !cleanStr(rppData.profilAlasan)) warnings.push("Alasan dan konsekuensi profil lulusan belum diisi.");

  const getPmCoherenceWarnings = () => {
    const warnings = [];
    const tp = cleanStr(rppData.tp).toLowerCase();
    const cp = cleanStr(rppData.cp).toLowerCase();
    const pertemuanRows = syncPertemuanPembelajaran(rppData);
    const kegiatan = cleanStr(pertemuanRows.map(row => `${row.kegiatanAwal} ${row.kegiatanInti} ${row.kegiatanPenutup}`).join(' ')).toLowerCase();
    const asesmen = cleanStr(pertemuanRows.map(row => `${row.asesmenAwal} ${row.asesmenProses} ${row.asesmenAkhir}`).join(' ')).toLowerCase();
    const measurable = /(menganalisis|mengevaluasi|merancang|menyusun|menjelaskan|membandingkan|mengidentifikasi|menyimpulkan|membuktikan|menerapkan|menyajikan)/i;
    const countLines = (value) => cleanStr(value).split(/\n+/).filter(line => line.replace(/^[-\d\.\)\s]+/, '').trim().length > 18).length;
    const tpCount = countLines(rppData.tp);
    if (!cleanStr(rppData.situasiNyataSiswa)) warnings.push("Situasi nyata lingkungan siswa belum diisi sebagai konteks PM.");
    if (!cleanStr(rppData.materiEsensial)) warnings.push("Materi esensial/pokok materi belum diisi di TAHAP 2.");
    if (cleanStr(rppData.kompetensiAwal) && (countLines(rppData.kompetensiAwal) < 2 || !/(prasyarat|sebelum|telah|mampu|pernah|dasar|awal|memahami|menjelaskan|mengidentifikasi)/i.test(rppData.kompetensiAwal))) warnings.push("Kompetensi awal perlu lebih eksplisit sebagai prasyarat materi.");
    if (cleanStr(rppData.kesiapanSiswa) && !/(kognitif|motivasi|kebiasaan|dukungan|sosial|emosi)/i.test(rppData.kesiapanSiswa)) warnings.push("Kesiapan peserta didik sebaiknya memuat kognitif, motivasi, kebiasaan belajar, dan kebutuhan dukungan.");
    if (cleanStr(rppData.karakteristikMateri) && !/(faktual|konseptual|prosedural|kontekstual|lintas|disiplin)/i.test(rppData.karakteristikMateri)) warnings.push("Karakteristik materi perlu menyebut sifat faktual/konseptual/prosedural/kontekstual/lintas disiplin.");
    if (tp && !measurable.test(tp)) warnings.push("Tujuan Pembelajaran perlu memakai kata kerja operasional yang dapat diukur.");
    if (tp && tpCount < 3) warnings.push("Tujuan Pembelajaran sebaiknya minimal 3 butir yang menurunkan CP.");
    if (cp && tp && !tp.split(/\s+/).some(w => w.length > 6 && cp.includes(w))) warnings.push("TP belum tampak menurunkan CP secara langsung.");
    if (tp && kegiatan && !tp.split(/\s+/).some(w => w.length > 6 && kegiatan.includes(w))) warnings.push("Kegiatan belajar belum cukup menampakkan latihan terhadap TP.");
    if (tp && asesmen && !tp.split(/\s+/).some(w => w.length > 6 && asesmen.includes(w))) warnings.push("Asesmen belum cukup jelas mengukur TP.");
    if (pertemuanRows.some(row => countLines(row.pengalamanMemahami) < 2 || countLines(row.pengalamanMengaplikasi) < 2 || countLines(row.pengalamanMerefleksi) < 2)) warnings.push("Pengalaman belajar di setiap pertemuan perlu lebih eksplisit memuat memahami, mengaplikasi, dan merefleksi.");
    const mapelText = cleanStr(rppData.mapel).toLowerCase();

    if (mapelText.includes("bahasa jawa") && curricularText && !/(jawa|unggah|undha|aksara|sastra|geguritan|tembang|cerkak|wayang|paramasastra|pacelathon|pawarta)/i.test(curricularText)) {
      warnings.push("Bahasa Jawa perlu tampak sebagai bahasa/sastra/aksara/budaya Jawa, bukan bahasa umum.");

        }

      const safeRows = (rows, name) => rows.length ? rows : [{ "Informasi": `Tidak ada data ${name}` }];
      const autoFitColumnWidth = (header, rows, minWidth = 8, maxWidth = 72) => {
        const maxLine = Math.max(header.length, ...rows.map(row => String(row[header] || '').split(/\r?\n/).reduce((m, line) => Math.max(m, line.length), 0)));
        return Math.min(maxWidth, Math.max(minWidth, Math.ceil(maxLine * 1.02) + 2));
      };
      const autoFitRowHeight = (row, headers, widths) => {
        const estimatedLines = headers.map((header, idx) => {

      const getExcelAlignment = (sheetName, colNumber, rowNumber) => {

          if (colNumber === 1) return { wrapText: true, vertical: "top", horizontal: "center" };
          if (colNumber === 4) return { wrapText: true, vertical: "center", horizontal: "center" };
          return { wrapText: true, vertical: "top", horizontal: "justify" };

          return { wrapText: true, vertical: "top", horizontal: "justify" };
        }
        return { wrapText: true, vertical: "top" };
      };
      const saveBlob = (blob, filename) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

            const headers = getHeaders(rows);

            ws.views = [{ state: "frozen", ySplit: 1 }];
            ws.addRow(headers);
            rows.forEach(row => ws.addRow(headers.map(h => row[h] ?? "")));

            });

        ws['!cols'] = widths.map(width => ({ wch: width }));
        ws['!rows'] = [{ hpt: 24 }, ...rows.map(row => ({ hpt: autoFitRowHeight(row, headers, widths) }))];
        ws['!autofilter'] = { ref: ws['!ref'] };
        XLSX.utils.book_append_sheet(wb, ws, sheet.name);

class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Aplikasi gagal render:", error, info);
  }
  render() {
    if (this.state.error) {
      const message = this.state.error?.message || String(this.state.error);
      return (
        <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
          <div className="bg-white max-w-2xl w-full rounded-2xl border border-red-200 shadow-xl overflow-hidden">
            <div className="bg-red-600 text-white p-5">
              <h1 className="font-black text-xl">Aplikasi gagal dimuat</h1>
              <p className="text-sm text-red-100 mt-1">Data lama atau error render membuat tampilan berhenti.</p>
            </div>
            <div className="p-5 text-sm text-slate-700">
              <p className="leading-relaxed mb-3">Coba muat ulang halaman. Jika tetap terjadi, simpan pesan error ini agar bisa diperiksa.</p>
              <pre className="whitespace-pre-wrap bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs overflow-auto">{message}</pre>
            </div>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
