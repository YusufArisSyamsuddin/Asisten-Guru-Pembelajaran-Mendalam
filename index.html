<body class="bg-slate-50 font-sans text-slate-800">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const Card = ({ children, className = "" }) => (<div className={`bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden ${className}`}>{children}</div>);

const Accordion = ({ title, icon, subtitle, children, defaultOpen = false, isCompleted, onToggleComplete, headerColorClass = "bg-blue-100 text-blue-700" }) => {
  const [isOpen, setIsOpen] = useState(defaultOpen);
  return (
    <Card className={`mb-5 transition-all duration-300 ${isCompleted ? 'border-l-4 border-l-green-500 opacity-80 bg-slate-50' : 'border-l-4 border-l-blue-600'}`}>
      <div className="flex items-center justify-between p-3 sm:p-4 hover:bg-slate-50 cursor-pointer" onClick={() => setIsOpen(!isOpen)}>
        <div className="flex-1 flex items-center space-x-3 sm:space-x-4 text-left">
          <div className={`w-10 h-10 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center shadow-sm shrink-0 ${isCompleted ? 'bg-green-100 text-green-700' : headerColorClass}`}>
            <i className={`${icon} text-lg sm:text-xl`}></i>
          </div>
          <div>
            <h3 className={`font-bold text-base sm:text-lg leading-tight ${isCompleted ? 'text-green-800 line-through decoration-green-400' : 'text-slate-800'}`}>{title}</h3>
            {subtitle && <p className="text-xs sm:text-sm font-medium text-slate-500 mt-0.5">{subtitle}</p>}
          </div>
        </div>
        <div className="flex items-center space-x-2 sm:space-x-3" onClick={(e) => e.stopPropagation()}>
          <button onClick={onToggleComplete} className={`w-7 h-7 sm:w-8 sm:h-8 shrink-0 rounded-full flex items-center justify-center border-2 transition-colors shadow-sm ${isCompleted ? 'bg-green-500 border-green-500 text-white' : 'border-slate-300 bg-white text-transparent hover:border-green-400'}`} title="Tandai Selesai">✓</button>
          <button onClick={() => setIsOpen(!isOpen)} className="p-2 shrink-0">{isOpen ? <i className="fas fa-chevron-up text-slate-500"></i> : <i className="fas fa-chevron-down text-slate-500"></i>}</button>
        </div>
      </div>
      {isOpen ? <div className="p-4 sm:p-5 border-t border-slate-200 bg-white overflow-x-auto">{children}</div> : null}
    </Card>
  );
};

const LabelWithHint = ({ children, hint, className="block text-slate-700 font-semibold mb-1", onRegenerate, isLoading }) => {
  const [showHint, setShowHint] = useState(false);
  return (
    <div className="mb-1 w-full">
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2">
          <label className={className}>{children}</label>
          {onRegenerate ? (
            <button 
              type="button" 
              onClick={onRegenerate} 
              disabled={isLoading} 
              className={`w-6 h-6 shrink-0 flex items-center justify-center rounded-full transition-all shadow-sm border ${isLoading ? 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed' : 'bg-fuchsia-100 text-fuchsia-600 border-fuchsia-200 hover:bg-fuchsia-600 hover:text-white'}`} 
              title="Generate ulang bagian ini saja"
            >
              <i className={`fas fa-sync-alt text-[10px] ${isLoading ? 'fa-spin' : ''}`}></i>
            </button>
          ) : null}
        </div>
        {hint ? <button type="button" onClick={() => setShowHint(!showHint)} className={`ml-2 shrink-0 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded transition-colors flex items-center shadow-sm ${showHint ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-white border border-slate-300 text-slate-500 hover:bg-slate-100 hover:text-slate-800'}`} title="Klik untuk bantuan pengisian"><i className={`fas ${showHint ? 'fa-times' : 'fa-info-circle'} mr-1`}></i> <span className="hidden sm:inline">{showHint ? 'Tutup' : 'Petunjuk'}</span></button> : null}
      </div>
      {showHint ? <div className="mt-2 mb-3 p-3 bg-blue-50/80 border border-blue-200 text-blue-800 text-xs rounded-lg shadow-inner leading-relaxed whitespace-pre-wrap"><i className="fas fa-lightbulb text-yellow-500 mr-2 text-sm"></i>{hint}</div> : null}
    </div>
  );
};

function App() {
  const [completedSteps, setCompletedSteps] = useState({});
  const [isEditing, setIsEditing] = useState(false);
  const [isGenerating, setIsGenerating] = useState(false);
  const [individualLoading, setIndividualLoading] = useState({});
  const [countdown, setCountdown] = useState(0); 
  const [aiHistory, setAiHistory] = useState([]);
  
  const [instruksiKhusus, setInstruksiKhusus] = useState(() => localStorage.getItem('asistenGuru_instruksiKhusus_v43') || ""); 
  
  const [showApiModal, setShowApiModal] = useState(false);
  const [geminiApiKey, setGeminiApiKey] = useState(() => sessionStorage.getItem('gemini_api_key_eksternal_v2') || localStorage.getItem('gemini_api_key_eksternal_v2') || "");
  const [tempApiKey, setTempApiKey] = useState("");
  const [popup, setPopup] = useState(null);

  const notify = (title, message, type = "info") => setPopup({ title, message, type });
  const confirmPopup = (title, message, onConfirm) => setPopup({ title, message, type: "confirm", onConfirm });

  const saveApiKey = () => {
    const cleanedKey = tempApiKey.trim();
    if (!cleanedKey) {
      localStorage.removeItem('gemini_api_key_eksternal_v2');
      sessionStorage.removeItem('gemini_api_key_eksternal_v2');
      setGeminiApiKey("");
      setShowApiModal(false);
      notify("API Key Dikosongkan", "Generate AI belum bisa berjalan sampai API key Gemini diisi kembali.", "warning");
      return;
    }
    sessionStorage.setItem('gemini_api_key_eksternal_v2', cleanedKey);
    localStorage.removeItem('gemini_api_key_eksternal_v2');
    setGeminiApiKey(cleanedKey);
    setShowApiModal(false);
    notify("API Key Tersimpan", "API key berhasil disimpan di perangkat ini. Generate AI sekarang memakai key tersebut.", "success");
  };

  const getInjectedApiKey = () => {
    const candidates = [];
    if (typeof window !== "undefined") {
      candidates.push(window.GEMINI_API_KEY, window.GOOGLE_API_KEY, window.GOOGLE_GENAI_API_KEY, window.GENERATIVE_LANGUAGE_API_KEY, window.API_KEY, window.__GEMINI_API_KEY__, window.__GOOGLE_API_KEY__, window.__API_KEY__);
    }
    if (typeof process !== "undefined" && process.env) {
      candidates.push(process.env.GEMINI_API_KEY, process.env.GOOGLE_API_KEY, process.env.GOOGLE_GENAI_API_KEY, process.env.GENERATIVE_LANGUAGE_API_KEY, process.env.API_KEY);
    }
    return (candidates.find(k => typeof k === "string" && k.trim()) || "").trim();
  };

  const getActiveApiKey = () => (geminiApiKey || "").trim() || getInjectedApiKey();
  const hasActiveApiKey = () => Boolean(getActiveApiKey());

  const isAnyLoading = isGenerating || Object.values(individualLoading).some(v => v === true);

  useEffect(() => { localStorage.setItem('asistenGuru_instruksiKhusus_v43', instruksiKhusus); }, [instruksiKhusus]);

  useEffect(() => {
    let timer;
    if (isAnyLoading && countdown > 0) {
      timer = setTimeout(() => setCountdown(c => c - 1), 1000);
    }
    return () => clearTimeout(timer);
  }, [isAnyLoading, countdown]);

  const profilLabels = { keimanan: "Keimanan dan Ketakwaan terhadap Tuhan YME", kewargaan: "Kewargaan", penalaran: "Penalaran Kritis", kreativitas: "Kreativitas", kolaborasi: "Kolaborasi", kemandirian: "Kemandirian", kesehatan: "Kesehatan", komunikasi: "Komunikasi" };
  const profilHints = {
    keimanan: "Menguatkan akhlak, syukur, tanggung jawab moral, dan sikap menghargai ciptaan Tuhan.",
    kewargaan: "Menguatkan kepedulian pada aturan, hak-kewajiban, musyawarah, dan kontribusi pada lingkungan.",
    penalaran: "Menguatkan kemampuan membaca data, mencari bukti, membandingkan alasan, dan mengambil simpulan.",
    kreativitas: "Menguatkan kemampuan membuat gagasan/produk/cara baru yang relevan dengan masalah nyata.",
    kolaborasi: "Menguatkan kemampuan berbagi peran, mendengar, memberi kontribusi, dan menyelesaikan tugas bersama.",
    kemandirian: "Menguatkan kemampuan menetapkan tujuan, memilih strategi belajar, dan mengevaluasi hasil sendiri.",
    kesehatan: "Menguatkan kebiasaan aman, sehat, seimbang, dan sadar risiko dalam aktivitas belajar.",
    komunikasi: "Menguatkan kemampuan menyampaikan gagasan, data, pertanyaan, dan refleksi secara jelas."
  };
  const kseLabels = { kesadaranDiri: "Kesadaran Diri", manajemenDiri: "Manajemen Diri", kesadaranSosial: "Kesadaran Sosial", keterampilanBerelasi: "Keterampilan Berelasi", keputusanBertanggungJawab: "Keputusan Bertanggung Jawab" };
  const kseHints = {
    kesadaranDiri: "Siswa mengenali emosi, kekuatan, kebutuhan bantuan, dan tujuan belajarnya.",
    manajemenDiri: "Siswa mengelola fokus, waktu, usaha, dan strategi saat menyelesaikan tugas.",
    kesadaranSosial: "Siswa peka pada perbedaan, kebutuhan teman, dan konteks sosial di kelas.",
    keterampilanBerelasi: "Siswa berlatih mendengar, bertanya, memberi umpan balik, dan bekerja sama.",
    keputusanBertanggungJawab: "Siswa memilih tindakan berdasarkan bukti, nilai, aturan, dan dampaknya."
  };
  const bentukSoalUrut = ["PG", "PG", "PG Kompleks", "PG Kompleks", "Menjodohkan", "Menjodohkan", "Isian Singkat", "Isian Singkat", "Uraian", "Uraian"];
  const skorBentuk = {
    PG: "1 = jawaban benar\n0 = jawaban salah/kosong",
    "PG Kompleks": "2 = tepat 2 pilihan benar\n0 = salah, kurang, lebih, atau kosong",
    Menjodohkan: "4 = 4 pasangan benar\n3 = 3 pasangan benar\n2 = 2 pasangan benar\n1 = 1 pasangan benar\n0 = tidak ada pasangan benar",
    "Isian Singkat": "2 = jawaban tepat\n1 = sebagian tepat\n0 = salah/kosong",
    Uraian: "5 = lengkap, benar, beralasan, dan memakai bukti\n4 = benar tetapi kurang rinci\n3 = cukup tepat tetapi bukti terbatas\n2 = sebagian konsep benar\n1 = sangat terbatas\n0 = salah/kosong",
    Praktik: "4 = sangat baik\n3 = baik\n2 = cukup\n1 = perlu bimbingan\n0 = tidak menunjukkan evidensi",
    Proyek: "4 = sangat baik\n3 = baik\n2 = cukup\n1 = perlu bimbingan\n0 = tidak menunjukkan evidensi"
  };

  const defaultDataObj = {
    namaSekolah: "SMP Negeri 2 Secang", namaGuru: "YUSUF ARIS SYAMSUDDIN, S.Pd.", tahunPelajaran: "2025/2026", nipGuru: "19950430 202321 1 004", namaKepsek: "", nipKepsek: "", mapel: "", kelas: "", topik: "", waktu: "2 x 40 Menit", jumlahPertemuan: "1 Pertemuan", kompetensiAwal: "", kesiapanSiswa: "", karakteristikMateri: "", situasiNyataSiswa: "",
    profilLulusan: { keimanan: false, kewargaan: false, penalaran: false, kreativitas: false, kolaborasi: false, kemandirian: false, kesehatan: false, komunikasi: false },
    profilAlasan: "",
    kseLulusan: { kesadaranDiri: false, manajemenDiri: false, kesadaranSosial: false, keterampilanBerelasi: false, keputusanBertanggungJawab: false },
    kseAlasan: "",
    cp: "", lintasDisiplin: "", tp: "", praktikPedagogis: "Pembelajaran Mendalam", kemitraanPembelajaran: "", lingkunganPembelajaran: "", pemanfaatanDigital: "",
    kegiatanAwal: "", kegiatanInti: "", kegiatanPenutup: "", pengalamanMemahami: "", pengalamanMengaplikasi: "", pengalamanMerefleksi: "", asesmenAwal: "", asesmenProses: "", asesmenAkhir: "", catatanRefleksi: "",
    kisiKisi: [], bankSoal: [], rubrikPenilaian: []
  };

  const [rppData, setRppData] = useState(() => {
    const saved = localStorage.getItem('asistenGuruData_v42');
    if (saved) {
      try {
        let p = JSON.parse(saved);
        if (Array.isArray(p.praktikPedagogis)) p.praktikPedagogis = p.praktikPedagogis.join(', ');
        return { ...defaultDataObj, ...p };
      } catch (e) {}
    }
    return defaultDataObj;
  });

  useEffect(() => { localStorage.setItem('asistenGuruData_v42', JSON.stringify(rppData)); }, [rppData]);

  const toggleStep = (id) => setCompletedSteps(p => ({ ...p, [id]: !p[id] }));
  const handleInputChange = (e) => setRppData(p => ({ ...p, [e.target.name]: e.target.value }));
  const handleProfilChange = (k) => setRppData(p => ({ ...p, profilLulusan: { ...p.profilLulusan, [k]: !p.profilLulusan[k] } }));
  const handleKseChange = (k) => setRppData(p => ({ ...p, kseLulusan: { ...p.kseLulusan, [k]: !p.kseLulusan[k] } }));
  const handleTableChange = (a, i, f, v) => setRppData(p => { const n = [...p[a]]; n[i] = { ...n[i], [f]: v }; return { ...p, [a]: n }; });
  const addTableRow = (a, d) => setRppData(p => ({ ...p, [a]: [...p[a], { id: Date.now(), ...d }] }));
  const removeTableRow = (a, id) => confirmPopup("Hapus Baris?", "Baris ini akan dihapus dari tabel. Lanjutkan?", () => setRppData(p => ({ ...p, [a]: p[a].filter(i => i.id !== id) })));
  const saveAiSnapshot = (label) => setAiHistory(h => [...h.slice(-7), { label, data: JSON.parse(JSON.stringify(rppData)) }]);
  const undoLastAI = () => {
    const last = aiHistory[aiHistory.length - 1];
    if (!last) return;
    setRppData(last.data);
    setAiHistory(h => h.slice(0, -1));
    notify("Undo Berhasil", `Data dikembalikan ke kondisi sebelum ${last.label}.`, "success");
  };
  
  const resetRppData = () => confirmPopup("Kosongkan Semua Form?", "Semua isian, tabel, dan riwayat undo akan dikosongkan. Lanjutkan?", () => {
    setRppData({...defaultDataObj});
    setCompletedSteps({});
    setAiHistory([]);
    setIsEditing(true);
    setInstruksiKhusus("");
  });

  const cleanStr = (str) => {
    if (!str) return "";
    let cleaned = String(str).replace(/\r\n/g, '\n').replace(/\\n/g, '\n').replace(/\*\*/g, '').replace(/\*/g, '');
    cleaned = cleaned.replace(/([^\n])\s+((?:\d+[\.\)]|[A-D][\.\)]|[-•])\s+)/g, '$1\n$2');
    cleaned = cleaned.replace(/([^\n])\s+(Skor\s+\d+(?:-\d+)?\s*[:=])/gi, '$1\n$2');
    cleaned = cleaned.replace(/([^\n])\s+((?:Sangat baik|Baik|Cukup|Perlu bimbingan|Tidak menunjukkan evidensi)\s*[:=])/gi, '$1\n$2');
    cleaned = cleaned.replace(/\n\s*\n/g, '\n'); 
    return cleaned.trim();
  };

  const normalizeBentuk = (value) => {
    const v = cleanStr(value).toLowerCase();
    if (v.includes("kompleks")) return "PG Kompleks";
    if (v.includes("jodoh")) return "Menjodohkan";
    if (v.includes("isian")) return "Isian Singkat";
    if (v.includes("urai")) return "Uraian";
    if (v.includes("praktik") || v.includes("praktek") || v.includes("kinerja")) return "Praktik";
    if (v.includes("proyek") || v.includes("projek")) return "Proyek";
    if (v === "pg" || v.includes("pilihan ganda")) return "PG";
    return cleanStr(value);
  };

  const getBentukPenilaianList = (kisi = rppData.kisiKisi) => {
    const list = [];
    (kisi || []).forEach(k => {
      const bentuk = normalizeBentuk(k.bentuk);
      if (bentuk && !list.includes(bentuk)) list.push(bentuk);
    });
    return list.length ? list : ["Tertulis"];
  };

  const buildDefaultRubrik = (bentuk) => ({
    bentukPenilaian: bentuk,
    skor: skorBentuk[bentuk] || "4 = sangat baik\n3 = baik\n2 = cukup\n1 = perlu bimbingan\n0 = tidak menunjukkan evidensi",
    kriteria: bentuk === "PG" ? "Benar bila siswa memilih satu jawaban yang paling tepat sesuai indikator soal.\nSalah bila jawaban tidak sesuai, kosong, atau memilih lebih dari satu opsi." :
      bentuk === "PG Kompleks" ? "Nilai penuh hanya diberikan bila dua pilihan benar dipilih seluruhnya.\nJika ada satu pilihan salah, kurang satu pilihan benar, atau memilih lebih dari dua, skor menjadi 0." :
      bentuk === "Menjodohkan" ? "Tersedia minimal 4 premis dan 4 pasangan.\nSetiap pasangan benar bernilai 1 sampai total 4.\nPasangan salah, ganda, atau kosong bernilai 0 pada pasangan tersebut." :
      bentuk === "Isian Singkat" ? "Skor 2 bila istilah/angka/jawaban tepat.\nSkor 1 bila inti jawaban benar tetapi kurang lengkap.\nSkor 0 bila salah atau kosong." :
      bentuk === "Uraian" ? "Skor 5: jawaban lengkap, konsep tepat, alasan kuat, dan memakai bukti/konteks.\nSkor 3-4: konsep tepat tetapi alasan/bukti belum lengkap.\nSkor 1-2: sebagian konsep benar tetapi penalaran lemah.\nSkor 0: tidak menjawab atau tidak sesuai indikator." :
      `Kriteria disusun sesuai evidensi ${bentuk}: proses, produk/kinerja, ketepatan konsep, penggunaan bukti, dan refleksi siswa.`
  });

  const mapKisiRows = (rows) => (rows || []).map((k, i) => {
    const level = cleanStr(k.level).toUpperCase();
    let finalLevel = ["C1","C2","C3","C4","C5","C6"].includes(level) ? level : (i < 2 ? "C3" : "C4");
    if (i >= 2 && ["C1","C2"].includes(finalLevel)) finalLevel = "C4";
    return {
      id: Date.now() + 'k' + i,
      materi: cleanStr(k.materi),
      indikator: cleanStr(k.indikator),
      level: finalLevel,
      bentuk: bentukSoalUrut[i] || normalizeBentuk(k.bentuk) || "",
      nomor: cleanStr(k.nomor) || String(i + 1)
    };
  });

  const hasCompleteChoiceOptions = (text) => ["A","B","C","D"].every(l => new RegExp(`(^|\\n|\\s)${l}\\s*[\\).:-]`, "i").test(cleanStr(text)));

  const splitChoiceOptionsFromSoal = (soal, opsi, bentuk) => {
    const form = normalizeBentuk(bentuk);
    const question = cleanStr(soal);
    let options = cleanStr(opsi);
    if (!["PG", "PG Kompleks"].includes(form)) return { soal: question, opsi: options };
    const match = question.match(/(^|\n|\s)A\s*[\).:-]\s*/i);
    if (!match) return { soal: question, opsi: options };
    const start = match.index + (match[1] ? match[1].length : 0);
    const candidate = cleanStr(question.slice(start));
    if (!hasCompleteChoiceOptions(candidate)) return { soal: question, opsi: options };
    return {
      soal: cleanStr(question.slice(0, start)),
      opsi: hasCompleteChoiceOptions(options) ? options : candidate
    };
  };

  const mapBankRows = (rows, kisi = rppData.kisiKisi) => (rows || []).map((b, i) => {
    const form = kisi?.[i]?.bentuk || bentukSoalUrut[i] || "";
    const split = splitChoiceOptionsFromSoal(b.soal, b.opsi, form);
    return {
      id: Date.now() + 'b' + i,
      soal: split.soal,
      opsi: split.opsi,
      kunci: cleanStr(b.kunci)
    };
  });

  const getBankRowForDisplay = (row, index) => {
    const form = rppData.kisiKisi[index]?.bentuk || bentukSoalUrut[index] || "";
    const split = splitChoiceOptionsFromSoal(row.soal, row.opsi, form);
    return { ...row, soal: split.soal, opsi: split.opsi };
  };

  const countMatchingParts = (text) => {
    const clean = cleanStr(text);
    const premis = (clean.match(/(^|\n|\s)\d+\s*[\).:-]/g) || []).length;
    const respon = (clean.match(/(^|\n|\s)[A-H]\s*[\).:-]/gi) || []).length;
    return { premis, respon };
  };

  const countMatchingKeys = (text) => (cleanStr(text).match(/\d+\s*[-=]\s*[A-H]/gi) || []).length;

  const extractKeyLetters = (text) => {
    const upper = cleanStr(text).toUpperCase();
    const spaced = upper.match(/\b[A-D]\b/g) || [];
    if (spaced.length) return [...new Set(spaced)];
    const compact = upper.replace(/[^A-D]/g, '');
    if (/^[A-D]{1,4}$/.test(compact)) return [...new Set(compact.split(''))];
    return [];
  };

  const extractListItems = (text, markerPattern) => {
    const source = cleanStr(text).replace(/\s*\|\s*/g, '\n');
    const marker = new RegExp(`(^|\\n|,|;)\\s*${markerPattern}\\s*[\\).:-]\\s*`, 'gi');
    const matches = [...source.matchAll(marker)];
    return matches.map((m, idx) => {
      const label = m[2];
      const start = m.index + m[0].length;
      const end = idx + 1 < matches.length ? matches[idx + 1].index : source.length;
      const value = source.slice(start, end).replace(/^[\s,;|:-]+|[\s,;|:-]+$/g, '');
      return { label, value };
    }).filter(item => item.value);
  };

  const parseMatchingOptions = (text) => {
    const source = cleanStr(text);
    const split = source.match(/(?:premis|kelompok\s*a|kolom\s*a)\s*:?\s*([\s\S]*?)(?:respon|kelompok\s*b|kolom\s*b)\s*:?\s*([\s\S]*)/i);
    const premisSource = split ? split[1] : source;
    const responSource = split ? split[2] : source;
    return {
      premis: extractListItems(premisSource, '(\\d+)'),
      respon: extractListItems(responSource, '([A-H])')
    };
  };

    if (form === "PG Kompleks") return /\b2\b/.test(score) && /\b0\b/.test(score);

    let sequentialContext = `Konteks Saat Ini:\n- Mapel: ${rppData.mapel}\n- Fase/Kelas: ${rppData.kelas || '-'}\n- Topik: ${rppData.topik}\n- CP: ${rppData.cp || '-'}\n- Analisis Materi: ${rppData.karakteristikMateri || '-'}\n- Situasi Nyata Siswa: ${rppData.situasiNyataSiswa || '-'}\n- Kompetensi Awal: ${rppData.kompetensiAwal || '-'}\n- TP: ${rppData.tp || '-'}\n- Profil Lulusan: ${Object.keys(rppData.profilLulusan).filter(k => rppData.profilLulusan[k]).map(k => profilLabels[k]).join(', ') || '-'}\n- Alasan Profil: ${rppData.profilAlasan || '-'}\n- KSE: ${Object.keys(rppData.kseLulusan).filter(k => rppData.kseLulusan[k]).map(k => kseLabels[k]).join(', ') || '-'}\n- Alasan KSE: ${rppData.kseAlasan || '-'}\n- Kegiatan Awal: ${rppData.kegiatanAwal || '-'}\n- Kegiatan Inti: ${rppData.kegiatanInti || '-'}\n- Asesmen: ${[rppData.asesmenAwal, rppData.asesmenProses, rppData.asesmenAkhir].filter(Boolean).join(' | ') || '-'}\n`;
    let fieldSpecificInstruction = "Jabarkan dengan penomoran/bullet point (1., 2., atau -). Jaga sinkronisasi dengan CP, analisis materi, kompetensi awal, TP, kegiatan, asesmen, dan rubrik.";
    
    // Hanya tambahkan instruksi khusus JIKA BUKAN kisi-kisi atau bank soal (Soal/Kisi harus murni HOTS menguji kedalaman)
    if (instruksiKhusus && fieldKey !== 'kisiKisi' && fieldKey !== 'bankSoal') { 
        fieldSpecificInstruction += `\n🔥 PENTING (INSTRUKSI KHUSUS): ${instruksiKhusus}`; 
    }

    if (fieldKey === 'kegiatanInti') { sequentialContext += `Kegiatan Pendahuluan Sebelumnya: ${rppData.kegiatanAwal}\n`; fieldSpecificInstruction += "\nLanjutkan alur secara logis dari Pendahuluan. Jabarkan aktivitas guru & siswa. DILARANG ADA BASA-BASI PEMBUKA."; }
    else if (fieldKey === 'kegiatanPenutup') { sequentialContext += `Kegiatan Inti Sebelumnya: ${rppData.kegiatanInti}\n`; fieldSpecificInstruction += "\nGiring siswa melakukan refleksi berdasarkan Kegiatan Inti di atas."; }
    else if (fieldKey === 'kisiKisi') { fieldSpecificInstruction += "\nWAJIB MINIMAL 10 BARIS. Kolom 'level' HANYA isi dengan: C1-C6 dan minimal 6 indikator C4-C6. Untuk 10 soal utama, kolom 'bentuk' WAJIB URUT: PG, PG, PG Kompleks, PG Kompleks, Menjodohkan, Menjodohkan, Isian Singkat, Isian Singkat, Uraian, Uraian. Boleh menambah Praktik/Proyek sebagai evidensi otentik tambahan bila relevan."; }
    else if (fieldKey === 'bankSoal') { const stringKisi = rppData.kisiKisi.map(k => `No.${k.nomor} (Level: ${k.level}, Bentuk: ${k.bentuk}): ${k.indikator}`).join(' | '); sequentialContext += `KISI-KISI SEBAGAI ACUAN MUTLAK:\n[ ${stringKisi || 'Acak'} ]\n`; fieldSpecificInstruction += `\nWAJIB MINIMAL 10 SOAL HOTS dan/atau LITERASI-NUMERASI. BERIKAN STIMULUS berupa cerita, data, tabel sederhana, deskripsi angka, grafik tertulis, atau kasus nyata sebelum pertanyaan. WAJIB 100% SINKRON DENGAN KISI-KISI DI ATAS dan hindari hafalan murni. \nKHUSUS PG Kompleks: Opsi A, B, C, D dan WAJIB TEPAT 2 OPSI BENAR (Kunci: contoh A dan C). \nKHUSUS MENJODOHKAN: BUKAN pilihan ganda. Buat Kelompok A/Premis minimal 4 nomor dan Kelompok B/Respon minimal 4 huruf. Kunci minimal 4 pasangan, contoh: 1-A, 2-C, 3-B, 4-D.\nKHUSUS PRAKTIK/PROYEK: jika ada di kisi-kisi, tambahkan sebagai butir tugas setelah 10 soal utama. Kolom soal berisi perintah tugas kinerja/proyek yang dapat dikerjakan siswa; kolom opsi berisi rambu/pedoman pengerjaan; kunci diisi "-".\nPENTING: Abaikan instruksi khusus konteks, prioritaskan kepatuhan mutlak pada kisi-kisi, HOTS, literasi, numerasi, dan evidensi Praktik/Proyek.`; }
    else if (fieldKey === 'rubrikPenilaian') { const bentukRubrik = getBentukPenilaianList().join(', '); const aturanSkor = getBentukPenilaianList().map(b => `${b}: ${skorBentuk[b] || 'skor disesuaikan indikator'}`).join(' | '); sequentialContext += `Bentuk penilaian dari kisi-kisi: ${bentukRubrik}\nAturan skor: ${aturanSkor}\n`; fieldSpecificInstruction += `\nBuat tepat 1 rubrik untuk setiap bentuk penilaian dari kisi-kisi: ${bentukRubrik}. Kolom bentukPenilaian wajib diisi. Kolom skor wajib mengikuti aturan skor per bentuk, bukan disamakan semua 4-1. Kolom kriteria berisi deskripsi operasional penilaian.`; }

    let prompt = `Tugas Anda: Merancang spesifik bagian "${fieldTitle}" tanpa basa-basi.\n${sequentialContext}\nATURAN KETAT: ${fieldSpecificInstruction}`;
    let payload = { contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: "Keluarkan output sesuai permintaan, dilarang memberi pengantar. Gunakan 1 kali enter/newline (\\n) agar poin rapi ke bawah. Patuhi instruksi sinkronisasi." }] } };

    if (type === 'string') { prompt += `\n\nHANYA kembalikan teks isian.`; } else {
      let schemaObj = {};
      if (type === 'array_kisi') schemaObj = { type: "ARRAY", items: { type: "OBJECT", properties: { materi: { type: "STRING" }, indikator: { type: "STRING" }, level: { type: "STRING", description: "Hanya: C1, C2, C3, C4, C5, C6" }, bentuk: { type: "STRING", description: "Hanya: PG, PG Kompleks, Menjodohkan, Isian Singkat, Uraian, Praktik, Proyek" }, nomor: { type: "STRING" } }, required: ["materi","indikator","level","bentuk","nomor"] } };
      else if (type === 'array_soal') { prompt += `\nFormat JSON Array minimal 10 butir. Tambahkan butir Praktik/Proyek jika bentuk tersebut ada di kisi-kisi.`; schemaObj = { type: "ARRAY", items: { type: "OBJECT", properties: { soal: { type: "STRING" }, opsi: { type: "STRING" }, kunci: { type: "STRING" } }, required: ["soal","opsi","kunci"] } }; }
      else if (type === 'array_rubrik') { prompt += `\nFormat JSON Array dengan jumlah baris sesuai bentuk penilaian unik dari kisi-kisi: ${getBentukPenilaianList().join(', ')}.`; schemaObj = { type: "ARRAY", items: { type: "OBJECT", properties: { bentukPenilaian: { type: "STRING" }, skor: { type: "STRING" }, kriteria: { type: "STRING" } }, required: ["bentukPenilaian","skor","kriteria"] } }; }
      payload.generationConfig = { responseMimeType: "application/json", responseSchema: schemaObj };
    }
    payload.contents = [{ parts: [{ text: prompt }] }];

    try {
      const result = await callGeminiAPI(payload);
      let aiText = result?.candidates?.[0]?.content?.parts?.[0]?.text || "";
      if (!aiText) throw new Error("Respons AI kosong atau tidak berisi data yang dapat dimasukkan ke kolom.");
      if (type === 'string') {
        let cleanedText = cleanStr(aiText).replace(/^(Baik|Berikut|Ini).*?:\n/i, '');
        saveAiSnapshot(`Regenerate ${fieldTitle}`);
        setRppData(prev => ({ ...prev, [fieldKey]: cleanedText }));
      } else {
        aiText = aiText.replace(/```json/gi, '').replace(/```/g, '').trim();
        const aiData = JSON.parse(aiText);
        if (!Array.isArray(aiData)) throw new Error("Output AI bukan JSON Array.");
        if (type === 'array_kisi' && aiData.length < 10) {
          notify("Hasil AI Belum Valid", `Kisi-kisi minimal 10 baris, tetapi saat ini berjumlah ${aiData.length}. Silakan regenerate ulang.`, "warning");
          return;
        }
        if (type === 'array_soal' && aiData.length < 10) {
          notify("Hasil AI Belum Valid", `Bank soal minimal 10 butir, tetapi saat ini berjumlah ${aiData.length}. Silakan regenerate ulang.`, "warning");
          return;
        }
        let mappedData = aiData.map((item, i) => ({ id: Date.now() + fieldKey + i, ...item }));
        if(type === 'array_kisi') mappedData = mapKisiRows(aiData);
        else if(type === 'array_soal') mappedData = mapBankRows(aiData, rppData.kisiKisi);
        else if(type === 'array_rubrik') mappedData = mapRubrikByKisi(aiData);
        const nextData = { ...rppData, [fieldKey]: mappedData };
        const allWarnings = validateAssessmentStructure(nextData);
        const warnings = fieldKey === 'rubrikPenilaian' ? allWarnings.filter(w => w.toLowerCase().includes('rubrik')) :
          fieldKey === 'bankSoal' ? allWarnings.filter(w => w.toLowerCase().includes('soal')) :
          fieldKey === 'kisiKisi' ? allWarnings.filter(w => w.toLowerCase().includes('kisi')) :
          allWarnings;
        if (warnings.length) notify("Catatan Validasi Bagian Ini", "- " + warnings.slice(0, 10).join("\n- "), "warning");
        saveAiSnapshot(`Regenerate ${fieldTitle}`);
        setRppData(prev => ({ ...prev, [fieldKey]: mappedData }));
      }
    } catch (error) {
      if (!hasActiveApiKey() || error.message.toLowerCase().includes("api key") || error.message.includes("API_KEY_INVALID")) { setTempApiKey(geminiApiKey); setShowApiModal(true); }
      else notify("Regenerate Belum Berhasil", "Sistem AI belum berhasil memproses bagian ini. Silakan coba lagi.\n\nDetail: " + error.message, "error");
    } finally { setIndividualLoading(prev => ({...prev, [fieldKey]: false})); }
  };

  const formatText = (txt) => txt ? cleanStr(txt).replace(/\n/g, '<br/>') : '';
  const getHtmlCheckbox = (val, label) => val ? `☑ ${label}` : `☐ ${label}`;

  const isChoiceLikeForm = (form) => ["PG", "PG Kompleks", "Menjodohkan"].includes(normalizeBentuk(form));

  const formatOptionsForWord = (text, form) => {
    if (normalizeBentuk(form) !== "Menjodohkan") return formatText(text);
    const parsed = parseMatchingOptions(text);
    const maxRows = Math.max(parsed.premis.length, parsed.respon.length);
    if (!maxRows) return formatText(text);
    const rows = Array.from({ length: maxRows }).map((_, i) => {
      const p = parsed.premis[i];
      const r = parsed.respon[i];
      return `<tr><td style="border:1px solid #999;padding:4px;width:50%">${p ? `<strong>${p.label}.</strong> ${formatText(p.value)}` : ''}</td><td style="border:1px solid #999;padding:4px;width:50%">${r ? `<strong>${r.label}.</strong> ${formatText(r.value)}` : ''}</td></tr>`;
    }).join('');
    return `<table style="width:100%;border-collapse:collapse;font-size:9.5pt"><thead style="display:table-header-group"><tr><th style="border:1px solid #999;background:#f1f5f9;padding:4px">Premis / Kolom A</th><th style="border:1px solid #999;background:#f1f5f9;padding:4px">Respon / Kolom B</th></tr></thead><tbody>${rows}</tbody></table>`;
  };

  const renderMatchingOptions = (text) => {
    const parsed = parseMatchingOptions(text);
    const maxRows = Math.max(parsed.premis.length, parsed.respon.length);
    if (!maxRows) return <div className="whitespace-pre-wrap leading-relaxed">{text || '-'}</div>;
    return (
      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs sm:text-sm">
        <div className="border border-slate-200 rounded-lg overflow-hidden bg-white">
          <div className="bg-slate-100 px-2 py-1 font-bold text-slate-700 border-b">Premis / Kolom A</div>
          <div className="divide-y divide-slate-100">
            {parsed.premis.map(item => <div key={`p-${item.label}`} className="p-2 leading-relaxed"><strong>{item.label}.</strong> {item.value}</div>)}
          </div>
        </div>
        <div className="border border-slate-200 rounded-lg overflow-hidden bg-white">
          <div className="bg-slate-100 px-2 py-1 font-bold text-slate-700 border-b">Respon / Kolom B</div>
          <div className="divide-y divide-slate-100">
            {parsed.respon.map(item => <div key={`r-${item.label}`} className="p-2 leading-relaxed"><strong>{item.label}.</strong> {item.value}</div>)}
          </div>
        </div>
      </div>
    );
  };

  const renderStudentOptions = (row, index) => {
    const form = normalizeBentuk(rppData.kisiKisi[index]?.bentuk);
    if (!isChoiceLikeForm(form)) return <span className="text-slate-400 italic">Jawaban tidak ditampilkan.</span>;
    if (form === "Menjodohkan") return renderMatchingOptions(row.opsi);
    return <div className="whitespace-pre-wrap leading-relaxed">{row.opsi || '-'}</div>;
  };

  const generateWordContent = () => {
    // Styling khusus untuk MS Word agar border dan background header tabel lampiran berfungsi baik
    const thStyle = "border:1px solid black; background-color:#dbeafe; padding:6px; font-weight:bold; text-align:center; font-size:10pt;";
    const tdStyle = "border:1px solid black; padding:6px; vertical-align:top; font-size:10pt;";
    
    const kRows = rppData.kisiKisi.length > 0 ? rppData.kisiKisi.map((k, i) => `<tr><td style="text-align:center;${tdStyle}">${i+1}</td><td style="${tdStyle}">${formatText(k.materi)}</td><td style="${tdStyle}">${formatText(k.indikator)}</td><td style="text-align:center;${tdStyle}">${k.level}</td><td style="text-align:center;${tdStyle}">${k.bentuk}</td><td style="text-align:center;${tdStyle}">${k.nomor}</td></tr>`).join('') : `<tr><td colspan="6" style="text-align:center;${tdStyle}">Tidak ada data</td></tr>`;
    const bRows = rppData.bankSoal.length > 0 ? rppData.bankSoal.map((b, i) => {
      const form = rppData.kisiKisi[i]?.bentuk;
      const row = getBankRowForDisplay(b, i);
      return `<tr><td style="text-align:center;${tdStyle}">${i+1}</td><td style="${tdStyle}">${formatText(row.soal)}</td><td style="${tdStyle}">${formatOptionsForWord(row.opsi, form)}</td><td style="text-align:center;font-weight:bold;${tdStyle}">${row.kunci}</td></tr>`;
    }).join('') : `<tr><td colspan="4" style="text-align:center;${tdStyle}">Tidak ada soal</td></tr>`;
    const rubrikRowsForExport = rppData.kisiKisi.length ? mapRubrikByKisi(rppData.rubrikPenilaian, rppData.kisiKisi) : rppData.rubrikPenilaian;
    const rRowsTable = rubrikRowsForExport.length > 0 ? rubrikRowsForExport.map(r => `<tr><td style="text-align:center;font-weight:bold;${tdStyle}">${formatText(r.bentukPenilaian)}</td><td style="text-align:left;font-weight:bold;${tdStyle}">${formatText(r.skor)}</td><td style="${tdStyle}">${formatText(r.kriteria)}</td></tr>`).join('') : `<tr><td colspan="3" style="text-align:center;${tdStyle}">Tidak ada rubrik</td></tr>`;
    
    let profilHtml = '<table style="width:100%;border:none;margin:0;padding:0">';
    let pKeys = Object.keys(profilLabels);
    for(let i=0; i<pKeys.length; i+=2) { profilHtml += `<tr><td style="border:none;padding:1px;width:50%;font-size:9pt;line-height:1.05">${getHtmlCheckbox(rppData.profilLulusan[pKeys[i]], profilLabels[pKeys[i]])}</td><td style="border:none;padding:1px;width:50%;font-size:9pt;line-height:1.05">${pKeys[i+1]?getHtmlCheckbox(rppData.profilLulusan[pKeys[i+1]], profilLabels[pKeys[i+1]]):''}</td></tr>`; }
    profilHtml += '</table>';
    
    let kseHtml = '<table style="width:100%;border:none;margin:0;padding:0">';
    let kKeys = Object.keys(kseLabels);
    for(let i=0; i<kKeys.length; i+=2) { kseHtml += `<tr><td style="border:none;padding:1px;width:50%;font-size:9pt;line-height:1.05;color:#1e40af">${getHtmlCheckbox(rppData.kseLulusan[kKeys[i]], kseLabels[kKeys[i]])}</td><td style="border:none;padding:1px;width:50%;font-size:9pt;line-height:1.05;color:#1e40af">${kKeys[i+1]?getHtmlCheckbox(rppData.kseLulusan[kKeys[i+1]], kseLabels[kKeys[i+1]]):''}</td></tr>`; }
    kseHtml += '</table>';

    return `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>RPP</title><style>@page WordSection1{size:595.3pt 841.9pt;margin:36pt;mso-header-margin:28pt;mso-footer-margin:28pt;mso-paper-source:0;}div.WordSection1{page:WordSection1;}body{font-family:'Times New Roman',Times,serif;font-size:10pt;line-height:1.1;color:#000;margin:0;padding:0;}p{margin-top:1pt;margin-bottom:1pt;}.kop{border-bottom:2px solid black;padding-bottom:2px;margin-bottom:6pt;text-align:center;}.kop-line1{font-size:11pt;font-weight:bold;text-transform:uppercase;}.kop-line2{font-size:15pt;font-weight:bold;text-transform:uppercase;margin:1pt 0;letter-spacing:0;}.kop-line3{font-size:9pt;font-style:italic;}.t-table{width:100%;border-collapse:collapse;margin-bottom:6pt;page-break-inside:auto;}.t-table th{background-color:#dbeafe;padding:3px;text-align:left;border:1px solid black;font-size:10pt;font-weight:bold;text-transform:uppercase;}.t-label{width:16%;background-color:#f8fafc;border:1px solid black;padding:3px;font-weight:bold;vertical-align:top;font-size:9.5pt;}.t-content{border:1px solid black;padding:3px;vertical-align:top;font-size:9.5pt;}.t-content-half{width:34%;border:1px solid black;padding:3px;vertical-align:top;font-size:9.5pt;}.t-header-sub{background-color:#e2e8f0;border:1px solid black;padding:3px;text-align:left;font-weight:bold;font-size:9.5pt;}thead{display:table-header-group;}tfoot{display:table-footer-group;}tr{page-break-inside:avoid;}</style></head><body><div class="WordSection1">
<div class="kop"><div class="kop-line1">PEMERINTAH KABUPATEN MAGELANG<br/>DINAS PENDIDIKAN DAN KEBUDAYAAN</div><div class="kop-line2">${rppData.namaSekolah}</div><div class="kop-line3">Jalan Raya Secang, Kab. Magelang, Jawa Tengah 56195 | Telepon: (0293) 3195355</div></div>

  };

  const getCustomFileName = (prefix) => {

  };

  const runWithAssessmentCheck = (action) => {
    const warnings = [];
    if (!cleanStr(rppData.mapel)) warnings.push("Mata Pelajaran belum diisi.");
    if (!cleanStr(rppData.kelas)) warnings.push("Fase/Kelas belum diisi.");
    if (!cleanStr(rppData.topik)) warnings.push("Topik Pembelajaran belum diisi.");
    if (rppData.kisiKisi.length === 0 && rppData.bankSoal.length === 0 && rppData.rubrikPenilaian.length === 0) warnings.push("Lampiran asesmen masih kosong.");
    if (!warnings.length) {
      action();
      return;
    }
    confirmPopup(
      "Data Utama Belum Lengkap",
      `Beberapa data utama belum lengkap:\n\n- ${warnings.join('\n- ')}\n\nTetap lanjut unduh dokumen?`,
      action
    );
  };

  const getActivityConsequenceWarnings = () => {
    const warnings = [];
    const designText = `${rppData.kegiatanAwal} ${rppData.kegiatanInti} ${rppData.kegiatanPenutup} ${rppData.pengalamanMemahami} ${rppData.pengalamanMengaplikasi} ${rppData.pengalamanMerefleksi} ${rppData.asesmenAwal} ${rppData.asesmenProses} ${rppData.asesmenAkhir}`.toLowerCase();
    Object.keys(rppData.profilLulusan || {}).filter(k => rppData.profilLulusan[k]).forEach(k => {
      const label = profilLabels[k].toLowerCase().split(/\s+/).find(w => w.length > 6);
      if (label && !designText.includes(label)) warnings.push(`Profil ${profilLabels[k]} belum tampak jelas pada kegiatan/asesmen.`);
    });
    Object.keys(rppData.kseLulusan || {}).filter(k => rppData.kseLulusan[k]).forEach(k => {
      const label = kseLabels[k].toLowerCase().split(/\s+/).find(w => w.length > 6);
      if (label && !designText.includes(label)) warnings.push(`KSE ${kseLabels[k]} belum tampak jelas pada kegiatan/refleksi.`);
    });
    if (Object.values(rppData.profilLulusan || {}).some(Boolean) && !cleanStr(rppData.profilAlasan)) warnings.push("Alasan dan konsekuensi profil lulusan belum diisi.");
    if (Object.values(rppData.kseLulusan || {}).some(Boolean) && !cleanStr(rppData.kseAlasan)) warnings.push("Alasan dan konsekuensi KSE belum diisi.");
    return warnings;
  };

  const getPmCoherenceWarnings = () => {
    const warnings = [];
    const tp = cleanStr(rppData.tp).toLowerCase();
    const cp = cleanStr(rppData.cp).toLowerCase();
    const kegiatan = cleanStr(`${rppData.kegiatanAwal} ${rppData.kegiatanInti} ${rppData.kegiatanPenutup}`).toLowerCase();
    const asesmen = cleanStr(`${rppData.asesmenAwal} ${rppData.asesmenProses} ${rppData.asesmenAkhir}`).toLowerCase();
    const measurable = /(menganalisis|mengevaluasi|merancang|menyusun|menjelaskan|membandingkan|mengidentifikasi|menyimpulkan|membuktikan|menerapkan|menyajikan)/i;
    if (!cleanStr(rppData.situasiNyataSiswa)) warnings.push("Situasi nyata lingkungan siswa belum diisi sebagai konteks PM.");
    if (cleanStr(rppData.kompetensiAwal) && !/(prasyarat|sebelum|telah|mampu|pernah|dasar|awal)/i.test(rppData.kompetensiAwal)) warnings.push("Kompetensi awal perlu lebih eksplisit sebagai prasyarat materi.");
    if (cleanStr(rppData.kesiapanSiswa) && !/(kognitif|motivasi|kebiasaan|dukungan|sosial|emosi)/i.test(rppData.kesiapanSiswa)) warnings.push("Kesiapan peserta didik sebaiknya memuat kognitif, motivasi, kebiasaan belajar, dan kebutuhan dukungan.");
    if (cleanStr(rppData.karakteristikMateri) && !/(faktual|konseptual|prosedural|kontekstual|lintas|disiplin)/i.test(rppData.karakteristikMateri)) warnings.push("Karakteristik materi perlu menyebut sifat faktual/konseptual/prosedural/kontekstual/lintas disiplin.");
    if (tp && !measurable.test(tp)) warnings.push("Tujuan Pembelajaran perlu memakai kata kerja operasional yang dapat diukur.");
    if (cp && tp && !tp.split(/\s+/).some(w => w.length > 6 && cp.includes(w))) warnings.push("TP belum tampak menurunkan CP secara langsung.");
    if (tp && kegiatan && !tp.split(/\s+/).some(w => w.length > 6 && kegiatan.includes(w))) warnings.push("Kegiatan belajar belum cukup menampakkan latihan terhadap TP.");
    if (tp && asesmen && !tp.split(/\s+/).some(w => w.length > 6 && asesmen.includes(w))) warnings.push("Asesmen belum cukup jelas mengukur TP.");
    if (!/(memahami|mengaplikasi|merefleksi|refleksi|strategi|bukti)/i.test(`${rppData.pengalamanMemahami} ${rppData.pengalamanMengaplikasi} ${rppData.pengalamanMerefleksi}`)) warnings.push("Pengalaman belajar perlu lebih eksplisit memuat memahami, mengaplikasi, dan merefleksi.");
    return warnings;
  };

  const handleDownloadWord = () => {
    runWithAssessmentCheck(() => {
      if (!window.htmlDocx) {
        notify("DOCX Belum Siap", "Library pembuat DOCX belum dimuat. Pastikan koneksi internet aktif, tunggu beberapa detik, lalu coba lagi.", "warning");

      document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    });
  };

  const handleDownloadExcel = () => {
    runWithAssessmentCheck(async () => {
      const rubrikRowsForExcel = rppData.kisiKisi.length ? mapRubrikByKisi(rppData.rubrikPenilaian, rppData.kisiKisi) : rppData.rubrikPenilaian;
      const sheets = [
        {
          name: "Kisi-kisi Soal",
          minWidths: [5, 18, 28, 8, 12, 8],
          rows: rppData.kisiKisi.map((k, i) => ({ "No": i + 1, "Materi Pokok": k.materi, "Indikator Soal": k.indikator, "Level Kognitif": k.level, "Bentuk Soal": k.bentuk, "Nomor Soal": k.nomor }))
        },
        {
          name: "Bank Soal",
          minWidths: [5, 26, 24, 12],
          rows: rppData.bankSoal.map((b, i) => {
            const row = getBankRowForDisplay(b, i);
            return { "No": i + 1, "Butir Soal & Stimulus": row.soal, "Pilihan Jawaban / Pedoman Jawab": row.opsi || "-", "Kunci Jawaban": row.kunci || "-" };
          })
        },
        {
          name: "Rubrik Penilaian",
          minWidths: [5, 14, 22, 34],
          rows: rubrikRowsForExcel.map((r, i) => ({ "No": i + 1, "Bentuk Penilaian": r.bentukPenilaian, "Skor / Rentang Nilai": r.skor, "Deskripsi Indikator Penilaian": r.kriteria }))
        }
      ];

      const getHeaders = (rows) => Object.keys(rows[0] || { "Informasi": "Tidak ada data" });
      const safeRows = (rows, name) => rows.length ? rows : [{ "Informasi": `Tidak ada data ${name}` }];
      const autoFitColumnWidth = (header, rows, minWidth = 8) => {
        const maxLine = Math.max(header.length, ...rows.map(row => String(row[header] || '').split(/\r?\n/).reduce((m, line) => Math.max(m, line.length), 0)));
        return Math.min(80, Math.max(minWidth, Math.ceil(maxLine * 1.08) + 2));
      };
      const autoFitRowHeight = (row) => {
        const values = Object.values(row);
        const lineCount = Math.max(1, ...values.map(v => String(v || '').split(/\r?\n/).length));
        const longest = Math.max(1, ...values.map(v => String(v || '').split(/\r?\n/).reduce((m, line) => Math.max(m, line.length), 0)));
        return Math.min(210, Math.max(24, 18 + (lineCount - 1) * 15 + Math.ceil(longest / 48) * 14));
      };
      const saveBlob = (blob, filename) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      if (window.ExcelJS) {
        try {
          const wb = new ExcelJS.Workbook();
          wb.creator = "Asisten Guru Pembelajaran Mendalam";
          wb.created = new Date();
          sheets.forEach(sheet => {
            const rows = safeRows(sheet.rows, sheet.name);
            const headers = getHeaders(rows);
            const ws = wb.addWorksheet(sheet.name);
            ws.views = [{ state: "frozen", ySplit: 1 }];
            ws.addRow(headers);
            rows.forEach(row => ws.addRow(headers.map(h => row[h] ?? "")));
            ws.autoFilter = { from: { row: 1, column: 1 }, to: { row: 1, column: headers.length } };
            headers.forEach((header, idx) => {
              ws.getColumn(idx + 1).width = autoFitColumnWidth(header, rows, sheet.minWidths[idx] || 8);
            });
            ws.eachRow((excelRow, rowNumber) => {
              excelRow.height = rowNumber === 1 ? 24 : autoFitRowHeight(rows[rowNumber - 2] || {});
              excelRow.eachCell({ includeEmpty: true }, cell => {
                cell.alignment = { wrapText: true, vertical: "top" };
                cell.border = { top: { style: "thin", color: { argb: "FFD1D5DB" } }, left: { style: "thin", color: { argb: "FFD1D5DB" } }, bottom: { style: "thin", color: { argb: "FFD1D5DB" } }, right: { style: "thin", color: { argb: "FFD1D5DB" } } };
                if (rowNumber === 1) {
                  cell.font = { bold: true, color: { argb: "FFFFFFFF" } };
                  cell.fill = { type: "pattern", pattern: "solid", fgColor: { argb: "FF1D4ED8" } };
                  cell.alignment = { wrapText: true, vertical: "middle", horizontal: "center" };
                }
              });
            });
          });
          const buffer = await wb.xlsx.writeBuffer();
          saveBlob(new Blob([buffer], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" }), `${getCustomFileName('Instrumen Penilaian')}.xlsx`);
          return;
        } catch (error) {
          notify("ExcelJS Bermasalah", "Ekspor styling penuh belum berhasil, aplikasi memakai ekspor Excel cadangan.\n\nDetail: " + error.message, "warning");
        }
      }

      if (!window.XLSX) {
        notify("Excel Belum Siap", "Library Excel belum dimuat. Mohon tunggu beberapa detik lalu coba lagi.", "warning");
        return;
      }
      const wb = XLSX.utils.book_new();
      sheets.forEach(sheet => {
        const rows = safeRows(sheet.rows, sheet.name);
        const ws = XLSX.utils.json_to_sheet(rows);
        const headers = getHeaders(rows);
        ws['!cols'] = headers.map((header, idx) => ({ wch: autoFitColumnWidth(header, rows, sheet.minWidths[idx] || 8) }));
        ws['!rows'] = [{ hpt: 24 }, ...rows.map(row => ({ hpt: autoFitRowHeight(row) }))];
        ws['!autofilter'] = { ref: ws['!ref'] };
        XLSX.utils.book_append_sheet(wb, ws, sheet.name);
      });
      XLSX.writeFile(wb, `${getCustomFileName('Instrumen Penilaian')}.xlsx`);
    });
  };

  return (

            {isEditing ? (
              <div className="space-y-4 sm:space-y-6">
                <Card className="p-4 sm:p-6 border-t-4 border-t-slate-800 shadow-md">
                  <h3 className="font-bold text-slate-800 text-base sm:text-lg mb-4 border-b pb-2"><i className="fas fa-id-card mr-2 text-slate-600"></i> Informasi Umum & Pengesahan</h3>

                    <div><LabelWithHint>Nama Sekolah</LabelWithHint><input type="text" name="namaSekolah" value={rppData.namaSekolah} onChange={handleInputChange} className="w-full p-2.5 border border-slate-300 rounded focus:ring-2 focus:ring-slate-500 outline-none bg-slate-100" readOnly/></div>
                    <div><LabelWithHint>Tahun Pelajaran</LabelWithHint><input type="text" name="tahunPelajaran" value={rppData.tahunPelajaran} onChange={handleInputChange} className="w-full p-2.5 border border-slate-300 rounded focus:ring-2 focus:ring-slate-500 outline-none" /></div>
                    <div><LabelWithHint>Nama Kepala Sekolah</LabelWithHint><input type="text" name="namaKepsek" value={rppData.namaKepsek} onChange={handleInputChange} className="w-full p-2.5 border border-slate-300 rounded focus:ring-2 focus:ring-slate-500 outline-none" placeholder="Nama Kepala Sekolah" /><input type="text" name="nipKepsek" value={rppData.nipKepsek} onChange={handleInputChange} className="w-full p-2.5 border border-slate-300 rounded focus:ring-2 focus:ring-slate-500 outline-none mt-2" placeholder="NIP Kepala Sekolah" /></div>

                  </div>
                </Card>

                {/* --- AREA KUSTOMISASI AI DEEP LEARNING --- */}
                <div className="mb-6 bg-gradient-to-r from-fuchsia-600 to-indigo-700 p-5 sm:p-6 md:p-8 rounded-xl shadow-lg text-white border-b-4 border-fuchsia-300 relative overflow-hidden">

            ) : (
                <>
                <button onClick={undoLastAI} disabled={aiHistory.length === 0} className={`py-3 rounded-xl text-xs sm:text-sm font-bold w-full transition border ${aiHistory.length === 0 ? 'bg-slate-100 text-slate-400 cursor-not-allowed' : 'bg-amber-50 text-amber-700 border-amber-200 hover:bg-amber-100'}`}><i className="fas fa-undo mr-2"></i> Undo Generate Terakhir</button>
                <div className="flex space-x-2 w-full mb-1">
                    <button onClick={() => setIsEditing(true)} className="flex-1 py-2 sm:py-3 bg-slate-100 rounded-xl text-xs sm:text-sm font-bold border hover:bg-slate-200 transition"><i className="fas fa-edit mr-1"></i> Edit</button>
                    <button onClick={resetRppData} className="flex-1 py-2 sm:py-3 bg-red-50 text-red-600 rounded-xl text-xs sm:text-sm font-bold border hover:bg-red-100 transition"><i className="fas fa-trash-alt mr-1"></i> Reset</button>
                </div>
                <button onClick={handleDownloadWord} className="btn-word py-3 bg-blue-600 text-white rounded-xl text-xs sm:text-sm font-bold w-full hover:bg-blue-700 transition"><i className="fas fa-file-word mr-2"></i> Unduh Word (Modul)</button>
                <button onClick={handleDownloadExcel} className="py-3 bg-emerald-600 text-white rounded-xl text-xs sm:text-sm font-bold w-full hover:bg-emerald-700 transition shadow-md mt-1 border border-emerald-700"><i className="fas fa-file-excel mr-2"></i> Unduh Excel (Penilaian)</button>
                </>
            )}
          </div>
        </div>
      </main>

      {/* OVERLAY LOADING HITUNGAN MUNDUR PROFESIONAL */}
      {isAnyLoading && (
        <div className="fixed inset-0 bg-slate-900/80 z-[999] flex items-center justify-center p-4 backdrop-blur-sm transition-opacity">
          <div className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl flex flex-col items-center text-center relative overflow-hidden border border-blue-100">
            {/* Progress Bar Atas */}
            <div className="absolute top-0 left-0 w-full h-2 bg-slate-100">
               <div className="h-full bg-blue-500 animate-[pulse_1s_ease-in-out_infinite]" style={{ width: `${Math.max(5, (1 - countdown / 15) * 100)}%`, transition: 'width 1s linear' }}></div>
            </div>
            
            {/* Ikon Robot Berputar */}
            <div className="w-24 h-24 rounded-full border-8 border-slate-100 border-t-blue-500 border-r-blue-400 animate-spin flex items-center justify-center mb-6 shadow-inner relative">
               <div className="w-16 h-16 rounded-full bg-blue-50 flex items-center justify-center absolute -animate-spin animate-wave">
                 <i className="fas fa-brain text-4xl text-blue-600"></i>
               </div>
            </div>
            
            <h3 className="font-black text-2xl text-slate-800 mb-2 tracking-tight">AI Sedang Meracik...</h3>
            
            <p className="text-sm font-semibold text-slate-500 mb-6 h-10 px-4 leading-snug">
               {countdown > 10 ? "Menganalisis Instruksi Khusus dan Konteks Latar Belakang Siswa..." : 
                countdown > 4 ? "Memformulasikan kegiatan PM, asesmen, dan rubrik..." : 
                "Menyelaraskan Kisi-kisi, Bank Soal, dan Format Dokumen..."}
            </p>
            
            <div className="flex items-center justify-center space-x-2 text-white font-bold bg-slate-800 px-5 py-2.5 rounded-full shadow-md w-full">
               <i className="fas fa-stopwatch text-yellow-400 text-lg"></i>
               <span>Estimasi Waktu: <span className="text-yellow-400 text-lg mx-1">{countdown}</span> Detik</span>
            </div>
          </div>
        </div>
      )}

      {/* POPUP PEMBERITAHUAN PROFESIONAL */}
      {popup ? (
        <div className="fixed inset-0 bg-slate-900/60 z-[1000] flex items-center justify-center p-4 backdrop-blur-sm">
          <div className="bg-white rounded-2xl shadow-2xl max-w-md w-full overflow-hidden border border-slate-200">
            <div className={`p-4 sm:p-5 text-white flex items-center gap-3 ${
              popup.type === 'error' ? 'bg-red-600' :
              popup.type === 'warning' ? 'bg-amber-600' :
              popup.type === 'success' ? 'bg-emerald-600' :
              'bg-blue-600'
            }`}>
              <div className="w-10 h-10 rounded-full bg-white/20 flex items-center justify-center shrink-0">
                <i className={`fas ${
                  popup.type === 'error' ? 'fa-triangle-exclamation' :
                  popup.type === 'warning' ? 'fa-circle-exclamation' :
                  popup.type === 'success' ? 'fa-circle-check' :
                  popup.type === 'confirm' ? 'fa-circle-question' :
                  'fa-circle-info'
                } text-lg`}></i>
              </div>
              <div className="min-w-0">
                <h3 className="font-black text-base sm:text-lg leading-tight">{popup.title}</h3>
                <p className="text-xs text-white/80 mt-0.5">Asisten Guru Pembelajaran Mendalam</p>
              </div>
            </div>
            <div className="p-5 sm:p-6">
              <div className="text-sm text-slate-700 leading-relaxed whitespace-pre-wrap max-h-[50vh] overflow-y-auto">{popup.message}</div>
              <div className="flex gap-3 mt-6">
                {popup.type === 'confirm' ? (
                  <>
                    <button onClick={() => setPopup(null)} className="flex-1 py-3 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200">Batal</button>
                    <button onClick={() => { const action = popup.onConfirm; setPopup(null); if (action) action(); }} className="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-600/25">Lanjutkan</button>
                  </>
                ) : (
                  <button onClick={() => setPopup(null)} className="w-full py-3 bg-slate-800 text-white font-bold rounded-xl hover:bg-slate-900">Mengerti</button>
                )}
              </div>
            </div>
          </div>
        </div>
      ) : null}

      {/* MODAL API KEY MANUAL */}
      {showApiModal ? (
        <div className="fixed inset-0 bg-slate-900/70 z-[990] flex items-center justify-center p-4 backdrop-blur-sm">
          <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden animate-in zoom-in-95 duration-200">
            <div className="bg-gradient-to-r from-blue-600 to-indigo-700 p-4 sm:p-5 text-white flex justify-between items-center">
              <h3 className="font-bold text-lg"><i className="fas fa-key mr-2 text-yellow-300"></i> Konfigurasi API Gemini</h3>
              <button onClick={() => setShowApiModal(false)} className="text-blue-100 hover:text-white"><i className="fas fa-times text-xl"></i></button>
            </div>
            <div className="p-5 sm:p-6 text-sm text-slate-700">
              <div className="bg-blue-50 border border-blue-200 p-3 rounded-lg mb-4 text-xs sm:text-sm leading-relaxed">
                <p>Silakan masukkan <strong>Gemini API Key</strong> agar tombol generate dapat mengisi kolom-kolom modul ajar dengan benar.</p>
                <ol className="list-decimal ml-5 mt-2 space-y-1 font-medium">
                  <li>Buka <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer" className="text-blue-600 underline hover:text-blue-800">Google AI Studio</a>.</li>
                  <li>Klik tombol <strong>"Create API key"</strong> lalu salin dan tempel di bawah.</li>
                </ol>
              </div>
              <label className="block font-bold text-slate-800 mb-2">Gemini API Key Anda:</label>
              <input type="password" value={tempApiKey} onChange={(e) => setTempApiKey(e.target.value)} placeholder="AIzaSy..." className="w-full p-3 border-2 border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-mono tracking-widest text-slate-800 mb-1"/>
              <p className="text-[10px] text-slate-500 mb-6"><i className="fas fa-shield-alt mr-1"></i>Key hanya disimpan sementara di <i>sessionStorage</i> tab ini dan dikirim melalui header API, bukan query string URL.</p>
              
              <div className="flex gap-3">
                <button onClick={() => setShowApiModal(false)} className="flex-1 py-3 bg-slate-100 font-bold rounded-xl hover:bg-slate-200">Batal</button>
                <button onClick={saveApiKey} className="flex-1 py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-600/30">Simpan API Key</button>
              </div>
            </div>
          </div>
        </div>
      ) : null}

      <footer className="w-full max-w-[98%] xl:max-w-[1400px] mx-auto px-4 mt-8 sm:mt-12 pb-6 text-center text-slate-500 text-xs sm:text-sm">
        <div className="border-t border-slate-300 pt-6">
           <p className="font-bold text-slate-600 text-sm sm:text-base mb-1">Dikembangkan oleh: YUSUF ARIS SYAMSUDDIN</p>
           <p className="font-medium">NIP: 19950430 202321 1 004 | Guru IPA & Informatika - SMPN 2 Secang</p>
        </div>
      </footer>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
