});
window.addEventListener('unhandledrejection', function(event) {
  const message = event.reason && (event.reason.stack || event.reason.message) ? (event.reason.stack || event.reason.message) : event.reason;

});

const resizeTextareaToContent = (element) => {
  if (!element || element.tagName !== 'TEXTAREA') return;
  element.style.height = 'auto';
  const computedStyle = window.getComputedStyle(element);
  const minHeight = parseFloat(computedStyle.minHeight) || 0;
  const borderHeight = element.offsetHeight - element.clientHeight;
  element.style.height = `${Math.ceil(Math.max(element.scrollHeight + borderHeight, minHeight))}px`;
};

const resizeAllTextareas = (scope = document) => {
  scope.querySelectorAll('textarea').forEach(resizeTextareaToContent);
};

const GEMINI_API_KEY_STORAGE = 'gemini_api_key_eksternal_v3';
const GEMINI_API_KEY_LEGACY_STORAGE = 'gemini_api_key_eksternal_v2';
const GEMINI_MODEL_STORAGE = 'asistenGuru_geminiModel_v1';
const GEMINI_DEFAULT_MODEL = 'gemini-3.6-flash';
const GEMINI_MODEL_PRIORITY = [
  'gemini-3.6-flash',
  'gemini-2.5-flash',
  'gemini-3.5-flash-lite',
  'gemini-2.5-flash-lite'
];

const sanitizeGeminiApiKey = (value) => {
  let cleaned = String(value || "").trim();
  const assignmentMatch = cleaned.match(/^(?:export\s+)?(?:GEMINI_API_KEY|GOOGLE_API_KEY|GOOGLE_GENAI_API_KEY|GENERATIVE_LANGUAGE_API_KEY|API_KEY)\s*=\s*(.+)$/i);
  if (assignmentMatch) cleaned = assignmentMatch[1].trim();
  if (/^https?:\/\//i.test(cleaned)) {
    try {
      const keyFromUrl = new URL(cleaned).searchParams.get("key");
      if (keyFromUrl) cleaned = keyFromUrl;
    } catch (urlError) {}
  }
  return cleaned
    .replace(/^["'`]+|["'`]+$/g, "")
    .replace(/\s+/g, "");
};

// Akses storage yang tidak pernah melempar error: data: URL, mode privat, atau situs diblokir membuat
// window.localStorage sendiri melempar SecurityError. Tidak ada pengganti in-memory: data tetap di state React
// selama halaman terbuka, dan guru diberi tahu bahwa data hilang bila halaman ditutup.
const probeStorage = (getStore) => { try { const store = getStore(); store.getItem("__agpm_probe__"); return { store, error: "" }; } catch (error) { return { store: null, error: error?.name || "SecurityError" }; } };
const LOCAL_STORE = probeStorage(() => localStorage);
const SESSION_STORE = probeStorage(() => sessionStorage);
const storageGet = (key, area = LOCAL_STORE) => { try { return area.store ? area.store.getItem(key) : null; } catch (error) { return null; } };
const storageSet = (key, value, area = LOCAL_STORE) => { if (!area.store) return area.error || "SecurityError"; try { area.store.setItem(key, value); return ""; } catch (error) { return error?.name || "Error"; } };
const storageRemove = (key, area = LOCAL_STORE) => { try { if (area.store) area.store.removeItem(key); } catch (error) {} };

const readStoredGeminiApiKey = () => {
  try {
    return sanitizeGeminiApiKey(
      storageGet(GEMINI_API_KEY_STORAGE)
      || storageGet(GEMINI_API_KEY_LEGACY_STORAGE)
      || storageGet(GEMINI_API_KEY_STORAGE, SESSION_STORE)
      || storageGet(GEMINI_API_KEY_LEGACY_STORAGE, SESSION_STORE)
      || ""
    );
  } catch (error) {
    return "";
  }
};

function App() {
  const [completedSteps, setCompletedSteps] = useState({});
  const [isEditing, setIsEditing] = useState(false);
  const [isGenerating, setIsGenerating] = useState(false);
  const [activeGenerateMode, setActiveGenerateMode] = useState("");
  const [individualLoading, setIndividualLoading] = useState({});
  const [countdown, setCountdown] = useState(0); 
  const [aiHistory, setAiHistory] = useState([]);
  const [showInstruksiHint, setShowInstruksiHint] = useState(false);
  
  const [instruksiKhusus, setInstruksiKhusus] = useState(() => storageGet('asistenGuru_instruksiKhusus_v43') || ""); 
  const [instruksiKhususAsesmen, setInstruksiKhususAsesmen] = useState(() => storageGet('asistenGuru_instruksiKhususAsesmen_v1') || "");
  const [instruksiKhususLkpd, setInstruksiKhususLkpd] = useState(() => storageGet('asistenGuru_instruksiKhususLkpd_v1') || "");
  
  const [showApiModal, setShowApiModal] = useState(false);
  const [geminiApiKey, setGeminiApiKey] = useState(readStoredGeminiApiKey);
  const [geminiModel, setGeminiModel] = useState(() => {
    return storageGet(GEMINI_MODEL_STORAGE) || GEMINI_DEFAULT_MODEL;
  });
  const [tempApiKey, setTempApiKey] = useState("");
  const [isTestingApiKey, setIsTestingApiKey] = useState(false);
  const [apiKeyFeedback, setApiKeyFeedback] = useState(null);
  const geminiModelsCacheRef = useRef({ apiKey: "", models: [] });
  const aiAbortRef = useRef(null);
  const [popup, setPopup] = useState(null);

  const notify = (title, message, type = "info") => setPopup({ title, message, type });
  const confirmPopup = (title, message, onConfirm) => setPopup({ title, message, type: "confirm", onConfirm });

  const saveApiKey = () => {
    const cleanedKey = sanitizeGeminiApiKey(tempApiKey);
    if (!cleanedKey) {
      [GEMINI_API_KEY_STORAGE, GEMINI_API_KEY_LEGACY_STORAGE].forEach(key => { storageRemove(key); storageRemove(key, SESSION_STORE); });
      setGeminiApiKey("");
      geminiModelsCacheRef.current = { apiKey: "", models: [] };
      setApiKeyFeedback(null);
      setShowApiModal(false);
      notify("API Key Dikosongkan", "Generate AI belum bisa berjalan sampai API key Gemini diisi kembali.", "warning");
      return;
    }
    const keySaveError = storageSet(GEMINI_API_KEY_STORAGE, cleanedKey) || storageSet(GEMINI_API_KEY_LEGACY_STORAGE, cleanedKey);
    [GEMINI_API_KEY_STORAGE, GEMINI_API_KEY_LEGACY_STORAGE].forEach(key => storageRemove(key, SESSION_STORE));
    setGeminiApiKey(cleanedKey);
    if (geminiModelsCacheRef.current.apiKey !== cleanedKey) {
      geminiModelsCacheRef.current = { apiKey: "", models: [] };
    }
    setApiKeyFeedback(null);
    setShowApiModal(false);
    if (keySaveError) { notify("API Key Hanya Untuk Sesi Ini", "Penyimpanan perangkat tidak tersedia, jadi API key hanya dipakai selama halaman ini terbuka dan harus diisi lagi setelah halaman ditutup.", "warning"); return; }
    notify("API Key Tersimpan", `API key berhasil disimpan di perangkat ini. Generate AI akan memakai ${geminiModel || GEMINI_DEFAULT_MODEL} dan berpindah otomatis ke model kompatibel bila diperlukan.`, "success");
  };

  const getInjectedApiKey = () => {
    const candidates = [];
    if (typeof window !== "undefined") {
      candidates.push(window.GOOGLE_API_KEY, window.GEMINI_API_KEY, window.GOOGLE_GENAI_API_KEY, window.GENERATIVE_LANGUAGE_API_KEY, window.API_KEY, window.__GOOGLE_API_KEY__, window.__GEMINI_API_KEY__, window.__API_KEY__);
    }
    if (typeof process !== "undefined" && process.env) {
      candidates.push(process.env.GOOGLE_API_KEY, process.env.GEMINI_API_KEY, process.env.GOOGLE_GENAI_API_KEY, process.env.GENERATIVE_LANGUAGE_API_KEY, process.env.API_KEY);
    }
    return sanitizeGeminiApiKey(candidates.find(k => typeof k === "string" && k.trim()) || "");
  };

  const getActiveApiKey = () => sanitizeGeminiApiKey(geminiApiKey) || getInjectedApiKey();
  const hasActiveApiKey = () => Boolean(getActiveApiKey());

  const isAnyLoading = isGenerating || Object.values(individualLoading).some(v => v === true);

  // Kegagalan simpan (kuota penuh/storage diblokir) dilaporkan, tidak membuat aplikasi crash.
  const [storageError, setStorageError] = useState("");
  const protectedKeysRef = useRef(new Set());

    let cleaned = String(str).replace(/\r\n/g, '\n').replace(/\\n/g, '\n').replace(/\*\*/g, '');

      const context = source.slice(lineStart, offset + stem.length);
      const openCount = (context.match(/\(/g) || []).length;

    cleaned = cleaned.replace(/\s+(?=(?:Langkah|Tahap|Aktivitas|Pertanyaan|Refleksi)\s*\d+\s*[\.\):=-]\s*)/gi, '\n');

    // Titik dua hanya dihitung bila menempel kata ("Langkah: 1. …"), bukan rasio "3 : 4. …".
    cleaned = cleaned.replace(/([.;!?)]|\S:)[ \t]+((?:\d{1,2}[\.\)]|[A-E][\.\)])[ \t]+)/g, '$1\n$2');
    cleaned = cleaned.replace(/([.;:!?])[ \t]+((?:-|\u2022)[ \t]+)/g, '$1\n$2');
    cleaned = cleaned.replace(/([^\n])\s*([;|]\s*)((?:\d{1,2}|[A-Ea-e])[\.\)]\s+)/g, '$1\n$3');
    cleaned = cleaned.replace(/([^\n])\s+(Skor\s+\d+(?:-\d+)?\s*[:=])/gi, '$1\n$2');
    cleaned = cleaned.replace(/([^\n])\s+((?:Sangat baik|Baik|Cukup|Perlu bimbingan|Tidak menunjukkan evidensi)\s*[:=])/gi, '$1\n$2');
    cleaned = cleaned.replace(/\n\s*\n/g, '\n');

  };

    let match;

  const getExpectedSintaksCount = (value) => {
    const text = cleanStr(value).toLowerCase();
    if (/(project based|\bpjbl\b|berbasis proyek)/i.test(text)) return 6;
    if (/(problem based|\bpbl\b|berbasis masalah)/i.test(text)) return 5;
    if (/(discovery learning|pembelajaran penemuan)/i.test(text)) return 6;
    if (/(inquiry learning|inkuiri)/i.test(text)) return 6;
    if (/(cooperative learning|kooperatif)/i.test(text)) return 6;
    if (/(direct instruction|pembelajaran langsung)/i.test(text)) return 5;
    return 0;
  };
  const hasSyntaxMarker = (value) => /(?:sintaks|syntax)\s*(?:ke\s*[-:]?\s*)?\d+\b/i.test(cleanStr(value));
  const getSintaksLabelMap = (value) => {
    const labels = {};
    const source = normalizeSintaksText(value);
    const pattern = /Sintaks\s*(?:ke\s*[-:]?\s*)?(\d+)\s*(?:\n\s*)?(?:[-\u2013:\.)]\s*)?([^:|\]\n]+)/gi;
    let match;
    while ((match = pattern.exec(source)) !== null) {
      const label = cleanStr(match[2]).replace(/\s+/g, ' ').trim();
      if (label) labels[Number(match[1])] = label.slice(0, 90);
    }
    return labels;
  };
  const parseSintaksOverview = (value) => {
    const source = normalizeSintaksText(value);
    const knownLabels = getSintaksLabelMap(source);
    const result = { model: "", steps: [] };
    source.split(/\n+/).map(line => line.replace(/^[-\u2022]\s*/, '').trim()).filter(Boolean).forEach(line => {
      const modelMatch = line.match(/^(?:Model(?:\s+(?:Utama|Pembelajaran))?|Pendekatan\s*\/\s*Model)\s*[:=-]\s*(.+)$/i);
      if (modelMatch) {
        result.model = cleanStr(modelMatch[1]);
        return;
      }

      const stepMatch = line.match(/^Sintaks\s*(?:ke\s*[-:]?\s*)?(\d+)\s*(.*)$/i);
      if (!stepMatch) {
        if (result.steps.length) {
          const last = result.steps[result.steps.length - 1];
          last.description = cleanStr(`${last.description ? `${last.description} ` : ""}${line}`);
        } else if (!result.model) {
          result.model = cleanStr(line);
        }
        return;
      }

      const number = Number(stepMatch[1]);
      let remainder = cleanStr(stepMatch[2]).replace(/^[-\u2013:\.)\s]+/, '').trim();
      let label = cleanStr(knownLabels[number]);
      let description = "";
      if (label && remainder.toLowerCase().startsWith(label.toLowerCase())) {
        description = cleanStr(remainder.slice(label.length).replace(/^\s*(?:[:|]|[-\u2013])\s*/, ''));
      } else {
        const sections = remainder.split(/\s*[:|]\s*/);
        if (sections.length > 1) {
          label = cleanStr(sections.shift());
          description = cleanStr(sections.join(': '));
        } else {
          const dashParts = remainder.split(/\s+[-\u2013]\s+/);
          label = cleanStr(dashParts.shift()) || `Tahap ${number}`;
          description = cleanStr(dashParts.join(' - '));
        }
      }
      result.steps.push({ number, label: label || `Tahap ${number}`, description });
    });
    return result;
  };

  const parseActivitySyntaxGroups = (value, sintaksValue) => {
    const labels = getSintaksLabelMap(sintaksValue);
    const groups = [];
    let automaticNumber = 0;
    cleanStr(value).split(/\n+/).map(line => line.trim()).filter(Boolean).forEach(line => {
      const prefixMatch = line.match(/^((?:\d{1,2}[\.\)]|[-\u2022])\s*)/);
      const prefix = prefixMatch ? prefixMatch[1] : "";
      const explicitNumber = prefix.match(/\d+/)?.[0];
      const body = line.slice(prefix.length).trim();
      const marker = body.match(/^\[\s*(?:Sintaks|Syntax)\s*(?:ke\s*[-:]?\s*)?(\d+)\s*(?:[-\u2013:]\s*([^\]]+))?\]\s*(.*)$/i);
      const syntaxNumber = marker ? Number(marker[1]) : null;
      const syntaxLabel = marker ? cleanStr(marker[2]) || labels[syntaxNumber] || `Tahap ${syntaxNumber}` : "";
      const activityText = cleanStr(marker ? marker[3] : body)
        .replace(/^\[\s*(?:Sintaks|Syntax)\s*\d+[^\]]*\]\s*/i, '')
        .trim();
      if (!activityText) return;

      automaticNumber += 1;
      const item = { number: explicitNumber || String(automaticNumber), text: activityText, isHeading: isActivityHeadingLine(activityText) };
      const previous = groups[groups.length - 1];
      if (previous && previous.syntaxNumber === syntaxNumber && previous.syntaxLabel === syntaxLabel) {
        previous.items.push(item);
      } else if (!marker && previous) {
        previous.items.push(item);
      } else {
        groups.push({ syntaxNumber, syntaxLabel: syntaxLabel || "Langkah Operasional", items: [item] });
      }
    });
    return groups;

  const parseSintaksMappingRows = (value) => normalizePemetaanSintaksText(value)

      const phaseMatch = line.match(/^(?:Fase\s*)?(Awal|Pendahuluan|Inti|Akhir|Penutup)\s*:\s*(.*)$/i);

      const remainder = cleanStr(phaseMatch ? phaseMatch[2] : line);
      const parts = remainder.split(/\s*\|\s*/).map(part => cleanStr(part)).filter(Boolean);
      const syntax = cleanStr(parts.find(part => /Sintaks|Syntax/i.test(part)) || parts[0] || "-");
      const statusPart = parts.find(part => /^Status\b/i.test(part)) || "";
      const focusParts = parts.filter(part => part !== syntax && part !== statusPart);
      return {
        phase,

        status: cleanStr(statusPart.replace(/^Status\s*:?\s*/i, '')) || "-",
        focus: cleanStr(focusParts.join(' | ').replace(/^(?:Tindakan\s*\/\s*bukti|Tindakan|Bukti|Fokus)\s*:?\s*/i, '')) || "-"

  const isActivityHeadingLine = (line) => {

  // Teks yang sudah ada tidak pernah diganti template; template hanya mengisi kolom kosong. Kekurangan dilaporkan validator.

  const removeRepeatedTargetTriplet = (value) => {
    const text = cleanStr(value);
    const lines = text.split(/\n+/).map(line => line.trim()).filter(Boolean);
    if (!lines.length) return "";
    const secondStart = lines.findIndex((line, index) => index > 0 && /^1[\.)]\s+/.test(line) && hasNumberedOneToThree(lines.slice(0, index).join('\n')) && hasNumberedOneToThree(lines.slice(index).join('\n')));

  const ensureSituasiNyata = (value, data = rppData) => {

    const topic = cleanStr(data.topik) || "topik pembelajaran";

    return cleanStr(`${text ? `${text}\n` : ""}1. Konteks lokal: Siswa mengaitkan ${topic} dengan fenomena yang dapat diamati di ${school}, rumah, atau lingkungan sekitar.\n2. Masalah nyata: Siswa menelaah peristiwa/kasus sederhana yang dekat dengan pengalaman mereka sehingga konsep tidak dipelajari secara abstrak.\n3. Bukti awal: Siswa memakai pengamatan, cerita, data sederhana, foto, peta, tabel, atau hasil diskusi sebagai jangkar pembelajaran bermakna.`);

  useEffect(() => {
    setRppData(prev => {

  const normalizeBentuk = (value) => {
    const v = cleanStr(value).toLowerCase();

    if (v.includes("jodoh")) return "Menjodohkan";
    if (v.includes("isian")) return "Isian Singkat";
    if (v.includes("urai")) return "Uraian";

    if (v.includes("proyek") || v.includes("projek")) return "Proyek";

  const getBentukPenilaianList = (kisi = rppData.kisiKisi) => {

  const buildDefaultRubrik = (bentuk) => ({

      bentuk === "PG Kompleks" ? "Nilai penuh hanya diberikan bila tepat dua pilihan benar dari lima opsi A-E dipilih seluruhnya.\nJika ada satu pilihan salah, kurang satu pilihan benar, atau memilih lebih dari dua, skor menjadi 0." :
      bentuk === "Menjodohkan" ? "Tersedia 5 premis dan 6-7 respon (respon lebih banyak agar tidak dapat ditebak dengan eliminasi).\nSetiap pasangan benar bernilai 1 sampai total 5.\nPasangan salah, ganda, atau kosong bernilai 0 pada pasangan tersebut." :
      bentuk === "Benar/Salah" ? "Tersedia 4 pernyataan; setiap penilaian Benar/Salah yang tepat bernilai 1 (total 0-4).\nPernyataan yang tidak dinilai atau dinilai keduanya bernilai 0." :
      bentuk === "Isian Singkat" ? "Skor 2 bila istilah/angka/jawaban tepat.\nSkor 1 bila inti jawaban benar tetapi kurang lengkap.\nSkor 0 bila salah atau kosong." :
      bentuk === "Uraian" ? "Skor 5: jawaban lengkap, konsep tepat, alasan kuat, dan memakai bukti/konteks.\nSkor 3-4: konsep tepat tetapi alasan/bukti belum lengkap.\nSkor 1-2: sebagian konsep benar tetapi penalaran lemah.\nSkor 0: tidak menjawab atau tidak sesuai indikator." :
      `Kriteria disusun sesuai evidensi ${bentuk}: proses, produk/kinerja, ketepatan konsep, penggunaan bukti, dan refleksi siswa.`

  const stripLeadingLabel = (text, labels = []) => {
    let value = cleanStr(text);
    labels.forEach(label => {
      value = value.replace(new RegExp(`^\\s*${label}\\s*[:=\\-]\\s*`, "i"), "");
    });

  };

  const stripRubrikLabels = (text) => cleanStr(text)
    .replace(/(^|\n)\s*Kriteria\s*[:=]\s*/gi, '$1')
    .replace(/(^|\n)\s*Deskripsi\s*Indikator\s*Penilaian\s*[:=]\s*/gi, '$1')
    .replace(/\n\s*\n/g, '\n')
    .trim();

  const getMaxScoreByFormOrText = (form, scoreText = "") => {
    const fixedMax = { "PG": "1", "PG Kompleks": "2", "Benar/Salah": "4", "Menjodohkan": "5", "Isian Singkat": "2", "Uraian": "5" };
    if (fixedMax[form]) return fixedMax[form];
    const nums = (cleanStr(scoreText).match(/\d+/g) || []).map(Number);
    if (nums.length) return String(Math.max(...nums));
    return form === "Praktik" || form === "Proyek" ? "4" : "-";
  };

  const getRubrikRangeByFormOrText = (form, scoreText = "") => {
    const fixedRange = { "PG": "0-1", "PG Kompleks": "0-2", "Benar/Salah": "0-4", "Menjodohkan": "0-5", "Isian Singkat": "0-2", "Uraian": "0-5", "Praktik": "0-10", "Proyek": "0-10" };
    const raw = cleanStr(scoreText);
    const directRange = raw.match(/\b\d+\s*-\s*\d+\b/);
    if (directRange && raw.split(/\n+/).length === 1) return directRange[0].replace(/\s*/g, '');
    if (fixedRange[form]) return fixedRange[form];
    const nums = (raw.match(/\d+/g) || []).map(Number);
    return nums.length ? `0-${Math.max(...nums)}` : "0-4";
  };

  const buildScoreRepresentation = (rangeText, criteriaText, form = "") => {
    const range = cleanStr(rangeText);
    let criteria = stripRubrikLabels(criteriaText);
    // ===== PERBAIKAN ENTER OTOMATIS =====
    criteria = criteria
      .replace(/\s+(?=Skor\s+\d+)/gi, '\n')
      .replace(/;\s*(?=Skor\s+\d+)/gi, '\n')
      .replace(/\.\s*(?=Skor\s+\d+)/gi, '.\n');

    // ====================================
    if (/Skor\s+\d+(?:\s*-\s*\d+)?\s*:/i.test(criteria)) return criteria;
    // Deskriptor dari AI/guru dalam format lain tetap dipakai, bukan dibuang.
    if (criteria && !/^Rentang\s+Nilai\s*:/i.test(criteria)) return criteria;
    // Rentang polos "0-1" bukan deskriptor; jangan diubah menjadi "Skor 0: 1".
    let source = (/^\d+\s*-\s*\d+$/.test(range) ? "" : range) || skorBentuk[form] || "";
    if (/^Rentang\s+Nilai\s*:/i.test(criteria)) {
      source = criteria.replace(/^Rentang\s+Nilai\s*:\s*/i, '');
      criteria = "";
    }
    const lines = source.replace(/^Rentang\s+Nilai\s*:\s*/i, '').split(/\n+/).map(line => line.trim()).filter(Boolean);
    const converted = lines.map(line => {
      const match = line.match(/^(?:Skor\s*)?(\d+(?:\s*-\s*\d+)?)\s*(?:=|:|-)\s*(.+)$/i);
      if (!match) return line;
      const score = match[1].replace(/\s+/g, '');
      const desc = match[2].trim();
      return `Skor ${score}: ${desc.charAt(0).toUpperCase() + desc.slice(1)}`;
    }).filter(Boolean);
    if (converted.length) return converted.join('\n');
    return criteria || `Skor ${getRubrikRangeByFormOrText(form, range)}: Deskripsi capaian disesuaikan dengan indikator penilaian.`;
  };

  const normalizeRubrikRow = (row = {}, fallbackForm = "") => {

      return { id: row.id || Date.now() + 'r', bentukPenilaian: "", skor: "", kriteria: "" };
    }
    const bentuk = normalizeBentuk(row.bentukPenilaian || row.bentuk || row.jenis || fallbackForm);
    const fallback = buildDefaultRubrik(bentuk || fallbackForm || "Tertulis");
    const rawScore = cleanStr(row.skor);
    const rawCriteria = cleanStr(row.kriteria);
    const sourceRange = (rawScore && (/[=:-]/.test(rawScore) || rawScore.split(/\n+/).length > 1)) ? rawScore : fallback.skor;
    const sourceCriteria = rawCriteria;
    return {
      id: row.id || Date.now() + 'r',
      bentukPenilaian: bentuk || fallback.bentukPenilaian,
      skor: getRubrikRangeByFormOrText(bentuk, rawScore || fallback.skor),
      kriteria: buildScoreRepresentation(sourceRange, sourceCriteria, bentuk)
    };
  };

  const kkoByLevel = { C1: "mengidentifikasi", C2: "menjelaskan", C3: "menerapkan", C4: "menganalisis", C5: "mengevaluasi", C6: "merancang" };
  const getExpectedAssessmentSequence = (planData = rppData) => {

      const finalBentuk = shape.bentuk || normalizeBentuk(k.bentuk) || fallback.bentuk;

  const getChoiceLabels = (form = "PG") => normalizeBentuk(form) === "PG Kompleks" ? ["A", "B", "C", "D", "E"] : ["A", "B", "C", "D"];

  const repairLegacyChoiceLineBreaks = (text, form = "PG") => {
    const source = String(text || "").replace(/\r\n?/g, '\n').replace(/\\n/g, '\n');
    const requiredLabels = getChoiceLabels(form).slice(0, 4);
    const hasUppercaseChoices = requiredLabels.every(label => new RegExp(`(^|\\n|\\s|[.,;:!?])${label}\\s*[\\).:-]`).test(source));
    const hasMatchingStructure = /(?:premis|kelompok\s*a|kolom\s*a)[\s\S]*(?:respon|kelompok\s*b|kolom\s*b)/i.test(source);
    if (!hasUppercaseChoices && !hasMatchingStructure) return source;
    return source.replace(/([A-Za-z\u00c0-\u00d6\u00d8-\u00f6\u00f8-\u00ff]{3,})\n[ \t]*([a-d])([\.\)])(?=\s|[\.,;:!?\)]|$)/g, '$1$2$3');
  };

  const getChoiceOptionSequence = (text, form = "PG") => {
    const source = String(text || "")
      .replace(/\r\n?/g, '\n')
      .replace(/\\n/g, '\n')
      .replace(/\*\*/g, '')
      .trim();
    const labels = getChoiceLabels(form);
    const labelPattern = labels.join('');
    const findMarkers = (pattern) => {
      const candidates = [...source.matchAll(pattern)].map(match => ({
        label: match[2].toUpperCase(),
        markerStart: match.index + match[1].length,
        contentStart: match.index + match[0].length
      }));
      const found = [];
      let cursor = -1;
      labels.forEach(label => {
        const marker = candidates.find(candidate => candidate.label === label && candidate.markerStart > cursor);
        if (marker) {
          found.push(marker);
          cursor = marker.markerStart;
        }
      });
      return found;
    };
    // Opsi per baris dibaca dari awal baris saja, agar "di Lokasi B." di akhir opsi A tidak dianggap penanda opsi B (temuan live Phase 2).
    const lineMarkers = findMarkers(new RegExp(`(^|\\n)([${labelPattern}])\\s*[\\).:-]\\s*`, 'g'));
    const markers = lineMarkers.length === labels.length ? lineMarkers : findMarkers(new RegExp(`(^|[\\n\\r]|[ \\t]+|[\\.,;:!?])([${labelPattern}])\\s*[\\).:-]\\s*`, 'g'));
    if (markers.length !== labels.length) return { source, markers: [], options: [] };
    const options = markers.map((marker, index) => {
      const end = markers[index + 1]?.markerStart ?? source.length;
      const value = cleanStr(source.slice(marker.contentStart, end)).replace(/^[,;\s]+|[,;\s]+$/g, '').trim();
      return { label: marker.label, value };
    });
    return { source, markers, options };
  };

  const parseChoiceOptions = (text, form = "PG") => getChoiceOptionSequence(text, form).options;
  const hasCompleteChoiceOptions = (text, form = "PG") => {
    const labels = getChoiceLabels(form);
    const options = parseChoiceOptions(text, form);
    return options.length === labels.length && options.every((option, index) => option.label === labels[index] && option.value.length > 0);
  };

  const splitChoiceOptionsFromSoal = (soal, opsi, bentuk) => {
    const form = normalizeBentuk(bentuk);
    const question = cleanStr(soal);
    let options = cleanStr(opsi);
    if (!["PG", "PG Kompleks"].includes(form)) return { soal: question, opsi: options };
    const sequence = getChoiceOptionSequence(question, form);
    if (sequence.markers.length !== getChoiceLabels(form).length) return { soal: question, opsi: options };
    const start = sequence.markers[0].markerStart;
    const candidate = cleanStr(question.slice(start));
    if (!hasCompleteChoiceOptions(candidate, form)) return { soal: question, opsi: options };
    return {
      soal: cleanStr(question.slice(0, start)),
      opsi: hasCompleteChoiceOptions(options, form) ? options : candidate
    };
  };

  const splitMatchingOptionsFromSoal = (soal, opsi) => {
    const question = cleanStr(soal);
    const options = cleanStr(opsi);
    if (/(premis|kelompok\s*a|kolom\s*a).*(respon|kelompok\s*b|kolom\s*b)/is.test(options)) {
      // Daftar yang ikut tertulis di soal (temuan live: tampil dua kali) dipotong hanya bila berbentuk daftar "Kolom A:" + "1.".
      const listStart = question.search(/(premis\s*\/\s*kolom\s*a|kelompok\s*a|kolom\s*a)\s*:\s*1\s*[.)]/i);
      const cut = listStart > 0 && /(respon|kelompok\s*b|kolom\s*b)\s*:/i.test(question.slice(listStart));
      return { soal: cut ? cleanStr(question.slice(0, listStart)) : question, opsi: options };
    }
    const match = question.match(/((?:premis\s*\/\s*kolom\s*a|kelompok\s*a|kolom\s*a)\s*:?\s*[\s\S]*)/i);
    if (!match || !/(respon|kelompok\s*b|kolom\s*b)/i.test(match[1])) return { soal: question, opsi: options };
    return { soal: cleanStr(question.slice(0, match.index)), opsi: options || cleanStr(match[1]) };
  };

  const normalizeChoiceOptionsText = (text, form = "PG") => {
    const labels = getChoiceLabels(form);
    const labelPattern = labels.join('');
    let value = cleanStr(repairLegacyChoiceLineBreaks(text, form));
    if (/(premis|kelompok\s*a|kolom\s*a).*(respon|kelompok\s*b|kolom\s*b)/is.test(value)) {
      value = value.replace(/(?:premis|kelompok\s*a|kolom\s*a)\s*:?\s*[\s\S]*?(?:respon\s*\/\s*)?(?:kelompok\s*b|kolom\s*b)\s*:?\s*/i, '');
    }
    value = value.replace(new RegExp(`,\\s*(?=\\n\\s*[${labelPattern}]\\s*[\\).:-])`, 'g'), '\n').replace(/,\s*$/gm, '');
    const options = parseChoiceOptions(value, form);
    if (options.length === labels.length) return options.map(option => `${option.label}. ${option.value}`).join('\n');
    return value;
  };

  const normalizeMatchingOptionsText = (text) => {
    let value = cleanStr(repairLegacyChoiceLineBreaks(text));
    value = value
      .replace(/(Kolom\s*A\s*:)[ \t]*(?=\S)/gi, '$1\n')
      .replace(/((?:^|\n)\s*\d+\s*[\).:-][^\n]*?)\s*\/\s*(?:Respon\s*\/\s*)?(?:Kolom|Kelompok)\s*B\s*:?\s*/gi, '$1\nRespon / Kolom B:\n')
      .replace(/(?:^|\n)\s*(?:Respon\s*\/\s*)?(?:Kolom|Kelompok)\s*B\s*:?\s*/gi, '\nRespon / Kolom B:\n')
      .replace(/Respon\s*\n+\s*Respon\s*\/\s*(?:Kolom|Kelompok)\s*B\s*:/gi, 'Respon / Kolom B:')
      .replace(/(?:Respon\s*\/\s*(?:Kolom|Kelompok)\s*B\s*:?\s*){2,}/gi, 'Respon / Kolom B:\n')
      .replace(/,\s*(?=\n\s*(?:\d+|[A-H])\s*[\).:-])/gi, '\n')
      .replace(/,\s*$/gm, '');
    return cleanStr(value);
  };

  const hasClearStimulus = (text) => {
    const value = cleanStr(text);
    return value.length >= 110 && /(data|kasus|tabel|grafik|cerita|situasi|pengamatan|informasi|hasil|lingkungan|siswa|sekolah|angka|jumlah|fakta|laporan|observasi)/i.test(value);
  };

  const normalizeAnswerGuideText = (text) => stripLeadingLabel(text, [
    "Pedoman\\s+Jawaban",
    "Pedoman\\s+jawab",
    "Kunci\\s+Jawaban",
    "Jawaban\\s+Uraian",
    "Jawaban",
    "Rubrik\\s+ringkas"
  ]);

  // Soal tidak pernah diberi prefiks/template; kekurangan stimulus atau struktur dilaporkan validateAssessmentStructure.
  const normalizeBankRowByKisi = (rawRow, kisiRow, index) => {
    const b = rawRow || {};
    const form = normalizeBentuk(kisiRow?.bentuk || bentukSoalUrut[index] || "");
    let split = splitChoiceOptionsFromSoal(b.soal, b.opsi, form);
    if (form === "Menjodohkan") split = splitMatchingOptionsFromSoal(split.soal, split.opsi);
    let soal = cleanStr(split.soal);
    let opsi = cleanStr(split.opsi);
    let kunci = cleanStr(b.kunci);
    if (form === "PG" || form === "PG Kompleks") opsi = normalizeChoiceOptionsText(opsi, form);
    if (form === "Menjodohkan") opsi = normalizeMatchingOptionsText(opsi);
    if (form === "Benar/Salah") {
      const statements = new Set(opsi.split("\n").map(line => line.trim()).filter(line => /^\d+\s*[.)]\s*\S{3,}/.test(line) && !/^\d+\s*[.)]\s*(benar|salah|b|s)\.?$/i.test(line)));
      if (statements.size) soal = cleanStr(soal.split("\n").filter(line => !statements.has(line.trim())).join("\n"));
    }
    if (form === "Isian Singkat") {
      if (!kunci && opsi && opsi !== "-") kunci = normalizeAnswerGuideText(opsi);
      opsi = "-";
    }
    if (form === "Uraian") {
      const guide = normalizeAnswerGuideText(opsi) || normalizeAnswerGuideText(kunci);
      opsi = guide || "-";
      kunci = "-";
    }
    if (form === "Praktik" || form === "Proyek") {
      opsi = normalizeAnswerGuideText(opsi) || normalizeAnswerGuideText(kunci) || "-";
      kunci = "-";
    }
    return {
      id: Date.now() + 'b' + index,
      soal,
      opsi,
      kunci: normalizeBankKey(kunci, form),
      pembahasan: cleanStr(b.pembahasan)
    };
  };

  const mapBankRows = (rows, kisi = rppData.kisiKisi) => {
    const total = kisi?.length || rows?.length || 0;
    return Array.from({ length: total }).map((_, i) => normalizeBankRowByKisi(rows?.[i], kisi?.[i], i));
  };

  const getBankRowForDisplay = (row, index) => {
    const kisi = rppData.kisiKisi[index] || { bentuk: bentukSoalUrut[index] || "" };
    const normalized = normalizeBankRowByKisi(row, kisi, index);
    return { ...row, soal: normalized.soal, opsi: normalized.opsi, kunci: normalized.kunci };
  };

  const getPertemuanActivitySummary = (data = rppData) => syncPertemuanPembelajaran(data).map((row, index) => (
    `Pertemuan ${index + 1}: Pemetaan sintaks=${cleanStr(row.pemetaanSintaks) || '-'} | Awal=${cleanStr(row.kegiatanAwal) || '-'} | Inti=${cleanStr(row.kegiatanInti) || '-'} | Penutup=${cleanStr(row.kegiatanPenutup) || '-'} | Target=${[row.pengalamanMemahami, row.pengalamanMengaplikasi, row.pengalamanMerefleksi].filter(Boolean).join(' | ') || '-'}`
  )).join('\n');

  const getLkpdMeetingContext = (data = rppData) => syncPertemuanPembelajaran(data).map((row, index) => `KONTEKS LKPD PERTEMUAN ${index + 1}
- Pemetaan sintaks: ${cleanStr(row.pemetaanSintaks) || '-'}
- Kegiatan awal: ${cleanStr(row.kegiatanAwal) || '-'}
- Pengalaman memahami: ${cleanStr(row.pengalamanMemahami) || '-'}
- Assessment for Learning: ${cleanStr(row.asesmenAwal) || '-'}
- Kegiatan inti: ${cleanStr(row.kegiatanInti) || '-'}
- Pengalaman mengaplikasi: ${cleanStr(row.pengalamanMengaplikasi) || '-'}
- Assessment as Learning: ${cleanStr(row.asesmenProses) || '-'}
- Kegiatan penutup: ${cleanStr(row.kegiatanPenutup) || '-'}
- Pengalaman merefleksi: ${cleanStr(row.pengalamanMerefleksi) || '-'}
- Assessment of Learning: ${cleanStr(row.asesmenAkhir) || '-'}
- Prinsip PM: ${cleanStr(row.prinsipPM) || '-'}
- Diferensiasi (dukungan/tantangan): ${cleanStr(row.diferensiasi) || '-'}`).join('\n\n');

  const getDefaultLkpdRow = (index, data = rppData) => {
    const pertemuan = syncPertemuanPembelajaran(data)[index] || {};
    const topic = cleanStr(data.topik) || "topik pembelajaran";
    const tp = cleanStr(data.tp).replace(/\n+/g, '; ').slice(0, 300) || "tujuan pembelajaran pada modul ajar";
    const kegiatanInti = cleanStr(pertemuan.kegiatanInti) || "kegiatan inti pembelajaran";
    const asesmen = [pertemuan.asesmenAwal, pertemuan.asesmenProses, pertemuan.asesmenAkhir].map(cleanStr).filter(Boolean).join('\n');
    return {
      id: `lkpd-${index + 1}`,
      pertemuan: `Pertemuan ${index + 1}`,
      judul: `LKPD Pertemuan ${index + 1}: ${topic}`,
      tujuan: `1. Siswa mengerjakan aktivitas LKPD untuk mencapai TP modul: ${tp}.\n2. Siswa menghasilkan bukti belajar yang selaras dengan kegiatan pembelajaran pertemuan ${index + 1}.`,
      petunjuk: "1. Baca setiap instruksi dengan teliti.\n2. Kerjakan secara mandiri atau berkelompok sesuai arahan guru.\n3. Gunakan data, bukti, atau hasil pengamatan dari kegiatan pembelajaran.\n4. Tulis jawaban dengan alasan yang jelas.",
      sumberBahan: `Bahan/sumber: catatan kegiatan, materi esensial ${topic}, konteks nyata siswa, alat tulis, dan media/alat yang digunakan pada kegiatan inti.`,
      langkahKerja: `1. Amati atau baca kembali stimulus/kasus yang digunakan pada kegiatan inti.\n2. Ikuti urutan tugas sesuai pemetaan sintaks pertemuan: ${cleanStr(pertemuan.pemetaanSintaks) || 'fase awal, inti, dan akhir yang ditetapkan guru.'}\n3. Kerjakan tugas sesuai alur kegiatan: ${kegiatanInti}\n4. Catat data, temuan, atau alasan penting yang mendukung jawaban.\n5. Susun produk/jawaban akhir sesuai kriteria keberhasilan dan periksa kembali menggunakan umpan balik guru/teman.`,
      produkBukti: `Produk/bukti belajar: jawaban LKPD, catatan data/pengamatan, kesimpulan, dan/atau produk kinerja yang sesuai dengan asesmen pertemuan.\nAcuan asesmen: ${asesmen || "asesmen awal, proses, dan akhir pada modul ajar."}`,
      refleksi: "1. Bagian mana yang paling membantu pemahamanmu?\n2. Bukti apa yang menunjukkan kamu sudah memahami materi?\n3. Kesulitan apa yang masih perlu dibantu?\n4. Apa perbaikan yang akan kamu lakukan pada tugas berikutnya?"
    };
  };

  const normalizeLkpdRow = (row = {}, index = 0, data = rppData) => {
    const fallback = getDefaultLkpdRow(index, data);
    return {
      id: row.id || fallback.id,
      pertemuan: cleanStr(row.pertemuan) || fallback.pertemuan,
      judul: cleanStr(row.judul) || fallback.judul,
      tujuan: cleanStr(row.tujuan) || fallback.tujuan,
      petunjuk: cleanStr(row.petunjuk) || fallback.petunjuk,
      sumberBahan: cleanStr(row.sumberBahan || row.bahanSumber || row.sumber) || fallback.sumberBahan,
      langkahKerja: ensureNumberedListText(row.langkahKerja || row.aktivitas || row.kegiatan, fallback.langkahKerja, 5),
      produkBukti: ensureLkpdProductText(row.produkBukti || row.bukti || row.produk || row.hasil, fallback.produkBukti),
      refleksi: ensureNumberedListText(row.refleksi || row.pertanyaanRefleksi, fallback.refleksi, 3),
      jenis: LKPD_TEMPLATES[row.jenis] ? row.jenis : "diskusi",
      lembarKerja: sanitizeLkpdBlocks(row.lembarKerja).length ? sanitizeLkpdBlocks(row.lembarKerja) : (LKPD_TEMPLATES[row.jenis] || LKPD_TEMPLATES.diskusi).blok.map(block => ({ ...block })),
      bantuan: cleanStr(row.bantuan),
      tantangan: cleanStr(row.tantangan)
    };
  };
  // Lembar kerja siswa (Phase 2 §4): bentuk blok berasal dari templat aplikasi; AI mengisi judul/kolom/pertanyaan.
  const LKPD_TEMPLATES = {
    observasi: { nama: "Observasi", blok: [{ tipe: "tabel", judul: "Tabel Hasil Pengamatan", kolom: ["No", "Objek yang Diamati", "Hasil Pengamatan", "Keterangan"], baris: 6 }, { tipe: "isian", judul: "Analisis: apa pola atau hubungan yang kamu temukan dari data pengamatan?", baris: 4 }, { tipe: "isian", judul: "Kesimpulan", baris: 3 }] },
    praktikum: { nama: "Praktikum", blok: [{ tipe: "isian", judul: "Rumusan masalah dan hipotesis", baris: 3 }, { tipe: "tabel", judul: "Tabel Data Percobaan", kolom: ["Percobaan ke-", "Variabel yang Diubah", "Hasil Pengukuran", "Catatan"], baris: 5 }, { tipe: "isian", judul: "Analisis data", baris: 4 }, { tipe: "isian", judul: "Kesimpulan", baris: 3 }] },
    analisis_teks: { nama: "Analisis Teks", blok: [{ tipe: "tabel", judul: "Tabel Analisis Teks", kolom: ["Kutipan dari Teks", "Informasi yang Didapat", "Bukti/Alasan", "Interpretasi"], baris: 5 }, { tipe: "isian", judul: "Kesimpulan", baris: 3 }] },
    matematika: { nama: "Pemecahan Masalah Matematika", blok: [{ tipe: "isian", judul: "Diketahui", baris: 3 }, { tipe: "isian", judul: "Ditanyakan", baris: 2 }, { tipe: "isian", judul: "Model matematika / strategi", baris: 3 }, { tipe: "isian", judul: "Proses penyelesaian", baris: 6 }, { tipe: "isian", judul: "Kesimpulan", baris: 2 }] },
    proyek: { nama: "Proyek", blok: [{ tipe: "tabel", judul: "Rencana dan Pembagian Tugas", kolom: ["Tugas", "Penanggung Jawab", "Tenggat", "Status"], baris: 5 }, { tipe: "isian", judul: "Deskripsi produk", baris: 4 }, { tipe: "isian", judul: "Evaluasi produk", baris: 3 }] },
    diskusi: { nama: "Diskusi", blok: [{ tipe: "isian", judul: "Pertanyaan diskusi 1", baris: 4 }, { tipe: "isian", judul: "Pertanyaan diskusi 2", baris: 4 }, { tipe: "isian", judul: "Kesimpulan kelompok", baris: 3 }] }
  };
  const sanitizeLkpdBlocks = (blocks) => (Array.isArray(blocks) ? blocks : []).map(block => ({
    tipe: block?.tipe === "tabel" ? "tabel" : "isian",
    judul: cleanStr(block?.judul),
    kolom: block?.tipe === "tabel" ? (Array.isArray(block?.kolom) ? block.kolom : String(block?.kolom || "").split(",")).map(col => cleanStr(col)).filter(Boolean) : [],
    baris: Math.min(15, Math.max(1, parseInt(block?.baris, 10) || 3))
  })).filter(block => block.judul || block.kolom.length);

  const mapLkpdRows = (rows, data = rppData) => {
    const pertemuanRows = syncPertemuanPembelajaran(data);
    return pertemuanRows.map((_, index) => normalizeLkpdRow(Array.isArray(rows) ? rows[index] : {}, index, data));
  };

  // Data LKPD apa adanya untuk edit/tampilan/ekspor; normalisasi hanya saat menerima hasil AI.
  const getLkpdRowsForView = (data = rppData) => syncPertemuanPembelajaran(data).map((_, index) => ({ pertemuan: `Pertemuan ${index + 1}`, ...((data.lkpd || [])[index] || {}) }));

  useEffect(() => {
    const expectedLength = syncPertemuanPembelajaran(rppData).length;
    if ((rppData.lkpd || []).length >= expectedLength) return;
    setRppData(prev => ({ ...prev, lkpd: syncPertemuanPembelajaran(prev).map((_, index) => (prev.lkpd || [])[index] || getDefaultLkpdRow(index, prev)) }));
  }, [rppData.jumlahPertemuan, (rppData.lkpd || []).length]);

  useEffect(() => {
    if (!rppData.rubrikPenilaian.length) return;
    const needsMigration = rppData.rubrikPenilaian.some(row => {
      const skor = cleanStr(row.skor);
      const kriteria = cleanStr(row.kriteria);
      return /^Rentang\s+Nilai\s*:/i.test(kriteria) ||
        /(^|\n)\s*Kriteria\s*[:=]/i.test(kriteria) ||
        /^Skor\s+\d+(?:\s*-\s*\d+)?\s*:/i.test(skor);
    });
    if (!needsMigration) return;
    const normalizedRows = rppData.rubrikPenilaian.map(row => ({ ...normalizeRubrikRow(row), id: row.id }));
    setRppData(prev => ({ ...prev, rubrikPenilaian: normalizedRows }));
  }, [rppData.rubrikPenilaian.length]);

  const countMatchingParts = (text) => {
    const clean = normalizeMatchingOptionsText(text);
    const split = clean.match(/(?:premis|kelompok\s*a|kolom\s*a)\s*:?\s*([\s\S]*?)(?:respon|kelompok\s*b|kolom\s*b)\s*:?\s*([\s\S]*)/i);
    const premisSource = split ? split[1] : clean;
    const responSource = split ? split[2] : clean;
    const premis = (premisSource.match(/(^|\n)\s*\d+\s*[\).:-]\s*\S/g) || []).length;
    const respon = (responSource.match(/(^|\n)\s*[A-H]\s*[\).:-]\s*\S/gi) || []).length;
    return { premis, respon };
  };

  const countMatchingKeys = (text) => (cleanStr(text).match(/\d+\s*[-=]\s*[A-H]/gi) || []).length;

  const extractKeyLetters = (text, form = "PG") => {
    const upper = cleanStr(text).toUpperCase();
    const labels = getChoiceLabels(form);
    const labelPattern = labels.join('');
    const spaced = upper.match(new RegExp(`\\b[${labelPattern}]\\b`, 'g')) || [];
    if (spaced.length) return [...new Set(spaced)];
    const compact = upper.replace(new RegExp(`[^${labelPattern}]`, 'g'), '');
    if (new RegExp(`^[${labelPattern}]{1,${labels.length}}$`).test(compact)) return [...new Set(compact.split(''))];
    return [];
  };

  const normalizeBankKey = (text, form) => {
    const normalizedForm = normalizeBentuk(form);
    const raw = cleanStr(text);
    if (!raw) return "";
    if (normalizedForm === "PG") {
      const letters = extractKeyLetters(raw, normalizedForm);
      return letters.length === 1 ? letters[0] : raw;
    }
    if (normalizedForm === "PG Kompleks") {
      const letters = extractKeyLetters(raw, normalizedForm).sort();
      return letters.length === 2 ? `${letters[0]} dan ${letters[1]}` : raw;
    }
    if (normalizedForm === "Benar/Salah") {
      const pairs = [...raw.matchAll(/(\d+)\s*[-=:.)]?\s*(Benar|Salah|B|S)\b/gi)].map(m => `${m[1]}-${m[2][0].toUpperCase()}`);
      return pairs.length ? pairs.join(", ") : raw;
    }
    return raw;
  };

  const extractListItems = (text, markerPattern) => {
    const source = cleanStr(text).replace(/\s*\|\s*/g, '\n');
    const marker = new RegExp(`(^|\\n|,|;)\\s*${markerPattern}\\s*[\\).:-]\\s*`, 'gi');
    const matches = [...source.matchAll(marker)];
    return matches.map((m, idx) => {
      const label = m[2];
      const start = m.index + m[0].length;
      const end = idx + 1 < matches.length ? matches[idx + 1].index : source.length;
      const value = source.slice(start, end).replace(/^[\s,;|:\-]+|[\s,;|:\-]+$/g, '');
      return { label, value };
    }).filter(item => item.value);
  };

  const parseMatchingOptions = (text) => {
    const source = normalizeMatchingOptionsText(text);
    const split = source.match(/(?:premis|kelompok\s*a|kolom\s*a)\s*:?\s*([\s\S]*?)(?:respon|kelompok\s*b|kolom\s*b)\s*:?\s*([\s\S]*)/i);
    const premisSource = split ? split[1] : source;
    const responSource = split ? split[2] : source;
    return {
      premis: extractListItems(premisSource, '(\\d+)'),
      respon: extractListItems(responSource, '([A-H])')
    };
  };

  const hasRubrikScoreLogic = (form, scoreText, criteriaText = "") => {
    const score = cleanStr(`${scoreText || ""}\n${criteriaText || ""}`);
    if (!score) return false;
    if (form === "PG") return /\b1\b/.test(score) && /\b0\b/.test(score);
    if (form === "PG Kompleks") return /\b2\b/.test(score) && /\b0\b/.test(score);
    if (form === "Menjodohkan") return /\b5\b/.test(score) && /\b4\b/.test(score) && /\b3\b/.test(score) && /\b2\b/.test(score) && /\b1\b/.test(score) && /\b0\b/.test(score);
    if (form === "Isian Singkat") return /\b2\b/.test(score) && /\b1\b/.test(score) && /\b0\b/.test(score);
    if (form === "Uraian") return /\b5\b/.test(score) && /\b4\b/.test(score) && /\b3\b/.test(score) && /\b2\b/.test(score) && /\b1\b/.test(score) && /\b0\b/.test(score);
    if (form === "Praktik" || form === "Proyek") return /\b10\b/.test(score) && /\b0\b/.test(score);
    return /\b4\b/.test(score) && /\b3\b/.test(score) && /\b2\b/.test(score) && /\b1\b/.test(score);
  };

  const mapRubrikByKisi = (rows, kisi = rppData.kisiKisi) => {
    const forms = getBentukPenilaianList(kisi);
    const byForm = {};
    (rows || []).forEach((row, i) => {
      const bentuk = normalizeBentuk(row.bentukPenilaian || row.bentuk || row.jenis || forms[i]);
      if (bentuk && !byForm[bentuk]) byForm[bentuk] = row;
    });
    return forms.map((bentuk, i) => {
      const src = byForm[bentuk] || {};
      return { ...normalizeRubrikRow(src, bentuk), id: src.id || Date.now() + 'r' + i, bentukPenilaian: bentuk };
    });
  };

  const syncRubrikFromKisi = () => {
    setRppData(prev => ({ ...prev, rubrikPenilaian: mapRubrikByKisi([], prev.kisiKisi) }));
    notify("Rubrik Disinkronkan", "Rubrik sudah dibuat ulang berdasarkan bentuk penilaian unik di kisi-kisi. Kolom skor hanya berisi skor maksimal, sedangkan rentang nilai masuk ke deskripsi.", "success");
  };

  const validateAssessmentStructure = (data = rppData) => {
    const warnings = [];
    const kisi = data.kisiKisi || [];
    const bank = data.bankSoal || [];
    const rubrik = data.rubrikPenilaian || [];
    const blueprint = getAssessmentBlueprint(data);
    const expectedSequence = getExpectedAssessmentSequence(data);
    const expectedTotal = expectedSequence.length;
    const requiredForms = kisi.length ? getBentukPenilaianList(kisi) : [...new Set(blueprint.map(row => row.bentuk))];
    if (expectedTotal < 1) warnings.push("Rencana Jumlah Soal belum valid. Isi minimal satu bentuk soal dengan jumlah lebih dari 0.");
    if (kisi.length !== expectedTotal) warnings.push(`Kisi-kisi harus tepat ${expectedTotal} baris sesuai rencana jumlah soal, saat ini ${kisi.length}.`);
    const hotsCount = kisi.filter(k => ["C4","C5","C6"].includes(k.level)).length;
    if (kisi.length >= expectedTotal && hotsCount < Math.ceil(expectedTotal * 0.6)) warnings.push(`Kisi-kisi perlu dominan C4-C6, saat ini baru ${hotsCount} indikator.`);
    const expectedGroups = {};
    const actualGroups = {};
    expectedSequence.forEach(shape => {
      const key = `${shape.bentuk}|${shape.level}`;
      expectedGroups[key] = (expectedGroups[key] || 0) + 1;
    });
    kisi.forEach(row => {
      const key = `${normalizeBentuk(row.bentuk)}|${cleanStr(row.level).toUpperCase()}`;
      actualGroups[key] = (actualGroups[key] || 0) + 1;
    });
    Object.keys(expectedGroups).forEach(key => {
      const [form, level] = key.split('|');
      const actual = actualGroups[key] || 0;
      if (actual !== expectedGroups[key]) warnings.push(`Rencana ${form} level ${level} harus tepat ${expectedGroups[key]} soal, saat ini ${actual}.`);
    });
    Object.keys(actualGroups).forEach(key => {
      if (!expectedGroups[key]) {
        const [form, level] = key.split('|');

      if ((bentuk === "Praktik" || bentuk === "Proyek") && !/(rambu|pedoman|langkah|produk|kinerja|kriteria|rubrik)/i.test(opsi)) warnings.push(`Soal ${i + 1}: ${bentuk} perlu rambu/pedoman pengerjaan di kolom pedoman jawab.`);

    // Butir hampir sama (kemiripan token Jaccard > 0,9) dan sebaran kunci PG yang menumpuk.

  // shortcut: status butir dibaca dari teks peringatan validator; ganti ke peringatan terstruktur bila validator dirombak.

  const getAiErrorText = (error) => String(error?.message || error || "");

    const minor = Number(version[2]) || 0;

            ...(currentTextFormat.schema ? { schema: normalizeGeminiSchemaTypes(currentTextFormat.schema) } : {})
          }

      delete config.responseSchema;

    const name = normalizeGeminiModelName(model);

    let score = 0;
    const version = name.match(/^gemini-(\d+)(?:\.(\d+))?/i);
    if (version) score += (Number(version[1]) || 0) * 100 + (Number(version[2]) || 0) * 10;
    if (/flash(?!-lite)/i.test(name)) score += 500;
    else if (/flash-lite/i.test(name)) score += 400;
    else if (/pro/i.test(name)) score += 250;

    const discovered = [];
    let pageToken = "";
    for (let page = 0; page < 5; page++) {
      const params = new URLSearchParams({ pageSize: "1000" });
      if (pageToken) params.set("pageToken", pageToken);

        headers: {
          "Accept": "application/json",
          "x-goog-api-key": cleanedKey

      } catch (parseError) {

    try {
      return await callGeminiAPIOnce(payload, options, controller.signal);

      if (controller.signal.aborted) throw new Error(controller.timedOut ? "AI_TIMEOUT" : "AI_CANCELLED");

      clearTimeout(timer);

    }

    const apiKey = sanitizeGeminiApiKey(options.apiKey || getActiveApiKey());

      missingKeyError.httpStatus = 401;
      missingKeyError.apiStatus = "UNAUTHENTICATED";

      } else {
        try {

        while (bank.length <= index) bank.push({ id: Date.now() + 'b' + bank.length, soal: "", opsi: "", kunci: "" });
        bank[index] = { ...bank[index], ...mapped, id: bank[index]?.id || mapped.id, verified: false };
        return { ...prev, bankSoal: bank };
      });
      const warnings = validateAssessmentStructure({ ...rppData, bankSoal: rppData.bankSoal.map((row, i) => i === index ? mapped : row) }).filter(w => w.includes(`Soal ${index + 1}:`));
      if (warnings.length) notify("Catatan Soal Ini", "- " + warnings.join("\n- "), "warning");
      else notify("Soal Diperbarui", `Soal nomor ${index + 1} sudah digenerate ulang sesuai kisi-kisi.`, "success");
    } catch (error) {
      handleAiFailure(error, `soal nomor ${index + 1}`);
    } finally { setIndividualLoading(prev => ({ ...prev, [loadingKey]: false })); }
  };

  const escapeHtml = (txt) => cleanStr(txt).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const normalizeInlineWordText = (txt) => cleanStr(txt).replace(/\s*\n+\s*/g, ' ').replace(/\s{2,}/g, ' ').trim();
  const formatKeyForExport = (key, form) => normalizeBankKey(key, form);
  const formatText = (txt) => {
    const lines = cleanStr(txt).split(/\n+/).map(line => line.trim()).filter(Boolean);
    if (!lines.length) return '';
    const getMarker = (line) => {
      let match = line.match(/^(\d+)[\.)]\s+(.+)$/);
      if (match) return { type: 'num', tag: 'ol', attr: `class="num-list" style="margin-top:0;margin-bottom:0;margin-left:0pt;padding-left:14pt;text-align:justify" start="${parseInt(match[1], 10) || 1}"`, text: match[2] };
      match = line.match(/^([A-Z])[\.)]\s+(.+)$/);
      if (match) return { type: 'upper', tag: 'ol', attr: `class="letter-list" style="margin-top:0;margin-bottom:0;margin-left:0pt;padding-left:14pt;text-align:justify" type="A" start="${match[1].charCodeAt(0) - 64}"`, text: match[2] };
      match = line.match(/^([a-z])[\.)]\s+(.+)$/);
      if (match) return { type: 'lower', tag: 'ol', attr: `class="lower-letter-list" style="margin-top:0;margin-bottom:0;margin-left:0pt;padding-left:14pt;text-align:justify" type="a" start="${match[1].charCodeAt(0) - 96}"`, text: match[2] };
      match = line.match(/^[-•]\s+(.+)$/);
      if (match) return { type: 'bullet', tag: 'ul', attr: 'class="bullet-list" style="margin-top:0;margin-bottom:0;margin-left:0pt;padding-left:14pt;text-align:justify"', text: match[1] };
      return null;
    };
    const html = [];
    let list = null;
    const flushList = () => {
      if (!list) return;
      html.push(`<${list.tag} ${list.attr}>${list.items.map(item => `<li style="margin:0 0 1pt 0;text-align:justify;line-height:1.05;mso-line-height-rule:at-least">${escapeHtml(item)}</li>`).join('')}</${list.tag}>`);
      list = null;
    };
    lines.forEach(line => {
      const marker = getMarker(line);
      if (marker) {
        const sameList = list && list.type === marker.type && list.tag === marker.tag;
        if (!sameList) {
          flushList();
          list = { type: marker.type, tag: marker.tag, attr: marker.attr, items: [] };
        }
        list.items.push(marker.text);
      } else {
        flushList();
        html.push(`<p class="text-line">${escapeHtml(line)}</p>`);
      }
    });
    flushList();
    return html.join('');
  };
  const parseAssessmentDetails = (txt) => {
    let value = cleanStr(txt);
    if (!value) return { raw: "", items: [] };
    value = value.replace(/(^|\n)\s*(\d+[\.)])\s*\n+\s*(Teknik|Bukti|Cara\s+membaca|Tindak\s+lanjut)\s*:/gi, '$1$2 $3:');

      const end = index + 1 < matches.length ? matches[index + 1].index : value.length;

%;border:1px solid #000;padding:2px 3px;vertical-align:middle;font-size:11pt;text-align:justify;}.t-header-sub{background-color:#e2e8f0;border:1px solid #000;padding:2px 3px;text-align:left;font-weight:bold;font-size:11pt;text-transform:uppercase;}.phase-head{background-color:#ecfdf5;border:1px solid #000;padding:2px 3px;text-align:left;font-weight:bold;font-size:11pt;}.activity-cell{background:#fafafa;}.assessment-label{background:#fff7ed;color:#9a3412;}.assessment-cell{background:#fffdf8;}.assessment-block{margin:0;font-size:11pt;}.assessment-english{margin:0 0 2pt 0;text-align:left;font-size:11pt;color:#475569;}.text-line{margin:0 0 1pt 0;mso-para-margin:0;text-align:justify;line-height:1.05;mso-line-height-rule:at-least;}.cell-title{margin:0 0 1pt 0;mso-para-margin:0;text-align:left;font-weight:bold;line-height:1.05;mso-line-height-rule:at-least;}.num-list,.letter-list,.lower-letter-list,.bullet-list{margin:0 0 0 5pt;padding-left:11pt;text-align:justify;list-style-position:outside;}.num-list li,.letter-list li,.lower-letter-list li,.bullet-list li{margin:0 0 1pt 0;padding-left:1pt;text-align:justify;line-height:1.05;mso-line-height-rule:at-least;}.matching-line{margin:0;text-align:left;line-height:1.05;mso-line-height-rule:at-least;}.matching-marker{font-weight:bold;}.word-row-short{page-break-inside:avoid;mso-pagination:keep-together;}.word-row-narrative{page-break-inside:auto;}.keep-next{page-break-after:avoid;mso-pagination:keep-with-next;}.keep-together{page-break-inside:avoid;mso-pagination:keep-together;}.signature-table{page-break-inside:avoid;mso-pagination:keep-together;}.page-break{page-break-before:always;mso-break-before:page;margin:0;height:0;line-height:1pt;font-size:1pt;}h3,h4{font-size:12pt;}thead{display:table-header-group;}tfoot{display:table-footer-group;}`;

    if (!cleanStr(rppData.praktikPedagogis)) warnings.push("Praktik Pedagogis belum menetapkan model pembelajaran utama beserta alasan pemilihannya.");
    else if (!/(model\s*(utama|pembelajaran)|problem based|project based|discovery learning|inquiry learning|inkuiri|cooperative learning|kooperatif|direct instruction|pembelajaran langsung)/i.test(rppData.praktikPedagogis)) warnings.push("Praktik Pedagogis perlu menyebut satu model pembelajaran utama secara eksplisit; Pembelajaran Mendalam digunakan sebagai pendekatan pendukung.");
    if (!sintaksText) warnings.push("Sintaks model pembelajaran belum diisi di TAHAP 3 & 4.");
    else {
      if (!/(^|\n)\s*Model\s+Utama\s*:/i.test(sintaksText)) warnings.push("Sintaks pembelajaran perlu diawali identitas 'Model Utama: ...'.");
      if (countSintaksSteps(sintaksText) < 3) warnings.push("Sintaks pembelajaran belum memuat keseluruhan urutan model; tulis minimal 3 tahap sesuai sintaks baku model yang dipilih.");
      if (expectedSintaksCount && (uniqueSintaksNumbers.length !== expectedSintaksCount || uniqueSintaksNumbers.some((number, index) => number !== index + 1))) warnings.push(`Urutan sintaks model terdeteksi belum lengkap; model yang dipilih memerlukan Sintaks 1 sampai Sintaks ${expectedSintaksCount} secara berurutan.`);

      if (countMeaningfulLines(mapping) < 3 || !/Fase\s+Awal/i.test(mapping) || !/Fase\s+Inti/i.test(mapping) || !/Fase\s+(Akhir|Penutup)/i.test(mapping)) mappingMissing.push(index + 1);
      const referencedNumbers = extractSintaksNumbers(mapping);
      mappedSintaksNumbers.push(...referencedNumbers);
      if (sintaksNumbers.length && referencedNumbers.some(number => !sintaksNumbers.includes(number))) mappingUnknown.push(index + 1);
      // Sebut kegiatan yang kurang, agar guru tidak mencarinya sendiri.
      const withoutMarker = [["Awal", row.kegiatanAwal], ["Inti", row.kegiatanInti], ["Penutup", row.kegiatanPenutup]].filter(([, value]) => cleanStr(value) && !hasSyntaxMarker(value)).map(([label]) => label);
      if (withoutMarker.length) activitiesWithoutSyntax.push(`Pertemuan ${index + 1} (${withoutMarker.join(", ")})`);
    });
    if (mappingMissing.length) warnings.push(`Pemetaan sintaks fase Awal, Inti, dan Akhir belum lengkap pada pertemuan ${mappingMissing.join(', ')}.`);
    if (mappingUnknown.length) warnings.push(`Pemetaan pertemuan ${mappingUnknown.join(', ')} merujuk nomor sintaks yang tidak ada pada sintaks model lengkap.`);
    const unmappedSintaksNumbers = uniqueSintaksNumbers.filter(number => !mappedSintaksNumbers.includes(number));
    if (unmappedSintaksNumbers.length) warnings.push(`Sintaks ${unmappedSintaksNumbers.join(', ')} belum dipetakan ke pertemuan mana pun.`);
    if (activitiesWithoutSyntax.length) warnings.push(`Penanda bernomor seperti [Sintaks 1 - nama tahap] belum ada pada kegiatan: ${activitiesWithoutSyntax.join('; ')}. Setiap kegiatan awal, inti, dan penutup perlu minimal satu langkah pembelajaran berpenanda (salam, doa, dan presensi tidak perlu).`);
    if (!cleanStr(rppData.situasiNyataSiswa)) warnings.push("Situasi nyata lingkungan siswa belum diisi sebagai konteks PM.");
    if (!cleanStr(rppData.materiEsensial)) warnings.push("Materi esensial/pokok materi belum diisi di TAHAP 2.");
    if (cleanStr(rppData.materiEsensial) && countLines(rppData.materiEsensial) < 5) warnings.push("Ringkasan materi/materi esensial masih terlalu pendek; sebaiknya minimal 5 poin berisi konsep inti, submateri, istilah penting, prinsip/prosedur, contoh/konteks nyata, dan batasan materi.");
    if (cleanStr(rppData.kompetensiAwal) && (countLines(rppData.kompetensiAwal) < 2 || !/(prasyarat|sebelum|telah|mampu|pernah|dasar|awal|memahami|menjelaskan|mengidentifikasi)/i.test(rppData.kompetensiAwal))) warnings.push("Kompetensi awal perlu lebih eksplisit sebagai prasyarat materi.");
    if (cleanStr(rppData.kesiapanSiswa) && !/(kognitif|motivasi|kebiasaan|dukungan|sosial|emosi)/i.test(rppData.kesiapanSiswa)) warnings.push("Kesiapan peserta didik sebaiknya memuat kognitif, motivasi, kebiasaan belajar, dan kebutuhan dukungan.");
    if (cleanStr(rppData.karakteristikMateri) && !/(faktual|konseptual|prosedural|kontekstual|lintas|disiplin)/i.test(rppData.karakteristikMateri)) warnings.push("Karakteristik materi perlu menyebut sifat faktual/konseptual/prosedural/kontekstual/lintas disiplin.");
    if (tp && !measurable.test(tp)) warnings.push("Tujuan Pembelajaran perlu memakai kata kerja operasional yang dapat diukur.");
    if (tp && tpCount < 3) warnings.push("Tujuan Pembelajaran sebaiknya minimal 3 butir yang menurunkan CP.");
    if (cp && tp && !tp.split(/\s+/).some(w => w.length > 6 && cp.includes(w))) warnings.push("TP belum tampak menurunkan CP secara langsung.");
    if (tp && kegiatan && !tp.split(/\s+/).some(w => w.length > 6 && kegiatan.includes(w))) warnings.push("Kegiatan belajar belum cukup menampakkan latihan terhadap TP.");
    if (tp && asesmen && !tp.split(/\s+/).some(w => w.length > 6 && asesmen.includes(w))) warnings.push("Asesmen belum cukup jelas mengukur TP.");

    const filled = isAssessmentFilled;
    [["pengalamanMemahami", "memahami"], ["pengalamanMengaplikasi", "mengaplikasi"], ["pengalamanMerefleksi", "merefleksi"]].forEach(([key, label]) => {
      if (!pertemuanRows.some(row => filled(row[key]))) warnings.push(`Pengalaman ${label} belum muncul di pertemuan mana pun.`);

    ["Mindful", "Meaningful", "Joyful"].forEach(label => {
      if (!pertemuanRows.some(row => new RegExp(`${label}\\s*:\\s*\\S`, "i").test(cleanStr(row.prinsipPM)))) warnings.push(`Prinsip ${label} belum ditunjukkan dengan aktivitas nyata (isian Prinsip Pembelajaran Mendalam).`);
    });
    if (!pertemuanRows.some(row => filled(row.diferensiasi))) warnings.push("Diferensiasi (dukungan/tantangan) belum dirancang di pertemuan mana pun.");
    const menitTarget = (cleanStr(rppData.waktu).match(/\d+/g) || []).map(Number).reduce((a, b) => a * b, 1);
    pertemuanRows.forEach((row, index) => {
      const total = getPertemuanMenit(row);

      else if (menitTarget > 1 && Math.abs(total - menitTarget) > menitTarget * 0.1) warnings.push(`Pertemuan ${index + 1}: total durasi ${total} menit tidak sesuai alokasi ${menitTarget} menit.`);

    const curricularText = cleanStr(`${rppData.cp} ${rppData.tp} ${rppData.materiEsensial} ${rppData.karakteristikMateri} ${rppData.lintasDisiplin} ${kegiatan} ${asesmen}`).toLowerCase();
    if (mapelText.includes("bahasa jawa") && curricularText && !/(jawa|unggah|undha|aksara|sastra|geguritan|tembang|cerkak|wayang|paramasastra|pacelathon|pawarta)/i.test(curricularText)) {
      warnings.push("Bahasa Jawa perlu tampak sebagai bahasa/sastra/aksara/budaya Jawa, bukan bahasa umum.");
    }
    if ((mapelText.includes("koding") || mapelText.includes("kecerdasan artifisial") || /\bkka\b/i.test(rppData.mapel)) && curricularText && !/(komputasional|algoritma|data|digital|kecerdasan artifisial|\bka\b|prompt|deepfake|etika|sensor|pemrograman)/i.test(curricularText)) {
      warnings.push("Koding/KA perlu memuat berpikir komputasional, literasi digital, data, algoritma, etika, atau pemanfaatan KA.");
    }
    return warnings;
  };

  // html-docx-js selalu menulis Letter tanpa header/footer; bagian section diganti A4 + header/footer (Phase 3 W1, Opsi A).
  const finalizeDocx = async (blob, headerText, watermark = "") => {
    const zip = await window.JSZip.loadAsync(blob);
    const read = async (name) => { const file = zip.file(name); if (!file) throw new Error(`Bagian ${name} tidak ditemukan.`); return file.async("string"); };
    const swap = (text, pattern, value, part) => { if (!pattern.test(text)) throw new Error(`Pola ${part} tidak ditemukan; format html-docx-js berubah.`); return text.replace(pattern, value); };
    const xml = (txt) => String(txt).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const run = (txt, props = "") => `<w:r><w:rPr><w:sz w:val="18"/>${props}</w:rPr><w:t xml:space="preserve">${xml(txt)}</w:t></w:r>`;
    const field = (code) => `<w:r><w:fldChar w:fldCharType="begin"/></w:r><w:r><w:rPr><w:sz w:val="18"/></w:rPr><w:instrText xml:space="preserve"> ${code} </w:instrText></w:r><w:r><w:fldChar w:fldCharType="separate"/></w:r><w:r><w:rPr><w:sz w:val="18"/></w:rPr><w:t>1</w:t></w:r><w:r><w:fldChar w:fldCharType="end"/></w:r>`;
    const para = (runs) => `<w:p><w:pPr><w:jc w:val="center"/></w:pPr>${runs}</w:p>`;
    const ns = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
    let doc = await read("word/document.xml");
    doc = swap(doc, /<w:pgSz[^>]*\/>/, '<w:headerReference w:type="default" r:id="rIdAgpmHeader"/><w:footerReference w:type="default" r:id="rIdAgpmFooter"/><w:pgSz w:w="11906" w:h="16838" w:orient="portrait"/>', "ukuran halaman");
    doc = swap(doc, /<w:pgMar[^>]*\/>/, '<w:pgMar w:top="1417" w:right="1134" w:bottom="1417" w:left="1134" w:header="709" w:footer="709" w:gutter="0"/>', "margin");
    const rels = swap(await read("word/_rels/document.xml.rels"), /<\/Relationships>/, '<Relationship Id="rIdAgpmHeader" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header1.xml"/><Relationship Id="rIdAgpmFooter" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/></Relationships>', "relasi");
    const types = swap(await read("[Content_Types].xml"), /<\/Types>/, '<Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>', "content types");
    zip.file("word/document.xml", doc);
    zip.file("word/_rels/document.xml.rels", rels);
    zip.file("[Content_Types].xml", types);
    zip.file("word/header1.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:hdr ${ns}>${watermark ? para(run(watermark, '<w:b/><w:color w:val="B91C1C"/>')) : ''}${para(run(headerText))}</w:hdr>`);
    zip.file("word/footer1.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr ${ns}>${para(run("Hal. ") + field("PAGE") + run(" dari ") + field("NUMPAGES"))}</w:ftr>`);
    return zip.generateAsync({ type: "blob", mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
  };
  const getDocHeaderText = (label) => [cleanStr(rppData.namaSekolah), cleanStr(rppData.mapel), cleanStr(rppData.kelas), label].filter(Boolean).join(" | ");
  const downloadDocx = async (html, label, fileName, watermark = "") => {
    if (!window.htmlDocx || !window.JSZip) {
      notify("DOCX Belum Siap", "Library pembuat DOCX belum dimuat. Pastikan koneksi internet aktif, tunggu beberapa detik, lalu coba lagi.", "warning");
      return;
    }
    try {
      const blob = await finalizeDocx(window.htmlDocx.asBlob(html, { orientation: 'portrait' }), getDocHeaderText(label), watermark);
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 30000);
    } catch (error) {
      notify("DOCX Gagal Disusun", `Dokumen tidak dapat disusun dalam format A4.\n\nDetail: ${error.message}`, "warning");
    }
  };
  const handleDownloadWord = () => {
    runWithAssessmentCheck(() => downloadDocx(generateWordContent(), "Modul Ajar dan Lampiran", `${getCustomFileName('RPP_DeepLearning')}.docx`));
  };
  // Gerbang dokumen siswa: tanpa tanda DRAF hanya bila disetujui guru di aplikasi; butir FAIL tidak pernah dicetak.
  const handleDownloadStudent = (kind) => {
    const isSoal = kind === "soal";
    if (isSoal ? !(rppData.bankSoal || []).length : !(rppData.lkpd || []).length) {
      notify(isSoal ? "Belum Ada Soal" : "Belum Ada LKPD", `${isSoal ? "Lampiran Soal" : "LKPD"} masih kosong.`, "warning");
      return;
    }
    const items = isSoal ? getStudentSoalItems() : [];
    const failed = items.filter(item => item.fail).map(item => item.nomor);
    const approved = isSoal ? getAssessmentQuality(rppData).pkg === "APPROVED" : getGeneratorStatus().lkpd.status === "disetujui";
    const go = (watermark) => downloadDocx(isSoal ? generateStudentSoalContent(items.filter(item => !item.fail)) : generateStudentLkpdContent(), isSoal ? "Naskah Soal Siswa" : "LKPD Siswa", `${getCustomFileName(isSoal ? 'Soal_Siswa' : 'LKPD_Siswa')}.docx`, watermark);
    if (approved) { go(""); return; }

    confirmPopup("Unduh sebagai DRAF?", `${isSoal ? "Lampiran Soal" : "LKPD"} belum disetujui guru di aplikasi. Dokumen siswa dapat diunduh sebagai DRAF dengan tanda "DRAF — BELUM DISETUJUI GURU" di setiap halaman.${skipped}\n\nLanjutkan?`, () => go(`DRAF — BELUM DISETUJUI GURU.${skipped}`));
  };

  const handleDownloadExcel = () => {
    runWithAssessmentCheck(async () => {
      const rubrikRowsForExcel = rppData.kisiKisi.length ? mapRubrikByKisi(rppData.rubrikPenilaian, rppData.kisiKisi) : rppData.rubrikPenilaian;
      const sheets = [
        {
          name: "Kisi-kisi Soal",
          minWidths: [5, 26, 46, 8, 14, 8],
          maxWidths: [6, 38, 68, 10, 16, 10],
          rows: rppData.kisiKisi.map((k, i) => ({ "No": i + 1, "Materi Pokok": k.materi, "Indikator Soal": k.indikator, "Level Kognitif": k.level, "Bentuk Soal": k.bentuk, "Nomor Soal": k.nomor }))

        },
        {
          // Subtotal dan total memakai rumus Excel; nilai "result" sama dengan getPedomanSkor (Phase 3 W4).
          name: "Pedoman Skor",
          minWidths: [30, 14, 16, 14],
          maxWidths: [60, 20, 18, 16],
          rows: (() => {
            const ped = getPedomanSkor(rppData);
            if (!ped.rows.length) return [];
            const last = ped.rows.length + 1;
            const blank = { "Jumlah Butir": "", "Skor Maks/Butir": "", "Subtotal": "" };
            return [
              ...ped.rows.map((r, i) => ({ "Bentuk Soal": r.bentuk, "Jumlah Butir": r.jumlah, "Skor Maks/Butir": r.maks, "Subtotal": { formula: `B${i + 2}*C${i + 2}`, result: r.subtotal } })),
              { "Bentuk Soal": "Total skor maksimum", "Jumlah Butir": { formula: `SUM(B2:B${last})`, result: ped.rows.reduce((sum, r) => sum + r.jumlah, 0) }, "Skor Maks/Butir": "", "Subtotal": { formula: `SUM(D2:D${last})`, result: ped.total } },
              { "Bentuk Soal": `Nilai = (skor perolehan ÷ ${ped.total}) × 100`, ...blank },
              { "Bentuk Soal": "KKTP (ditetapkan satuan pendidikan)", ...blank, "Jumlah Butir": cleanStr(rppData.kktp) || "belum ditetapkan" }
            ];
          })()
        }
      ];
      const formulaResult = (value) => value && typeof value === "object" ? value.result : value;

      const getHeaders = (rows) => Object.keys(rows[0] || { "Informasi": "Tidak ada data" });
      const safeRows = (rows, name) => rows.length ? rows : [{ "Informasi": `Tidak ada data ${name}` }];
      const autoFitColumnWidth = (header, rows, minWidth = 8, maxWidth = 72) => {
        const maxLine = Math.max(header.length, ...rows.map(row => String(row[header] || '').split(/\r?\n/).reduce((m, line) => Math.max(m, line.length), 0)));
        return Math.min(maxWidth, Math.max(minWidth, Math.ceil(maxLine * 1.02) + 2));
      };
      const autoFitRowHeight = (row, headers, widths) => {
        const estimatedLines = headers.map((header, idx) => {
          const width = Math.max(12, widths[idx] || 30);
          return String(row[header] || '').split(/\r?\n/).reduce((total, line) => total + Math.max(1, Math.ceil(line.length / Math.max(14, width * 1.05))), 0);
        });
        const lineCount = Math.max(1, ...estimatedLines);
        return Math.min(150, Math.max(24, 18 + (lineCount - 1) * 14));
      };
      const getExcelAlignment = (sheetName, colNumber, rowNumber) => {
        if (rowNumber === 1) return { wrapText: true, vertical: "middle", horizontal: "center" };

        }
        if (sheetName === "Bank Soal") {
          if (colNumber === 1) return { wrapText: true, vertical: "top", horizontal: "center" };
          if (colNumber === 4) return { wrapText: true, vertical: "center", horizontal: "center" };
          return { wrapText: true, vertical: "top", horizontal: "justify" };
        }
        if (sheetName === "Rubrik Penilaian") {
          if (colNumber === 1 || colNumber === 2) return { wrapText: true, vertical: "center", horizontal: "center" };
          if (colNumber === 3) return { wrapText: true, vertical: "top", horizontal: "left" };
          return { wrapText: true, vertical: "top", horizontal: "justify" };
        }
        return { wrapText: true, vertical: "top" };
      };
      const saveBlob = (blob, filename) => {

      if (window.ExcelJS) {

            });

      sheets.forEach(sheet => {
        const rows = safeRows(sheet.rows, sheet.name).map(row => Object.fromEntries(Object.entries(row).map(([key, value]) => [key, formulaResult(value)])));

        const headers = getHeaders(rows);
        const widths = headers.map((header, idx) => autoFitColumnWidth(header, rows, sheet.minWidths[idx] || 8, sheet.maxWidths?.[idx] || 72));
        ws['!cols'] = widths.map(width => ({ wch: width }));
        ws['!rows'] = [{ hpt: 24 }, ...rows.map(row => ({ hpt: autoFitRowHeight(row, headers, widths) }))];
        ws['!autofilter'] = { ref: ws['!ref'] };

        <div className="fixed inset-0 bg-slate-900/70 z-[990] flex items-center justify-center p-4 backdrop-blur-sm">
          <div className="bg-white rounded-2xl shadow-2xl max-w-lg w-full overflow-hidden animate-in zoom-in-95 duration-200">
            <div className="bg-gradient-to-r from-blue-600 to-indigo-700 p-4 sm:p-5 text-white flex justify-between items-center">
              <h3 className="font-bold text-lg"><i className="fas fa-key mr-2 text-yellow-300"></i> Konfigurasi API Gemini</h3>
              <button onClick={() => { setApiKeyFeedback(null); setShowApiModal(false); }} className="text-blue-100 hover:text-white"><i className="fas fa-times text-xl"></i></button>
            </div>
            <div className="p-5 sm:p-6 text-sm text-slate-700">
              <div className="bg-blue-50 border border-blue-200 p-3 rounded-lg mb-4 text-xs sm:text-sm leading-relaxed">
                <p>Aplikasi menerima <strong>Gemini API Key standar, authorization key baru, key lama, dan key dari Canvas</strong>. Model yang tersedia akan dideteksi otomatis dari key pengguna.</p>
                <ol className="list-decimal ml-5 mt-2 space-y-1 font-medium">
                  <li>Buka <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noreferrer" className="text-blue-600 underline hover:text-blue-800">Google AI Studio</a>.</li>
                  <li>Terima persyaratan penggunaan bila diminta, lalu klik <strong>"Create API key"</strong>.</li>
                  <li>Salin <strong>nilai API key</strong>, tempel di bawah, kemudian klik <strong>Uji Koneksi</strong>.</li>
                </ol>
              </div>
              <label className="block font-bold text-slate-800 mb-2">Gemini API Key Anda:</label>
              <input type="password" value={tempApiKey} onChange={(e) => { setTempApiKey(e.target.value); setApiKeyFeedback(null); }} placeholder="Tempel API Key Gemini di sini" autoComplete="off" spellCheck="false" className="w-full p-3 border-2 border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-mono tracking-widest text-slate-800 mb-1"/>
              <div className="flex flex-wrap items-center justify-between gap-2 text-[10px] text-slate-500 mb-3">
                <span><i className="fas fa-shield-alt mr-1"></i>Key disimpan di <i>localStorage</i> dan dikirim lewat header API.</span>
                <span className="font-bold text-indigo-700">Model otomatis: {geminiModel || GEMINI_DEFAULT_MODEL}</span>
              </div>

              {apiKeyFeedback ? (
                <div className={`p-3 rounded-lg border mb-4 text-xs leading-relaxed ${
                  apiKeyFeedback.type === "success" ? "bg-emerald-50 border-emerald-200 text-emerald-800" :
                  apiKeyFeedback.type === "error" ? "bg-red-50 border-red-200 text-red-800" :
                  "bg-blue-50 border-blue-200 text-blue-800"
                }`}>
                  <i className={`fas ${
                    apiKeyFeedback.type === "success" ? "fa-circle-check" :
                    apiKeyFeedback.type === "error" ? "fa-circle-exclamation" :
                    "fa-spinner fa-spin"
                  } mr-2`}></i>
                  {apiKeyFeedback.message}
                </div>
              ) : null}
               
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <button onClick={() => { setApiKeyFeedback(null); setShowApiModal(false); }} disabled={isTestingApiKey} className="py-3 bg-slate-100 font-bold rounded-xl hover:bg-slate-200 disabled:opacity-50">Batal</button>
                <button onClick={testGeminiApiKey} disabled={isTestingApiKey} className="py-3 bg-amber-500 text-slate-950 font-bold rounded-xl hover:bg-amber-400 disabled:opacity-60">
                  <i className={`fas ${isTestingApiKey ? "fa-spinner fa-spin" : "fa-plug-circle-check"} mr-2`}></i>{isTestingApiKey ? "Menguji..." : "Uji Koneksi"}
                </button>
                <button onClick={saveApiKey} disabled={isTestingApiKey} className="py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-600/30 disabled:opacity-60">Simpan API Key</button>
              </div>
              <p className="text-[10px] text-slate-500 mt-3 text-center">Uji koneksi membaca daftar model milik key dan memakai satu permintaan sangat kecil, tanpa menjalankan generate RPP.</p>
            </div>
          </div>
        </div>
      ) : null}

      <footer className="w-full max-w-[98%] xl:max-w-[1400px] mx-auto px-4 mt-8 sm:mt-12 pb-6 text-center text-slate-500 text-xs sm:text-sm">
        <div className="border-t border-slate-300 pt-6">
           <p className="font-bold text-slate-600 text-sm sm:text-base mb-1">Dikembangkan oleh: YUSUF ARIS SYAMSUDDIN</p>
           <p className="font-medium">Guru IPA & Informatika - SMPN 2 Secang</p>
        </div>
      </footer>
    </div>
  );
}

class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Aplikasi gagal render:", error, info);
  }
  render() {
    if (this.state.error) {
      const message = this.state.error?.message || String(this.state.error);
      return (
        <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
          <div className="bg-white max-w-2xl w-full rounded-2xl border border-red-200 shadow-xl overflow-hidden">
            <div className="bg-red-600 text-white p-5">
              <h1 className="font-black text-xl">Aplikasi gagal dimuat</h1>
              <p className="text-sm text-red-100 mt-1">Data lama atau error render membuat tampilan berhenti.</p>
            </div>
            <div className="p-5 text-sm text-slate-700">
              <p className="leading-relaxed mb-3">Coba muat ulang halaman. Jika tetap terjadi, simpan pesan error ini agar bisa diperiksa.</p>
              <pre className="whitespace-pre-wrap bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs overflow-auto">{message}</pre>
            </div>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
</script>
</body>
</html>
