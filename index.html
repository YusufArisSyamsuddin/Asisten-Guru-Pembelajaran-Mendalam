  const getCustomFileName = (prefix) => {
    return `${prefix}_${(rppData.topik||'Topik').trim()}_${(rppData.mapel||'Mapel').trim()}_${(rppData.kelas||'Kelas').trim()}_${(rppData.namaGuru||'Guru').trim().split(',')[0]}`.replace(new RegExp('[\\\\/:*?"<>|]', 'g'), '_');
  };

  const runWithAssessmentCheck = (action) => {
    const warnings = [];
    if (!cleanStr(rppData.mapel)) warnings.push("Mata Pelajaran belum diisi.");
    if (!cleanStr(rppData.kelas)) warnings.push("Fase/Kelas belum diisi.");
    if (!cleanStr(rppData.topik)) warnings.push("Topik Pembelajaran belum diisi.");
    if (!cleanStr(rppData.sintaksPembelajaran)) warnings.push("Sintaks model pembelajaran belum diisi.");
    if (syncPertemuanPembelajaran(rppData).some(row => !cleanStr(row.pemetaanSintaks))) warnings.push("Pemetaan sintaks pada satu atau beberapa pertemuan belum diisi.");
    if (rppData.kisiKisi.length === 0 && rppData.bankSoal.length === 0 && rppData.rubrikPenilaian.length === 0) warnings.push("Lampiran soal masih kosong.");
    if (!warnings.length) {
      action();
      return;
    }
    confirmPopup(
      "Data Utama Belum Lengkap",
      `Beberapa data utama belum lengkap:\n\n- ${warnings.join('\n- ')}\n\nTetap lanjut unduh dokumen?`,
      action
    );
  };

  const getActivityConsequenceWarnings = () => {
    const warnings = [];
    const designText = syncPertemuanPembelajaran(rppData).map(row => pertemuanFieldKeys.map(key => row[key]).join(' ')).join(' ').toLowerCase();
    Object.keys(rppData.profilLulusan || {}).filter(k => rppData.profilLulusan[k]).forEach(k => {
      const label = profilLabels[k].toLowerCase().split(/\s+/).find(w => w.length > 6);
      if (label && !designText.includes(label)) warnings.push(`Profil ${profilLabels[k]} belum tampak jelas pada kegiatan/asesmen.`);
    });
    Object.keys(rppData.kseLulusan || {}).filter(k => rppData.kseLulusan[k]).forEach(k => {
      const label = kseLabels[k].toLowerCase().split(/\s+/).find(w => w.length > 6);
      if (label && !designText.includes(label)) warnings.push(`KSE ${kseLabels[k]} belum tampak jelas pada kegiatan/refleksi.`);
    });
    if (Object.values(rppData.profilLulusan || {}).some(Boolean) && !cleanStr(rppData.profilAlasan)) warnings.push("Alasan dan konsekuensi profil lulusan belum diisi.");
    if (Object.values(rppData.kseLulusan || {}).some(Boolean) && !cleanStr(rppData.kseAlasan)) warnings.push("Alasan dan konsekuensi KSE belum diisi.");
    return warnings;
  };

  const getAssessmentFunctionWarnings = (pertemuanRows) => {
    const warnings = [];
    const requiredLabels = assessmentDetailLabels;
    const specifications = Object.values(assessmentFunctionSpecs);
    pertemuanRows.forEach((row, index) => {
      specifications.forEach(spec => {
        const value = cleanStr(row[spec.field]);
        if (!value) {
          warnings.push(`Pertemuan ${index + 1}: ${spec.name} belum diisi.`);
          return;
        }
        const parsed = parseAssessmentDetails(value);
        const labels = parsed.items.map(item => item.label);
        if (!requiredLabels.every(label => labels.includes(label))) warnings.push(`Pertemuan ${index + 1}: ${spec.name} perlu memuat Teknik, Bukti, Cara membaca, dan Tindak lanjut secara lengkap.`);
        const assessmentParts = parseAssessmentPartsForRepair(value);
        const missingFunctionDetails = [];
        if (!spec.purposePattern.test(assessmentParts["Cara membaca"] || "")) missingFunctionDetails.push(spec.purposeHint);
        if (!spec.actionPattern.test(assessmentParts["Tindak lanjut"] || "")) missingFunctionDetails.push(spec.actionHint);
        if (missingFunctionDetails.length) warnings.push(`Pertemuan ${index + 1}: fungsi ${spec.name} belum tegas. ${missingFunctionDetails.join(" ")}`);
      });
    });
    return warnings;
  };

  const getPmCoherenceWarnings = () => {
    const warnings = [];
    const tp = cleanStr(rppData.tp).toLowerCase();
    const cp = cleanStr(rppData.cp).toLowerCase();
    const pertemuanRows = syncPertemuanPembelajaran(rppData);
    const kegiatan = cleanStr(pertemuanRows.map(row => `${row.kegiatanAwal} ${row.kegiatanInti} ${row.kegiatanPenutup}`).join(' ')).toLowerCase();
    const asesmen = cleanStr(pertemuanRows.map(row => `${row.asesmenAwal} ${row.asesmenProses} ${row.asesmenAkhir}`).join(' ')).toLowerCase();
    const measurable = /(menganalisis|mengevaluasi|merancang|menyusun|menjelaskan|membandingkan|mengidentifikasi|menyimpulkan|membuktikan|menerapkan|menyajikan)/i;
    const countLines = (value) => cleanStr(value).split(/\n+/).filter(line => line.replace(/^[-\d\.\)\s]+/, '').trim().length > 18).length;
    const tpCount = countLines(rppData.tp);
    const sintaksText = normalizeSintaksText(rppData.sintaksPembelajaran);
    const sintaksNumbers = extractSintaksNumbers(sintaksText);
    const uniqueSintaksNumbers = [...new Set(sintaksNumbers)];
    const expectedSintaksCount = getExpectedSintaksCount(`${rppData.praktikPedagogis} ${sintaksText}`);
    if (!cleanStr(rppData.praktikPedagogis)) warnings.push("Praktik Pedagogis belum menetapkan model pembelajaran utama beserta alasan pemilihannya.");
    else if (!/(model\s*(utama|pembelajaran)|problem based|project based|discovery learning|inquiry learning|inkuiri|cooperative learning|kooperatif|direct instruction|pembelajaran langsung)/i.test(rppData.praktikPedagogis)) warnings.push("Praktik Pedagogis perlu menyebut satu model pembelajaran utama secara eksplisit; Pembelajaran Mendalam digunakan sebagai pendekatan pendukung.");
    if (!sintaksText) warnings.push("Sintaks model pembelajaran belum diisi di TAHAP 3 & 4.");
    else {
      if (!/(^|\n)\s*Model\s+Utama\s*:/i.test(sintaksText)) warnings.push("Sintaks pembelajaran perlu diawali identitas 'Model Utama: ...'.");
      if (countSintaksSteps(sintaksText) < 3) warnings.push("Sintaks pembelajaran belum memuat keseluruhan urutan model; tulis minimal 3 tahap sesuai sintaks baku model yang dipilih.");
      if (expectedSintaksCount && (uniqueSintaksNumbers.length !== expectedSintaksCount || uniqueSintaksNumbers.some((number, index) => number !== index + 1))) warnings.push(`Urutan sintaks model terdeteksi belum lengkap; model yang dipilih memerlukan Sintaks 1 sampai Sintaks ${expectedSintaksCount} secara berurutan.`);
    }
    const mappingMissing = [];
    const mappingUnknown = [];
    const activitiesWithoutSyntax = [];
    const mappedSintaksNumbers = [];
    pertemuanRows.forEach((row, index) => {
      const mapping = normalizePemetaanSintaksText(row.pemetaanSintaks);
      if (countMeaningfulLines(mapping) < 3 || !/Fase\s+Awal/i.test(mapping) || !/Fase\s+Inti/i.test(mapping) || !/Fase\s+(Akhir|Penutup)/i.test(mapping)) mappingMissing.push(index + 1);
      const referencedNumbers = extractSintaksNumbers(mapping);
      mappedSintaksNumbers.push(...referencedNumbers);
      if (sintaksNumbers.length && referencedNumbers.some(number => !sintaksNumbers.includes(number))) mappingUnknown.push(index + 1);
      const activityFields = [row.kegiatanAwal, row.kegiatanInti, row.kegiatanPenutup].map(cleanStr).filter(Boolean);
      if (activityFields.length && activityFields.some(value => !hasSyntaxMarker(value))) activitiesWithoutSyntax.push(index + 1);
    });
    if (mappingMissing.length) warnings.push(`Pemetaan sintaks fase Awal, Inti, dan Akhir belum lengkap pada pertemuan ${mappingMissing.join(', ')}.`);
    if (mappingUnknown.length) warnings.push(`Pemetaan pertemuan ${mappingUnknown.join(', ')} merujuk nomor sintaks yang tidak ada pada sintaks model lengkap.`);
    const unmappedSintaksNumbers = uniqueSintaksNumbers.filter(number => !mappedSintaksNumbers.includes(number));
    if (unmappedSintaksNumbers.length) warnings.push(`Sintaks ${unmappedSintaksNumbers.join(', ')} belum dipetakan ke pertemuan mana pun.`);
    if (activitiesWithoutSyntax.length) warnings.push(`Aktivitas awal, inti, atau penutup belum mencantumkan penanda bernomor seperti [Sintaks 1 - nama tahap] pada pertemuan ${activitiesWithoutSyntax.join(', ')}.`);
    if (!cleanStr(rppData.situasiNyataSiswa)) warnings.push("Situasi nyata lingkungan siswa belum diisi sebagai konteks PM.");
    if (!cleanStr(rppData.materiEsensial)) warnings.push("Materi esensial/pokok materi belum diisi di TAHAP 2.");
    if (cleanStr(rppData.materiEsensial) && countLines(rppData.materiEsensial) < 5) warnings.push("Ringkasan materi/materi esensial masih terlalu pendek; sebaiknya minimal 5 poin berisi konsep inti, submateri, istilah penting, prinsip/prosedur, contoh/konteks nyata, dan batasan materi.");
    if (cleanStr(rppData.kompetensiAwal) && (countLines(rppData.kompetensiAwal) < 2 || !/(prasyarat|sebelum|telah|mampu|pernah|dasar|awal|memahami|menjelaskan|mengidentifikasi)/i.test(rppData.kompetensiAwal))) warnings.push("Kompetensi awal perlu lebih eksplisit sebagai prasyarat materi.");
    if (cleanStr(rppData.kesiapanSiswa) && !/(kognitif|motivasi|kebiasaan|dukungan|sosial|emosi)/i.test(rppData.kesiapanSiswa)) warnings.push("Kesiapan peserta didik sebaiknya memuat kognitif, motivasi, kebiasaan belajar, dan kebutuhan dukungan.");
    if (cleanStr(rppData.karakteristikMateri) && !/(faktual|konseptual|prosedural|kontekstual|lintas|disiplin)/i.test(rppData.karakteristikMateri)) warnings.push("Karakteristik materi perlu menyebut sifat faktual/konseptual/prosedural/kontekstual/lintas disiplin.");
    if (tp && !measurable.test(tp)) warnings.push("Tujuan Pembelajaran perlu memakai kata kerja operasional yang dapat diukur.");
    if (tp && tpCount < 3) warnings.push("Tujuan Pembelajaran sebaiknya minimal 3 butir yang menurunkan CP.");
    if (cp && tp && !tp.split(/\s+/).some(w => w.length > 6 && cp.includes(w))) warnings.push("TP belum tampak menurunkan CP secara langsung.");
    if (tp && kegiatan && !tp.split(/\s+/).some(w => w.length > 6 && kegiatan.includes(w))) warnings.push("Kegiatan belajar belum cukup menampakkan latihan terhadap TP.");
    if (tp && asesmen && !tp.split(/\s+/).some(w => w.length > 6 && asesmen.includes(w))) warnings.push("Asesmen belum cukup jelas mengukur TP.");
    if (pertemuanRows.some(row => countLines(row.pengalamanMemahami) < 2 || countLines(row.pengalamanMengaplikasi) < 2 || countLines(row.pengalamanMerefleksi) < 2)) warnings.push("Pengalaman belajar di setiap pertemuan perlu lebih eksplisit memuat memahami, mengaplikasi, dan merefleksi.");
    warnings.push(...getAssessmentFunctionWarnings(pertemuanRows));
    const mapelText = cleanStr(rppData.mapel).toLowerCase();
    const curricularText = cleanStr(`${rppData.cp} ${rppData.tp} ${rppData.materiEsensial} ${rppData.karakteristikMateri} ${rppData.lintasDisiplin} ${kegiatan} ${asesmen}`).toLowerCase();
    if (mapelText.includes("bahasa jawa") && curricularText && !/(jawa|unggah|undha|aksara|sastra|geguritan|tembang|cerkak|wayang|paramasastra|pacelathon|pawarta)/i.test(curricularText)) {
      warnings.push("Bahasa Jawa perlu tampak sebagai bahasa/sastra/aksara/budaya Jawa, bukan bahasa umum.");
    }
    if ((mapelText.includes("koding") || mapelText.includes("kecerdasan artifisial") || /\bkka\b/i.test(rppData.mapel)) && curricularText && !/(komputasional|algoritma|data|digital|kecerdasan artifisial|\bka\b|prompt|deepfake|etika|sensor|pemrograman)/i.test(curricularText)) {
      warnings.push("Koding/KA perlu memuat berpikir komputasional, literasi digital, data, algoritma, etika, atau pemanfaatan KA.");
    }
    return warnings;
  };

  const handleDownloadWord = () => {
    runWithAssessmentCheck(() => {
      if (!window.htmlDocx) {
        notify("DOCX Belum Siap", "Library pembuat DOCX belum dimuat. Pastikan koneksi internet aktif, tunggu beberapa detik, lalu coba lagi.", "warning");
        return;
      }
      const blob = window.htmlDocx.asBlob(generateWordContent(), { orientation: 'portrait', margins: { top: 600, right: 600, bottom: 600, left: 600 } });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = `${getCustomFileName('RPP_DeepLearning')}.docx`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 30000);
    });
  };

  const handleDownloadExcel = () => {
    runWithAssessmentCheck(async () => {
      const rubrikRowsForExcel = rppData.kisiKisi.length ? mapRubrikByKisi(rppData.rubrikPenilaian, rppData.kisiKisi) : rppData.rubrikPenilaian;
      const sheets = [
        {
          name: "Kisi-kisi Soal",
          minWidths: [5, 26, 46, 8, 14, 8],
          maxWidths: [6, 38, 68, 10, 16, 10],
          rows: rppData.kisiKisi.map((k, i) => ({ "No": i + 1, "Materi Pokok": k.materi, "Indikator Soal": k.indikator, "Level Kognitif": k.level, "Bentuk Soal": k.bentuk, "Nomor Soal": k.nomor }))
        },
        {
          name: "Bank Soal",
          minWidths: [5, 46, 42, 12],
          maxWidths: [6, 74, 62, 16],
          rows: rppData.bankSoal.map((b, i) => {
            const row = getBankRowForDisplay(b, i);
            const form = rppData.kisiKisi[i]?.bentuk;
            return { "No": i + 1, "Butir Soal & Stimulus": row.soal, "Pilihan Jawaban / Pedoman Jawab": row.opsi || "-", "Kunci Jawaban": formatKeyForExport(row.kunci, form) || "-" };
          })
        },
        {
          name: "Rubrik Penilaian",
          minWidths: [5, 18, 24, 52],
          maxWidths: [6, 24, 34, 76],
          rows: rubrikRowsForExcel.map((r, i) => ({ "No": i + 1, "Bentuk Penilaian": r.bentukPenilaian, "Rentang Nilai": getRubrikMaxScore(r), "Deskripsi Indikator Penilaian": getRubrikDescriptionForExport(r) }))
        }
      ];

      const getHeaders = (rows) => Object.keys(rows[0] || { "Informasi": "Tidak ada data" });
      const safeRows = (rows, name) => rows.length ? rows : [{ "Informasi": `Tidak ada data ${name}` }];
      const autoFitColumnWidth = (header, rows, minWidth = 8, maxWidth = 72) => {
        const maxLine = Math.max(header.length, ...rows.map(row => String(row[header] || '').split(/\r?\n/).reduce((m, line) => Math.max(m, line.length), 0)));
        return Math.min(maxWidth, Math.max(minWidth, Math.ceil(maxLine * 1.02) + 2));
      };
      const autoFitRowHeight = (row, headers, widths) => {
        const estimatedLines = headers.map((header, idx) => {
          const width = Math.max(12, widths[idx] || 30);
          return String(row[header] || '').split(/\r?\n/).reduce((total, line) => total + Math.max(1, Math.ceil(line.length / Math.max(14, width * 1.05))), 0);
        });
        const lineCount = Math.max(1, ...estimatedLines);
        return Math.min(150, Math.max(24, 18 + (lineCount - 1) * 14));
      };
      const getExcelAlignment = (sheetName, colNumber, rowNumber) => {
        if (rowNumber === 1) return { wrapText: true, vertical: "middle", horizontal: "center" };
        if (sheetName === "Kisi-kisi Soal") {
          if ([1, 4, 5, 6].includes(colNumber)) return { wrapText: true, vertical: "center", horizontal: "center" };
          if (colNumber === 3) return { wrapText: true, vertical: "top", horizontal: "justify" };
          return { wrapText: true, vertical: "center", horizontal: "left" };
        }
        if (sheetName === "Bank Soal") {
          if (colNumber === 1) return { wrapText: true, vertical: "top", horizontal: "center" };
          if (colNumber === 4) return { wrapText: true, vertical: "center", horizontal: "center" };
          return { wrapText: true, vertical: "top", horizontal: "justify" };
        }
        if (sheetName === "Rubrik Penilaian") {
          if (colNumber === 1 || colNumber === 2) return { wrapText: true, vertical: "center", horizontal: "center" };
          if (colNumber === 3) return { wrapText: true, vertical: "top", horizontal: "left" };
          return { wrapText: true, vertical: "top", horizontal: "justify" };
        }
        return { wrapText: true, vertical: "top" };
      };

        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

            ws.addRow(headers);
            rows.forEach(row => ws.addRow(headers.map(h => row[h] ?? "")));

            const widths = headers.map((header, idx) => autoFitColumnWidth(header, rows, sheet.minWidths[idx] || 8, sheet.maxWidths?.[idx] || 72));
            headers.forEach((header, idx) => {

            });

        ws['!autofilter'] = { ref: ws['!ref'] };
        XLSX.utils.book_append_sheet(wb, ws, sheet.name);

                  <li>Terima persyaratan penggunaan bila diminta, lalu klik <strong>"Create API key"</strong>.</li>
                  <li>Salin <strong>nilai API key</strong>, tempel di bawah, kemudian klik <strong>Uji Koneksi</strong>.</li>
                </ol>
              </div>
              <label className="block font-bold text-slate-800 mb-2">Gemini API Key Anda:</label>
              <input type="password" value={tempApiKey} onChange={(e) => { setTempApiKey(e.target.value); setApiKeyFeedback(null); }} placeholder="Tempel API Key Gemini di sini" autoComplete="off" spellCheck="false" className="w-full p-3 border-2 border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none font-mono tracking-widest text-slate-800 mb-1"/>
              <div className="flex flex-wrap items-center justify-between gap-2 text-[10px] text-slate-500 mb-3">
                <span><i className="fas fa-shield-alt mr-1"></i>Key disimpan di <i>localStorage</i> dan dikirim lewat header API.</span>
                <span className="font-bold text-indigo-700">Model otomatis: {geminiModel || GEMINI_DEFAULT_MODEL}</span>
              </div>

              {apiKeyFeedback ? (
                <div className={`p-3 rounded-lg border mb-4 text-xs leading-relaxed ${
                  apiKeyFeedback.type === "success" ? "bg-emerald-50 border-emerald-200 text-emerald-800" :
                  apiKeyFeedback.type === "error" ? "bg-red-50 border-red-200 text-red-800" :
                  "bg-blue-50 border-blue-200 text-blue-800"
                }`}>
                  <i className={`fas ${
                    apiKeyFeedback.type === "success" ? "fa-circle-check" :
                    apiKeyFeedback.type === "error" ? "fa-circle-exclamation" :
                    "fa-spinner fa-spin"
                  } mr-2`}></i>
                  {apiKeyFeedback.message}
                </div>
              ) : null}
               
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                <button onClick={() => { setApiKeyFeedback(null); setShowApiModal(false); }} disabled={isTestingApiKey} className="py-3 bg-slate-100 font-bold rounded-xl hover:bg-slate-200 disabled:opacity-50">Batal</button>
                <button onClick={testGeminiApiKey} disabled={isTestingApiKey} className="py-3 bg-amber-500 text-slate-950 font-bold rounded-xl hover:bg-amber-400 disabled:opacity-60">
                  <i className={`fas ${isTestingApiKey ? "fa-spinner fa-spin" : "fa-plug-circle-check"} mr-2`}></i>{isTestingApiKey ? "Menguji..." : "Uji Koneksi"}
                </button>
                <button onClick={saveApiKey} disabled={isTestingApiKey} className="py-3 bg-blue-600 text-white font-bold rounded-xl hover:bg-blue-700 shadow-lg shadow-blue-600/30 disabled:opacity-60">Simpan API Key</button>
              </div>
              <p className="text-[10px] text-slate-500 mt-3 text-center">Uji koneksi membaca daftar model milik key dan memakai satu permintaan sangat kecil, tanpa menjalankan generate RPP.</p>
            </div>
          </div>
        </div>
      ) : null}

      <footer className="w-full max-w-[98%] xl:max-w-[1400px] mx-auto px-4 mt-8 sm:mt-12 pb-6 text-center text-slate-500 text-xs sm:text-sm">
        <div className="border-t border-slate-300 pt-6">
           <p className="font-bold text-slate-600 text-sm sm:text-base mb-1">Dikembangkan oleh: YUSUF ARIS SYAMSUDDIN</p>
           <p className="font-medium">NIP: 19950430 202321 1 004 | Guru IPA & Informatika - SMPN 2 Secang</p>
        </div>
      </footer>
    </div>
  );
}

class AppErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Aplikasi gagal render:", error, info);
  }
  render() {
    if (this.state.error) {
      const message = this.state.error?.message || String(this.state.error);
      return (
        <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4">
          <div className="bg-white max-w-2xl w-full rounded-2xl border border-red-200 shadow-xl overflow-hidden">
            <div className="bg-red-600 text-white p-5">
              <h1 className="font-black text-xl">Aplikasi gagal dimuat</h1>
              <p className="text-sm text-red-100 mt-1">Data lama atau error render membuat tampilan berhenti.</p>
            </div>
            <div className="p-5 text-sm text-slate-700">
              <p className="leading-relaxed mb-3">Coba muat ulang halaman. Jika tetap terjadi, simpan pesan error ini agar bisa diperiksa.</p>
              <pre className="whitespace-pre-wrap bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs overflow-auto">{message}</pre>
            </div>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AppErrorBoundary><App /></AppErrorBoundary>);
</script>
</body>
