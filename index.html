window.addEventListener('unhandledrejection', function(event) {
  const message = event.reason && (event.reason.stack || event.reason.message) ? (event.reason.stack || event.reason.message) : event.reason;

const resizeTextareaToContent = (element) => {
  if (!element || element.tagName !== 'TEXTAREA') return;
  element.style.height = 'auto';
  const computedStyle = window.getComputedStyle(element);
  const minHeight = parseFloat(computedStyle.minHeight) || 0;
  const borderHeight = element.offsetHeight - element.clientHeight;
  element.style.height = `${Math.ceil(Math.max(element.scrollHeight + borderHeight, minHeight))}px`;
};

const resizeAllTextareas = (scope = document) => {
  scope.querySelectorAll('textarea').forEach(resizeTextareaToContent);
};

const GEMINI_API_KEY_STORAGE = 'gemini_api_key_eksternal_v3';
const GEMINI_API_KEY_LEGACY_STORAGE = 'gemini_api_key_eksternal_v2';
const GEMINI_MODEL_STORAGE = 'asistenGuru_geminiModel_v1';
const GEMINI_DEFAULT_MODEL = 'gemini-3.6-flash';
const GEMINI_MODEL_PRIORITY = [
  'gemini-3.6-flash',
  'gemini-2.5-flash',
  'gemini-3.5-flash-lite',
  'gemini-2.5-flash-lite'
];

const sanitizeGeminiApiKey = (value) => {
  let cleaned = String(value || "").trim();
  const assignmentMatch = cleaned.match(/^(?:export\s+)?(?:GEMINI_API_KEY|GOOGLE_API_KEY|GOOGLE_GENAI_API_KEY|GENERATIVE_LANGUAGE_API_KEY|API_KEY)\s*=\s*(.+)$/i);
  if (assignmentMatch) cleaned = assignmentMatch[1].trim();
  if (/^https?:\/\//i.test(cleaned)) {
    try {
      const keyFromUrl = new URL(cleaned).searchParams.get("key");
      if (keyFromUrl) cleaned = keyFromUrl;
    } catch (urlError) {}
  }
  return cleaned
    .replace(/^["'`]+|["'`]+$/g, "")
    .replace(/\s+/g, "");
};

const readStoredGeminiApiKey = () => {
  try {
    return sanitizeGeminiApiKey(
      localStorage.getItem(GEMINI_API_KEY_STORAGE)
      || localStorage.getItem(GEMINI_API_KEY_LEGACY_STORAGE)
      || sessionStorage.getItem(GEMINI_API_KEY_STORAGE)
      || sessionStorage.getItem(GEMINI_API_KEY_LEGACY_STORAGE)
      || ""
    );
  } catch (error) {
    return "";
  }
};

function App() {
  const [completedSteps, setCompletedSteps] = useState({});

  const [isGenerating, setIsGenerating] = useState(false);
  const [activeGenerateMode, setActiveGenerateMode] = useState("");
  const [individualLoading, setIndividualLoading] = useState({});
  const [countdown, setCountdown] = useState(0); 
  const [aiHistory, setAiHistory] = useState([]);
  const [showInstruksiHint, setShowInstruksiHint] = useState(false);
  
  const [instruksiKhusus, setInstruksiKhusus] = useState(() => localStorage.getItem('asistenGuru_instruksiKhusus_v43') || ""); 
  const [instruksiKhususAsesmen, setInstruksiKhususAsesmen] = useState(() => localStorage.getItem('asistenGuru_instruksiKhususAsesmen_v1') || "");
  const [instruksiKhususLkpd, setInstruksiKhususLkpd] = useState(() => localStorage.getItem('asistenGuru_instruksiKhususLkpd_v1') || "");
  
  const [showApiModal, setShowApiModal] = useState(false);
  const [geminiApiKey, setGeminiApiKey] = useState(readStoredGeminiApiKey);
  const [geminiModel, setGeminiModel] = useState(() => {
    try {
      return localStorage.getItem(GEMINI_MODEL_STORAGE) || GEMINI_DEFAULT_MODEL;
    } catch (error) {
      return GEMINI_DEFAULT_MODEL;
    }
  });
  const [tempApiKey, setTempApiKey] = useState("");
  const [isTestingApiKey, setIsTestingApiKey] = useState(false);
  const [apiKeyFeedback, setApiKeyFeedback] = useState(null);
  const geminiModelsCacheRef = useRef({ apiKey: "", models: [] });
  const [popup, setPopup] = useState(null);

  const notify = (title, message, type = "info") => setPopup({ title, message, type });
  const confirmPopup = (title, message, onConfirm) => setPopup({ title, message, type: "confirm", onConfirm });

  const saveApiKey = () => {
    const cleanedKey = sanitizeGeminiApiKey(tempApiKey);
    if (!cleanedKey) {
      localStorage.removeItem(GEMINI_API_KEY_STORAGE);
      localStorage.removeItem(GEMINI_API_KEY_LEGACY_STORAGE);
      sessionStorage.removeItem(GEMINI_API_KEY_STORAGE);
      sessionStorage.removeItem(GEMINI_API_KEY_LEGACY_STORAGE);
      setGeminiApiKey("");
      geminiModelsCacheRef.current = { apiKey: "", models: [] };
      setApiKeyFeedback(null);
      setShowApiModal(false);
      notify("API Key Dikosongkan", "Generate AI belum bisa berjalan sampai API key Gemini diisi kembali.", "warning");
      return;
    }
    localStorage.setItem(GEMINI_API_KEY_STORAGE, cleanedKey);
    localStorage.setItem(GEMINI_API_KEY_LEGACY_STORAGE, cleanedKey);
    sessionStorage.removeItem(GEMINI_API_KEY_STORAGE);
    sessionStorage.removeItem(GEMINI_API_KEY_LEGACY_STORAGE);
    setGeminiApiKey(cleanedKey);
    if (geminiModelsCacheRef.current.apiKey !== cleanedKey) {
      geminiModelsCacheRef.current = { apiKey: "", models: [] };
    }
    setApiKeyFeedback(null);
    setShowApiModal(false);
    notify("API Key Tersimpan", `API key berhasil disimpan di perangkat ini. Generate AI akan memakai ${geminiModel || GEMINI_DEFAULT_MODEL} dan berpindah otomatis ke model kompatibel bila diperlukan.`, "success");
  };

  const getInjectedApiKey = () => {
    const candidates = [];
    if (typeof window !== "undefined") {
      candidates.push(window.GOOGLE_API_KEY, window.GEMINI_API_KEY, window.GOOGLE_GENAI_API_KEY, window.GENERATIVE_LANGUAGE_API_KEY, window.API_KEY, window.__GOOGLE_API_KEY__, window.__GEMINI_API_KEY__, window.__API_KEY__);
    }
    if (typeof process !== "undefined" && process.env) {
      candidates.push(process.env.GOOGLE_API_KEY, process.env.GEMINI_API_KEY, process.env.GOOGLE_GENAI_API_KEY, process.env.GENERATIVE_LANGUAGE_API_KEY, process.env.API_KEY);
    }
    return sanitizeGeminiApiKey(candidates.find(k => typeof k === "string" && k.trim()) || "");
  };

  const getActiveApiKey = () => sanitizeGeminiApiKey(geminiApiKey) || getInjectedApiKey();
  const hasActiveApiKey = () => Boolean(getActiveApiKey());

  const isAnyLoading = isGenerating || Object.values(individualLoading).some(v => v === true);

  useEffect(() => { localStorage.setItem('asistenGuru_instruksiKhususLkpd_v1', instruksiKhususLkpd); }, [instruksiKhususLkpd]);

  useEffect(() => {
    let timer;
    if (isAnyLoading && countdown > 0) {
      timer = setTimeout(() => setCountdown(c => c - 1), 1000);
    }
    return () => clearTimeout(timer);
  }, [isAnyLoading, countdown]);

  const profilHints = {
    keimanan: "Menguatkan akhlak, syukur, tanggung jawab moral, dan sikap menghargai ciptaan Tuhan.",
    kewargaan: "Menguatkan kepedulian pada aturan, hak-kewajiban, musyawarah, dan kontribusi pada lingkungan.",
    penalaran: "Menguatkan kemampuan membaca data, mencari bukti, membandingkan alasan, dan mengambil simpulan.",
    kreativitas: "Menguatkan kemampuan membuat gagasan/produk/cara baru yang relevan dengan masalah nyata.",
    kolaborasi: "Menguatkan kemampuan berbagi peran, mendengar, memberi kontribusi, dan menyelesaikan tugas bersama.",
    kemandirian: "Menguatkan kemampuan menetapkan tujuan, memilih strategi belajar, dan mengevaluasi hasil sendiri.",
    kesehatan: "Menguatkan kebiasaan aman, sehat, seimbang, dan sadar risiko dalam aktivitas belajar.",

  const cleanStr = (str) => {
    if (!str) return "";
    let cleaned = String(str).replace(/\r\n/g, '\n').replace(/\\n/g, '\n').replace(/\*\*/g, '').replace(/\*/g, '');
    cleaned = cleaned.replace(/([A-Za-z\u00c0-\u00d6\u00d8-\u00f6\u00f8-\u00ff]{3,})\n[ \t]*([a-d])\)(?=\s*(?:[\.,;:!?\)]|[a-z\u00e0-\u00f6\u00f8-\u00ff]|$))/g, (match, stem, lastLetter, offset, source) => {

      const openCount = (context.match(/\(/g) || []).length;
      const closeCount = (context.match(/\)/g) || []).length;
      return openCount > closeCount ? `${stem}${lastLetter})` : match;

    cleaned = cleaned.replace(/([^\n])\s+((?:\d+[\.\)]|[A-E][\.\)])\s+)/g, (match, previous, markerText, offset, source) => {
      const context = source.slice(Math.max(0, offset - 48), offset + 1);

      return isInlineReference ? match : `${previous}\n${markerText}`;

    cleaned = cleaned.replace(/([^\n])\s+((?:-|\u2022)\s+)/g, (match, previous, bulletText, offset, source) => {
      const context = source.slice(Math.max(0, offset - 40), offset + 1);
      return /(?:Sintaks|Syntax)\s*(?:ke\s*[-:]?\s*)?\d+(?:\s*[-\u2013]\s*\d+)?$/i.test(context) ? match : `${previous}\n${bulletText}`;
    });
    cleaned = cleaned.replace(/([^\n])\s*([;|]\s*)((?:\d{1,2}|[A-Ea-e])[\.\)]\s+)/g, '$1\n$3');
    cleaned = cleaned.replace(/([^\n])\s+(Skor\s+\d+(?:-\d+)?\s*[:=])/gi, '$1\n$2');

  const countMeaningfulLines = (value) => cleanStr(value).split(/\n+/).filter(line => line.replace(/^[-\d\.\)\s]+/, '').trim().length > 18).length;

  const extractSintaksNumbers = (value) => {

    let match;

      numbers.push(Number(match[1]));

  const getExpectedSintaksCount = (value) => {

  const hasSyntaxMarker = (value) => /(?:sintaks|syntax)\s*(?:ke\s*[-:]?\s*)?\d+\b/i.test(cleanStr(value));
  const getSintaksLabelMap = (value) => {

  const parseSintaksOverview = (value) => {

    source.split(/\n+/).map(line => line.replace(/^[-\u2022]\s*/, '').trim()).filter(Boolean).forEach(line => {
      const modelMatch = line.match(/^(?:Model(?:\s+(?:Utama|Pembelajaran))?|Pendekatan\s*\/\s*Model)\s*[:=-]\s*(.+)$/i);

        } else if (!result.model) {

        return;
      }

      const number = Number(stepMatch[1]);
      let remainder = cleanStr(stepMatch[2]).replace(/^[-\u2013:\.)\s]+/, '').trim();
      let label = cleanStr(knownLabels[number]);
      let description = "";

  const parseActivitySyntaxGroups = (value, sintaksValue) => {

      const syntaxLabel = marker ? cleanStr(marker[2]) || labels[syntaxNumber] || `Tahap ${syntaxNumber}` : "";

        .replace(/^\[\s*(?:Sintaks|Syntax)\s*\d+[^\]]*\]\s*/i, '')
        .trim();
      if (!activityText) return;

      automaticNumber += 1;
      const item = { number: explicitNumber || String(automaticNumber), text: activityText, isHeading: isActivityHeadingLine(activityText) };
      const previous = groups[groups.length - 1];
      if (previous && previous.syntaxNumber === syntaxNumber && previous.syntaxLabel === syntaxLabel) {

      const phase = /awal|pendahuluan/i.test(phaseRaw) ? "Awal" : /akhir|penutup/i.test(phaseRaw) ? "Akhir" : /inti/i.test(phaseRaw) ? "Inti" : phaseRaw;
      const remainder = cleanStr(phaseMatch ? phaseMatch[2] : line);
      const parts = remainder.split(/\s*\|\s*/).map(part => cleanStr(part)).filter(Boolean);
      const syntax = cleanStr(parts.find(part => /Sintaks|Syntax/i.test(part)) || parts[0] || "-");

  const getPhaseSintaksNumbers = (mappingValue, phase, sintaksValue) => {

    const allNumbers = extractSintaksNumbers(sintaksValue).sort((a, b) => a - b);

    if (phase === 'awal') return [allNumbers[0]];

  const isActivityHeadingLine = (line) => {

  };
  const ensureActivitySyntaxMarkers = (value, phase, mappingValue, sintaksValue) => {
    const withoutLiteralMarker = String(value || '').replace(/\[\s*(?:Sintaks|Syntax)\s*(?:ke\s*[-:]?\s*)?n\b[^\]]*\]\s*/gi, '');

      const marker = `[Sintaks ${syntaxNumber} - ${syntaxLabel}]`;

  const repairRppSyntaxData = (data = {}) => {

  const ensureNumberedListText = (value, fallback, minLines = 3) => {

  const ensureLkpdProductText = (value, fallback) => {

  const ensureSituasiNyata = (value, data = rppData) => {

    const topic = cleanStr(data.topik) || "topik pembelajaran";

    return cleanStr(`${text ? `${text}\n` : ""}1. Konteks lokal: Siswa mengaitkan ${topic} dengan fenomena yang dapat diamati di ${school}, rumah, atau lingkungan sekitar.\n2. Masalah nyata: Siswa menelaah peristiwa/kasus sederhana yang dekat dengan pengalaman mereka sehingga konsep tidak dipelajari secara abstrak.\n3. Bukti awal: Siswa memakai pengamatan, cerita, data sederhana, foto, peta, tabel, atau hasil diskusi sebagai jangkar pembelajaran bermakna.`);
  };

  const ensureExperienceText = (value, label, data = rppData) => {
    const text = removeRepeatedTargetTriplet(value);
    if (hasNumberedOneToThree(text)) return text;
    if (countMeaningfulLines(text) >= 3 && /(konsep|bukti|data|kasus|strategi|refleksi|menerapkan|menganalisis|menyimpulkan|mengevaluasi|merancang)/i.test(text)) return text;
    const topic = cleanStr(data.topik) || "materi";
    const templates = {
      memahami: `1. Siswa mengaktifkan pengetahuan awal tentang ${topic} melalui pertanyaan pemantik dan contoh nyata.\n2. Siswa mengeksplorasi konsep kunci dengan membaca/mengamati data, gambar, kasus, atau demonstrasi singkat.\n3. Siswa menjelaskan makna konsep dengan bahasanya sendiri dan memeriksa miskonsepsi bersama guru.`,
      mengaplikasi: `1. Siswa menerapkan konsep ${topic} pada kasus baru yang dekat dengan kehidupan mereka.\n2. Siswa memakai bukti/data sederhana untuk memilih strategi, menyusun alasan, dan membuat produk/kinerja.\n3. Siswa membandingkan hasil kerja dengan kriteria keberhasilan dan memperbaiki jawabannya melalui umpan balik.`,
      merefleksi: `1. Siswa menuliskan strategi berpikir yang paling membantu saat memahami ${topic}.\n2. Siswa menilai bukti pemahaman dirinya, kesulitan yang tersisa, dan bantuan yang dibutuhkan.\n3. Siswa merumuskan rencana perbaikan belajar untuk pertemuan atau tugas berikutnya.`
    };
    if (/(^|\n)\s*\d+[\.)]\s+/.test(text)) return text;
    return cleanStr(`${text ? `${text}\n` : ""}${templates[label] || templates.memahami}`);
  };

  useEffect(() => {
    setRppData(prev => {
      const rows = syncPertemuanPembelajaran(prev);
      const repairedRows = rows.map(row => repairPertemuanSyntaxMarkers(row, prev.sintaksPembelajaran));
      const changed = repairedRows.some((row, index) => ["pemetaanSintaks", "kegiatanAwal", "kegiatanInti", "kegiatanPenutup"].some(key => row[key] !== rows[index][key]));
      if (!changed) return prev;
      return mirrorFirstPertemuanFields({ ...prev, pertemuanPembelajaran: repairedRows }, repairedRows);
    });
  }, []);

  useEffect(() => {
    setRppData(prev => {
      const rows = syncPertemuanPembelajaran(prev);
      let changed = false;
      const cleanedRows = rows.map(row => {
        const next = { ...row };
        ["pengalamanMemahami", "pengalamanMengaplikasi", "pengalamanMerefleksi"].forEach(key => {
          const cleaned = removeRepeatedTargetTriplet(next[key]);
          if (cleaned !== next[key]) {
            next[key] = cleaned;
            changed = true;
          }
        });
        return next;
      });
      if (!changed) return prev;
      return mirrorFirstPertemuanFields({ ...prev, pertemuanPembelajaran: cleanedRows }, cleanedRows);
    });
  }, []);

  const normalizeBentuk = (value) => {
    const v = cleanStr(value).toLowerCase();
    if (v.includes("kompleks")) return "PG Kompleks";
    if (v.includes("jodoh")) return "Menjodohkan";
    if (v.includes("isian")) return "Isian Singkat";
    if (v.includes("urai")) return "Uraian";
    if (v.includes("praktik") || v.includes("praktek") || v.includes("kinerja")) return "Praktik";
    if (v.includes("proyek") || v.includes("projek")) return "Proyek";
    if (v === "pg" || v.includes("pilihan ganda")) return "PG";
    return cleanStr(value);
  };

  const getBentukPenilaianList = (kisi = rppData.kisiKisi) => {
    const list = [];
    (kisi || []).forEach(k => {
      const bentuk = normalizeBentuk(k.bentuk);
      if (bentuk && !list.includes(bentuk)) list.push(bentuk);
    });
    return list.length ? list : ["Tertulis"];
  };

  const buildDefaultRubrik = (bentuk) => ({
    bentukPenilaian: bentuk,
    skor: skorBentuk[bentuk] || "4 = sangat baik\n3 = baik\n2 = cukup\n1 = perlu bimbingan\n0 = tidak menunjukkan evidensi",
    kriteria: bentuk === "PG" ? "Benar bila siswa memilih satu jawaban yang paling tepat sesuai indikator soal.\nSalah bila jawaban tidak sesuai, kosong, atau memilih lebih dari satu opsi." :
      bentuk === "PG Kompleks" ? "Nilai penuh hanya diberikan bila tepat dua pilihan benar dari lima opsi A-E dipilih seluruhnya.\nJika ada satu pilihan salah, kurang satu pilihan benar, atau memilih lebih dari dua, skor menjadi 0." :
      bentuk === "Menjodohkan" ? "Tersedia tepat 5 premis dan 5 respon.\nSetiap pasangan benar bernilai 1 sampai total 5.\nPasangan salah, ganda, atau kosong bernilai 0 pada pasangan tersebut." :
      bentuk === "Isian Singkat" ? "Skor 2 bila istilah/angka/jawaban tepat.\nSkor 1 bila inti jawaban benar tetapi kurang lengkap.\nSkor 0 bila salah atau kosong." :
      bentuk === "Uraian" ? "Skor 5: jawaban lengkap, konsep tepat, alasan kuat, dan memakai bukti/konteks.\nSkor 3-4: konsep tepat tetapi alasan/bukti belum lengkap.\nSkor 1-2: sebagian konsep benar tetapi penalaran lemah.\nSkor 0: tidak menjawab atau tidak sesuai indikator." :
      `Kriteria disusun sesuai evidensi ${bentuk}: proses, produk/kinerja, ketepatan konsep, penggunaan bukti, dan refleksi siswa.`
  });

  const stripLeadingLabel = (text, labels = []) => {
    let value = cleanStr(text);
    labels.forEach(label => {
      value = value.replace(new RegExp(`^\\s*${label}\\s*[:=\\-]\\s*`, "i"), "");
    });
    return cleanStr(value);
  };

  const stripRubrikLabels = (text) => cleanStr(text)
    .replace(/(^|\n)\s*Kriteria\s*[:=]\s*/gi, '$1')
    .replace(/(^|\n)\s*Deskripsi\s*Indikator\s*Penilaian\s*[:=]\s*/gi, '$1')
    .replace(/\n\s*\n/g, '\n')
    .trim();

  const getMaxScoreByFormOrText = (form, scoreText = "") => {
    const fixedMax = { "PG": "1", "PG Kompleks": "2", "Menjodohkan": "5", "Isian Singkat": "2", "Uraian": "5" };
    if (fixedMax[form]) return fixedMax[form];
    const nums = (cleanStr(scoreText).match(/\d+/g) || []).map(Number);
    if (nums.length) return String(Math.max(...nums));
    return form === "Praktik" || form === "Proyek" ? "4" : "-";
  };

  const getRubrikRangeByFormOrText = (form, scoreText = "") => {
    const fixedRange = { "PG": "0-1", "PG Kompleks": "0-2", "Menjodohkan": "0-5", "Isian Singkat": "0-2", "Uraian": "0-5", "Praktik": "0-10", "Proyek": "0-10" };
    const raw = cleanStr(scoreText);
    const directRange = raw.match(/\b\d+\s*-\s*\d+\b/);
    if (directRange && raw.split(/\n+/).length === 1) return directRange[0].replace(/\s*/g, '');
    if (fixedRange[form]) return fixedRange[form];
    const nums = (raw.match(/\d+/g) || []).map(Number);
    return nums.length ? `0-${Math.max(...nums)}` : "0-4";
  };

  const buildScoreRepresentation = (rangeText, criteriaText, form = "") => {
    const range = cleanStr(rangeText);
    let criteria = stripRubrikLabels(criteriaText);
    // ===== PERBAIKAN ENTER OTOMATIS =====
    criteria = criteria
      .replace(/\s+(?=Skor\s+\d+)/gi, '\n')
      .replace(/;\s*(?=Skor\s+\d+)/gi, '\n')
      .replace(/\.\s*(?=Skor\s+\d+)/gi, '.\n');

    // ====================================
    if (/Skor\s+\d+(?:\s*-\s*\d+)?\s*:/i.test(criteria)) return criteria;
    let source = range || skorBentuk[form] || "";
    if (/^Rentang\s+Nilai\s*:/i.test(criteria)) {
      source = criteria.replace(/^Rentang\s+Nilai\s*:\s*/i, '');
      criteria = "";
    }
    const lines = source.replace(/^Rentang\s+Nilai\s*:\s*/i, '').split(/\n+/).map(line => line.trim()).filter(Boolean);
    const converted = lines.map(line => {
      const match = line.match(/^(?:Skor\s*)?(\d+(?:\s*-\s*\d+)?)\s*(?:=|:|-)\s*(.+)$/i);
      if (!match) return line;
      const score = match[1].replace(/\s+/g, '');
      const desc = match[2].trim();
      return `Skor ${score}: ${desc.charAt(0).toUpperCase() + desc.slice(1)}`;
    }).filter(Boolean);
    if (converted.length) return converted.join('\n');
    return criteria || `Skor ${getRubrikRangeByFormOrText(form, range)}: Deskripsi capaian disesuaikan dengan indikator penilaian.`;
  };

  const normalizeRubrikRow = (row = {}, fallbackForm = "") => {
    if (!fallbackForm && !cleanStr(row.bentukPenilaian) && !cleanStr(row.skor) && !cleanStr(row.kriteria)) {
      return { id: row.id || Date.now() + 'r', bentukPenilaian: "", skor: "", kriteria: "" };
    }
    const bentuk = normalizeBentuk(row.bentukPenilaian || row.bentuk || row.jenis || fallbackForm);
    const fallback = buildDefaultRubrik(bentuk || fallbackForm || "Tertulis");
    const rawScore = cleanStr(row.skor);
    const rawCriteria = cleanStr(row.kriteria);
    const sourceRange = (rawScore && (/[=:-]/.test(rawScore) || rawScore.split(/\n+/).length > 1)) ? rawScore : fallback.skor;
    const sourceCriteria = rawCriteria || fallback.kriteria;
    return {
      id: row.id || Date.now() + 'r',
      bentukPenilaian: bentuk || fallback.bentukPenilaian,
      skor: getRubrikRangeByFormOrText(bentuk, rawScore || fallback.skor),
      kriteria: buildScoreRepresentation(sourceRange, sourceCriteria, bentuk)
    };
  };

  const kkoByLevel = { C1: "mengidentifikasi", C2: "menjelaskan", C3: "menerapkan", C4: "menganalisis", C5: "mengevaluasi", C6: "merancang" };
  const getExpectedAssessmentSequence = (planData = rppData) => {
    const planned = expandAssessmentBlueprint(planData);
    const hasPlanRows = Array.isArray(planData.rencanaAsesmen) && planData.rencanaAsesmen.length > 0;
    if (!planned.length && hasPlanRows) return [];
    const total = planned.length || 10;
    return Array.from({ length: total }).map((_, i) => planned[i] || { bentuk: bentukSoalUrut[i] || "Uraian", level: i < 2 ? "C3" : i < 8 ? "C4" : "C5" });
  };
  const getAssessmentSequenceText = (planData = rppData) => {
    const sequence = getExpectedAssessmentSequence(planData);
    return sequence.length ? sequence.map((shape, index) => `No. ${index + 1}: ${shape.bentuk} level ${shape.level}`).join('\n') : "Belum ada rencana soal valid.";
  };
  const getDefaultKisiRow = (shape, index, planData = rppData) => {
    const topic = cleanStr(planData.topik) || "materi pembelajaran";
    const context = cleanStr(planData.situasiNyataSiswa) || "situasi nyata di lingkungan siswa";
    const tp = cleanStr(planData.tp).replace(/\n+/g, '; ').slice(0, 260) || "tujuan pembelajaran pada modul ajar";
    const verb = kkoByLevel[shape.level] || "menganalisis";
    return {
      materi: topic,
      indikator: `${verb.charAt(0).toUpperCase() + verb.slice(1)} ${topic} melalui stimulus/kasus kontekstual tentang ${context} sesuai TP modul: ${tp}.`,
      level: shape.level,
      bentuk: shape.bentuk,
      nomor: String(index + 1)
    };
  };

  const mapKisiRows = (rows, planData = rppData) => {
    const expected = getExpectedAssessmentSequence(planData);
    return expected.map((shape, i) => {
      const k = rows?.[i] || {};
      const level = cleanStr(k.level).toUpperCase();
      const fallback = getDefaultKisiRow(shape, i, planData);
      const finalLevel = shape.level || (["C1","C2","C3","C4","C5","C6"].includes(level) ? level : fallback.level);
      const finalBentuk = shape.bentuk || normalizeBentuk(k.bentuk) || fallback.bentuk;
      return {
        id: Date.now() + 'k' + i,
        materi: cleanStr(k.materi) || fallback.materi,
        indikator: cleanStr(k.indikator) || fallback.indikator,
        level: finalLevel,
        bentuk: finalBentuk,
        nomor: String(i + 1)
      };
    });
  };

  const getChoiceLabels = (form = "PG") => normalizeBentuk(form) === "PG Kompleks" ? ["A", "B", "C", "D", "E"] : ["A", "B", "C", "D"];

  const repairLegacyChoiceLineBreaks = (text, form = "PG") => {
    const source = String(text || "").replace(/\r\n?/g, '\n').replace(/\\n/g, '\n');
    const requiredLabels = getChoiceLabels(form).slice(0, 4);
    const hasUppercaseChoices = requiredLabels.every(label => new RegExp(`(^|\\n|\\s|[.,;:!?])${label}\\s*[\\).:-]`).test(source));
    const hasMatchingStructure = /(?:premis|kelompok\s*a|kolom\s*a)[\s\S]*(?:respon|kelompok\s*b|kolom\s*b)/i.test(source);
    if (!hasUppercaseChoices && !hasMatchingStructure) return source;
    return source.replace(/([A-Za-z\u00c0-\u00d6\u00d8-\u00f6\u00f8-\u00ff]{3,})\n[ \t]*([a-d])([\.\)])(?=\s|[\.,;:!?\)]|$)/g, '$1$2$3');
  };

  const getChoiceOptionSequence = (text, form = "PG") => {
    const source = String(text || "")
      .replace(/\r\n?/g, '\n')
      .replace(/\\n/g, '\n')
      .replace(/\*\*/g, '')
      .trim();
    const labels = getChoiceLabels(form);
    const labelPattern = labels.join('');
    const markerPattern = new RegExp(`(^|[\\n\\r]|[ \\t]+|[\\.,;:!?])([${labelPattern}])\\s*[\\).:-]\\s*`, 'g');
    const candidates = [...source.matchAll(markerPattern)].map(match => ({
      label: match[2].toUpperCase(),
      markerStart: match.index + match[1].length,
      contentStart: match.index + match[0].length
    }));
    const markers = [];
    let cursor = -1;
    labels.forEach(label => {
      const marker = candidates.find(candidate => candidate.label === label && candidate.markerStart > cursor);
      if (marker) {
        markers.push(marker);
        cursor = marker.markerStart;
      }
    });
    if (markers.length !== labels.length) return { source, markers: [], options: [] };
    const options = markers.map((marker, index) => {
      const end = markers[index + 1]?.markerStart ?? source.length;
      const value = cleanStr(source.slice(marker.contentStart, end)).replace(/^[,;\s]+|[,;\s]+$/g, '').trim();
      return { label: marker.label, value };
    });
    return { source, markers, options };
  };

  const parseChoiceOptions = (text, form = "PG") => getChoiceOptionSequence(text, form).options;
  const hasCompleteChoiceOptions = (text, form = "PG") => {
    const labels = getChoiceLabels(form);
    const options = parseChoiceOptions(text, form);
    return options.length === labels.length && options.every((option, index) => option.label === labels[index] && option.value.length > 0);
  };

  const splitChoiceOptionsFromSoal = (soal, opsi, bentuk) => {
    const form = normalizeBentuk(bentuk);
    const question = cleanStr(soal);
    let options = cleanStr(opsi);
    if (!["PG", "PG Kompleks"].includes(form)) return { soal: question, opsi: options };
    const sequence = getChoiceOptionSequence(question, form);
    if (sequence.markers.length !== getChoiceLabels(form).length) return { soal: question, opsi: options };
    const start = sequence.markers[0].markerStart;
    const candidate = cleanStr(question.slice(start));
    if (!hasCompleteChoiceOptions(candidate, form)) return { soal: question, opsi: options };
    return {
      soal: cleanStr(question.slice(0, start)),
      opsi: hasCompleteChoiceOptions(options, form) ? options : candidate
    };
  };

  const splitMatchingOptionsFromSoal = (soal, opsi) => {
    const question = cleanStr(soal);
    const options = cleanStr(opsi);
    if (/(premis|kelompok\s*a|kolom\s*a).*(respon|kelompok\s*b|kolom\s*b)/is.test(options)) return { soal: question, opsi: options };
    const match = question.match(/((?:premis\s*\/\s*kolom\s*a|kelompok\s*a|kolom\s*a)\s*:?\s*[\s\S]*)/i);
    if (!match || !/(respon|kelompok\s*b|kolom\s*b)/i.test(match[1])) return { soal: question, opsi: options };
    return { soal: cleanStr(question.slice(0, match.index)), opsi: options || cleanStr(match[1]) };
  };

  const normalizeChoiceOptionsText = (text, form = "PG") => {
    const labels = getChoiceLabels(form);
    const labelPattern = labels.join('');
    let value = cleanStr(repairLegacyChoiceLineBreaks(text, form));
    if (/(premis|kelompok\s*a|kolom\s*a).*(respon|kelompok\s*b|kolom\s*b)/is.test(value)) {
      value = value.replace(/(?:premis|kelompok\s*a|kolom\s*a)\s*:?\s*[\s\S]*?(?:respon\s*\/\s*)?(?:kelompok\s*b|kolom\s*b)\s*:?\s*/i, '');
    }
    value = value.replace(new RegExp(`,\\s*(?=\\n\\s*[${labelPattern}]\\s*[\\).:-])`, 'g'), '\n').replace(/,\s*$/gm, '');
    const options = parseChoiceOptions(value, form);
    if (options.length === labels.length) return options.map(option => `${option.label}. ${option.value}`).join('\n');
    return value;
  };

  const normalizeMatchingOptionsText = (text) => {
    let value = cleanStr(repairLegacyChoiceLineBreaks(text));
    value = value
      .replace(/((?:^|\n)\s*\d+\s*[\).:-][^\n]*?)\s*\/\s*(?:Respon\s*\/\s*)?(?:Kolom|Kelompok)\s*B\s*:?\s*/gi, '$1\nRespon / Kolom B:\n')
      .replace(/(?:^|\n)\s*(?:Respon\s*\/\s*)?(?:Kolom|Kelompok)\s*B\s*:?\s*/gi, '\nRespon / Kolom B:\n')
      .replace(/Respon\s*\n+\s*Respon\s*\/\s*(?:Kolom|Kelompok)\s*B\s*:/gi, 'Respon / Kolom B:')
      .replace(/(?:Respon\s*\/\s*(?:Kolom|Kelompok)\s*B\s*:?\s*){2,}/gi, 'Respon / Kolom B:\n')
      .replace(/,\s*(?=\n\s*(?:\d+|[A-H])\s*[\).:-])/gi, '\n')
      .replace(/,\s*$/gm, '');
    return cleanStr(value);
  };

  const hasClearStimulus = (text) => {
    const value = cleanStr(text);
    return value.length >= 110 && /(data|kasus|tabel|grafik|cerita|situasi|pengamatan|informasi|hasil|lingkungan|siswa|sekolah|angka|jumlah|fakta|laporan|observasi)/i.test(value);
  };

  const ensureStimulusQuality = (text, kisiRow, index, form) => {
    const value = cleanStr(text);
    if (hasClearStimulus(value)) return value;
    const materi = cleanStr(kisiRow?.materi) || cleanStr(rppData.topik) || "materi pembelajaran";
    const indikator = cleanStr(kisiRow?.indikator) || `indikator soal nomor ${index + 1}`;
    const context = cleanStr(rppData.situasiNyataSiswa) || "lingkungan sekolah dan kehidupan sehari-hari siswa";
    const level = cleanStr(kisiRow?.level) || "C4";
    const intro = `Dalam konteks ${context}, siswa mempelajari ${materi} melalui informasi/kasus yang memuat data atau fakta sederhana. Gunakan informasi tersebut untuk ${level} sesuai indikator: ${indikator}.`;
    const task = value || `Tentukan jawaban yang paling tepat berdasarkan stimulus tersebut.`;
    return cleanStr(`${intro}\n${task}`);
  };

  const normalizeAnswerGuideText = (text) => stripLeadingLabel(text, [
    "Pedoman\\s+Jawaban",
    "Pedoman\\s+jawab",
    "Kunci\\s+Jawaban",
    "Jawaban\\s+Uraian",
    "Jawaban",
    "Rubrik\\s+ringkas"
  ]);

  const buildMatchingTemplate = (kisiRow, index) => {
    const materi = cleanStr(kisiRow?.materi) || cleanStr(rppData.topik) || "materi";
    const indikator = cleanStr(kisiRow?.indikator) || `indikator soal nomor ${index + 1}`;
    return `Premis / Kolom A:\n1. Pernyataan tentang konsep utama ${materi}.\n2. Bukti/gejala yang harus dianalisis sesuai indikator.\n3. Dampak atau akibat dari proses pada ${materi}.\n4. Tindakan/kesimpulan yang tepat berdasarkan kasus.\n5. Contoh penerapan konsep dalam konteks nyata.\n\nRespon / Kolom B:\nA. Dampak atau akibat yang sesuai dengan premis nomor 3.\nB. Konsep kunci yang sesuai dengan premis nomor 1.\nC. Contoh penerapan yang sesuai dengan premis nomor 5.\nD. Bukti atau gejala yang sesuai dengan premis nomor 2.\nE. Tindakan/kesimpulan yang sesuai dengan premis nomor 4.\n\nAcuan indikator: ${indikator}`;
  };

  const normalizeBankRowByKisi = (rawRow, kisiRow, index) => {
    const b = rawRow || {};
    const form = normalizeBentuk(kisiRow?.bentuk || bentukSoalUrut[index] || "");
    let split = splitChoiceOptionsFromSoal(b.soal, b.opsi, form);
    if (form === "Menjodohkan") split = splitMatchingOptionsFromSoal(split.soal, split.opsi);
    const fallbackSoal = `Bacalah stimulus kontekstual tentang ${cleanStr(kisiRow?.materi) || cleanStr(rppData.topik) || "materi"} berikut. Hubungkan setiap premis dengan respon yang paling tepat berdasarkan indikator: ${cleanStr(kisiRow?.indikator) || "indikator pembelajaran"}.`;
    let soal = ensureStimulusQuality(split.soal || fallbackSoal, kisiRow, index, form);
    let opsi = cleanStr(split.opsi);
    let kunci = cleanStr(b.kunci);
    if (form === "PG" || form === "PG Kompleks") opsi = normalizeChoiceOptionsText(opsi, form);
    if (form === "Menjodohkan") {
      opsi = normalizeMatchingOptionsText(opsi);
      const needsMatchingTemplate = countMatchingParts(opsi).premis < 5 || countMatchingParts(opsi).respon < 5;
      if (needsMatchingTemplate) opsi = buildMatchingTemplate(kisiRow, index);
      if (!kunci && needsMatchingTemplate) kunci = "1-B, 2-D, 3-A, 4-E, 5-C";
    }
    if (form === "Isian Singkat") {
      if (!kunci && opsi && opsi !== "-") kunci = normalizeAnswerGuideText(opsi);
      opsi = "-";
    }
    if (form === "Uraian") {
      const guide = normalizeAnswerGuideText(opsi) || normalizeAnswerGuideText(kunci);
      opsi = guide || "-";
      kunci = "-";
    }
    if (form === "Praktik" || form === "Proyek") {
      opsi = normalizeAnswerGuideText(opsi) || normalizeAnswerGuideText(kunci) || "-";
      kunci = "-";
    }
    return {
      id: Date.now() + 'b' + index,
      soal,
      opsi,
      kunci: normalizeBankKey(kunci, form)
    };
  };

  const mapBankRows = (rows, kisi = rppData.kisiKisi) => {
    const total = kisi?.length || rows?.length || 0;
    return Array.from({ length: total }).map((_, i) => normalizeBankRowByKisi(rows?.[i], kisi?.[i], i));
  };

  const getBankRowForDisplay = (row, index) => {
    const kisi = rppData.kisiKisi[index] || { bentuk: bentukSoalUrut[index] || "" };
    const normalized = normalizeBankRowByKisi(row, kisi, index);
    return { ...row, soal: normalized.soal, opsi: normalized.opsi, kunci: normalized.kunci };
  };

  const getPertemuanActivitySummary = (data = rppData) => syncPertemuanPembelajaran(data).map((row, index) => (
    `Pertemuan ${index + 1}: Pemetaan sintaks=${cleanStr(row.pemetaanSintaks) || '-'} | Awal=${cleanStr(row.kegiatanAwal) || '-'} | Inti=${cleanStr(row.kegiatanInti) || '-'} | Penutup=${cleanStr(row.kegiatanPenutup) || '-'} | Target=${[row.pengalamanMemahami, row.pengalamanMengaplikasi, row.pengalamanMerefleksi].filter(Boolean).join(' | ') || '-'}`
  )).join('\n');

  const getLkpdMeetingContext = (data = rppData) => syncPertemuanPembelajaran(data).map((row, index) => `KONTEKS LKPD PERTEMUAN ${index + 1}
- Pemetaan sintaks: ${cleanStr(row.pemetaanSintaks) || '-'}
- Kegiatan awal: ${cleanStr(row.kegiatanAwal) || '-'}
- Target memahami: ${cleanStr(row.pengalamanMemahami) || '-'}
- Assessment for Learning: ${cleanStr(row.asesmenAwal) || '-'}
- Kegiatan inti: ${cleanStr(row.kegiatanInti) || '-'}
- Target mengaplikasi/memaknai: ${cleanStr(row.pengalamanMengaplikasi) || '-'}
- Assessment as Learning: ${cleanStr(row.asesmenProses) || '-'}
- Kegiatan penutup: ${cleanStr(row.kegiatanPenutup) || '-'}
- Target merefleksi: ${cleanStr(row.pengalamanMerefleksi) || '-'}
- Assessment of Learning: ${cleanStr(row.asesmenAkhir) || '-'}`).join('\n\n');

  const getDefaultLkpdRow = (index, data = rppData) => {
    const pertemuan = syncPertemuanPembelajaran(data)[index] || {};
    const topic = cleanStr(data.topik) || "topik pembelajaran";
    const tp = cleanStr(data.tp).replace(/\n+/g, '; ').slice(0, 300) || "tujuan pembelajaran pada modul ajar";
    const kegiatanInti = cleanStr(pertemuan.kegiatanInti) || "kegiatan inti pembelajaran";
    const asesmen = [pertemuan.asesmenAwal, pertemuan.asesmenProses, pertemuan.asesmenAkhir].map(cleanStr).filter(Boolean).join('\n');
    return {
      id: `lkpd-${index + 1}`,
      pertemuan: `Pertemuan ${index + 1}`,
      judul: `LKPD Pertemuan ${index + 1}: ${topic}`,
      tujuan: `1. Siswa mengerjakan aktivitas LKPD untuk mencapai TP modul: ${tp}.\n2. Siswa menghasilkan bukti belajar yang selaras dengan kegiatan pembelajaran pertemuan ${index + 1}.`,
      petunjuk: "1. Baca setiap instruksi dengan teliti.\n2. Kerjakan secara mandiri atau berkelompok sesuai arahan guru.\n3. Gunakan data, bukti, atau hasil pengamatan dari kegiatan pembelajaran.\n4. Tulis jawaban dengan alasan yang jelas.",
      sumberBahan: `Bahan/sumber: catatan kegiatan, materi esensial ${topic}, konteks nyata siswa, alat tulis, dan media/alat yang digunakan pada kegiatan inti.`,
      langkahKerja: `1. Amati atau baca kembali stimulus/kasus yang digunakan pada kegiatan inti.\n2. Ikuti urutan tugas sesuai pemetaan sintaks pertemuan: ${cleanStr(pertemuan.pemetaanSintaks) || 'fase awal, inti, dan akhir yang ditetapkan guru.'}\n3. Kerjakan tugas sesuai alur kegiatan: ${kegiatanInti}\n4. Catat data, temuan, atau alasan penting yang mendukung jawaban.\n5. Susun produk/jawaban akhir sesuai kriteria keberhasilan dan periksa kembali menggunakan umpan balik guru/teman.`,
      produkBukti: `Produk/bukti belajar: jawaban LKPD, catatan data/pengamatan, kesimpulan, dan/atau produk kinerja yang sesuai dengan asesmen pertemuan.\nAcuan asesmen: ${asesmen || "asesmen awal, proses, dan akhir pada modul ajar."}`,
      refleksi: "1. Bagian mana yang paling membantu pemahamanmu?\n2. Bukti apa yang menunjukkan kamu sudah memahami materi?\n3. Kesulitan apa yang masih perlu dibantu?\n4. Apa perbaikan yang akan kamu lakukan pada tugas berikutnya?"
    };
  };

  const normalizeLkpdRow = (row = {}, index = 0, data = rppData) => {
    const fallback = getDefaultLkpdRow(index, data);
    return {
      id: row.id || fallback.id,
      pertemuan: cleanStr(row.pertemuan) || fallback.pertemuan,
      judul: cleanStr(row.judul) || fallback.judul,
      tujuan: cleanStr(row.tujuan) || fallback.tujuan,
      petunjuk: cleanStr(row.petunjuk) || fallback.petunjuk,
      sumberBahan: cleanStr(row.sumberBahan || row.bahanSumber || row.sumber) || fallback.sumberBahan,
      langkahKerja: ensureNumberedListText(row.langkahKerja || row.aktivitas || row.kegiatan, fallback.langkahKerja, 5),
      produkBukti: ensureLkpdProductText(row.produkBukti || row.bukti || row.produk || row.hasil, fallback.produkBukti),
      refleksi: ensureNumberedListText(row.refleksi || row.pertanyaanRefleksi, fallback.refleksi, 3)
    };
  };

  const mapLkpdRows = (rows, data = rppData) => {
    const pertemuanRows = syncPertemuanPembelajaran(data);
    return pertemuanRows.map((_, index) => normalizeLkpdRow(Array.isArray(rows) ? rows[index] : {}, index, data));
  };

  useEffect(() => {
    const expectedLength = syncPertemuanPembelajaran(rppData).length;
    if ((rppData.lkpd || []).length === expectedLength) return;
    setRppData(prev => ({ ...prev, lkpd: mapLkpdRows(prev.lkpd, prev) }));
  }, [rppData.jumlahPertemuan, (rppData.lkpd || []).length]);

  useEffect(() => {
    if (!rppData.bankSoal.length) return;
    const normalizedRows = rppData.bankSoal.map((row, index) => ({ ...row, ...normalizeBankRowByKisi(row, rppData.kisiKisi[index] || { bentuk: bentukSoalUrut[index] || "" }, index), id: row.id }));
    const hasMovedOptions = normalizedRows.some((row, index) => row.soal !== rppData.bankSoal[index].soal || row.opsi !== rppData.bankSoal[index].opsi || row.kunci !== rppData.bankSoal[index].kunci);
    if (hasMovedOptions) setRppData(prev => ({ ...prev, bankSoal: normalizedRows }));
  }, [rppData.bankSoal, rppData.kisiKisi]);

  useEffect(() => {
    if (!rppData.rubrikPenilaian.length) return;
    const needsMigration = rppData.rubrikPenilaian.some(row => {
      const skor = cleanStr(row.skor);
      const kriteria = cleanStr(row.kriteria);
      return /^Rentang\s+Nilai\s*:/i.test(kriteria) ||
        /(^|\n)\s*Kriteria\s*[:=]/i.test(kriteria) ||
        /^Skor\s+\d+(?:\s*-\s*\d+)?\s*:/i.test(skor);
    });
    if (!needsMigration) return;
    const normalizedRows = rppData.rubrikPenilaian.map(row => ({ ...normalizeRubrikRow(row), id: row.id }));
    setRppData(prev => ({ ...prev, rubrikPenilaian: normalizedRows }));
  }, [rppData.rubrikPenilaian.length]);

  const countMatchingParts = (text) => {
    const clean = normalizeMatchingOptionsText(text);
    const split = clean.match(/(?:premis|kelompok\s*a|kolom\s*a)\s*:?\s*([\s\S]*?)(?:respon|kelompok\s*b|kolom\s*b)\s*:?\s*([\s\S]*)/i);
    const premisSource = split ? split[1] : clean;
    const responSource = split ? split[2] : clean;
    const premis = (premisSource.match(/(^|\n)\s*\d+\s*[\).:-]\s*\S/g) || []).length;
    const respon = (responSource.match(/(^|\n)\s*[A-H]\s*[\).:-]\s*\S/gi) || []).length;
    return { premis, respon };
  };

  const countMatchingKeys = (text) => (cleanStr(text).match(/\d+\s*[-=]\s*[A-H]/gi) || []).length;

  const extractKeyLetters = (text, form = "PG") => {
    const upper = cleanStr(text).toUpperCase();
    const labels = getChoiceLabels(form);
    const labelPattern = labels.join('');
    const spaced = upper.match(new RegExp(`\\b[${labelPattern}]\\b`, 'g')) || [];
    if (spaced.length) return [...new Set(spaced)];
    const compact = upper.replace(new RegExp(`[^${labelPattern}]`, 'g'), '');
    if (new RegExp(`^[${labelPattern}]{1,${labels.length}}$`).test(compact)) return [...new Set(compact.split(''))];
    return [];
  };

  const normalizeBankKey = (text, form) => {
    const normalizedForm = normalizeBentuk(form);
    const raw = cleanStr(text);
    if (!raw) return "";
    if (normalizedForm === "PG") {
      const letters = extractKeyLetters(raw, normalizedForm);
      return letters.length === 1 ? letters[0] : raw;
    }
    if (normalizedForm === "PG Kompleks") {
      const letters = extractKeyLetters(raw, normalizedForm).sort();
      return letters.length === 2 ? `${letters[0]} dan ${letters[1]}` : raw;
    }
    return raw;
  };

  const extractListItems = (text, markerPattern) => {
    const source = cleanStr(text).replace(/\s*\|\s*/g, '\n');
    const marker = new RegExp(`(^|\\n|,|;)\\s*${markerPattern}\\s*[\\).:-]\\s*`, 'gi');
    const matches = [...source.matchAll(marker)];
    return matches.map((m, idx) => {
      const label = m[2];
      const start = m.index + m[0].length;
      const end = idx + 1 < matches.length ? matches[idx + 1].index : source.length;
      const value = source.slice(start, end).replace(/^[\s,;|:\-]+|[\s,;|:\-]+$/g, '');
      return { label, value };
    }).filter(item => item.value);
  };

  const parseMatchingOptions = (text) => {
    const source = normalizeMatchingOptionsText(text);
    const split = source.match(/(?:premis|kelompok\s*a|kolom\s*a)\s*:?\s*([\s\S]*?)(?:respon|kelompok\s*b|kolom\s*b)\s*:?\s*([\s\S]*)/i);
    const premisSource = split ? split[1] : source;
    const responSource = split ? split[2] : source;
    return {
      premis: extractListItems(premisSource, '(\\d+)'),
      respon: extractListItems(responSource, '([A-H])')
    };
  };

  const hasRubrikScoreLogic = (form, scoreText, criteriaText = "") => {
    const score = cleanStr(`${scoreText || ""}\n${criteriaText || ""}`);
    if (!score) return false;
    if (form === "PG") return /\b1\b/.test(score) && /\b0\b/.test(score);
    if (form === "PG Kompleks") return /\b2\b/.test(score) && /\b0\b/.test(score);
    if (form === "Menjodohkan") return /\b5\b/.test(score) && /\b4\b/.test(score) && /\b3\b/.test(score) && /\b2\b/.test(score) && /\b1\b/.test(score) && /\b0\b/.test(score);
    if (form === "Isian Singkat") return /\b2\b/.test(score) && /\b1\b/.test(score) && /\b0\b/.test(score);
    if (form === "Uraian") return /\b5\b/.test(score) && /\b4\b/.test(score) && /\b3\b/.test(score) && /\b2\b/.test(score) && /\b1\b/.test(score) && /\b0\b/.test(score);
    if (form === "Praktik" || form === "Proyek") return /\b10\b/.test(score) && /\b0\b/.test(score);
    return /\b4\b/.test(score) && /\b3\b/.test(score) && /\b2\b/.test(score) && /\b1\b/.test(score);
  };

  const mapRubrikByKisi = (rows, kisi = rppData.kisiKisi) => {
    const forms = getBentukPenilaianList(kisi);
    const byForm = {};
    (rows || []).forEach((row, i) => {
      const bentuk = normalizeBentuk(row.bentukPenilaian || row.bentuk || row.jenis || forms[i]);
      if (bentuk && !byForm[bentuk]) byForm[bentuk] = row;
    });
    return forms.map((bentuk, i) => {
      const src = byForm[bentuk] || {};
      return { ...normalizeRubrikRow(src, bentuk), id: src.id || Date.now() + 'r' + i, bentukPenilaian: bentuk };
    });
  };

  const syncRubrikFromKisi = () => {
    setRppData(prev => ({ ...prev, rubrikPenilaian: mapRubrikByKisi([], prev.kisiKisi) }));
    notify("Rubrik Disinkronkan", "Rubrik sudah dibuat ulang berdasarkan bentuk penilaian unik di kisi-kisi. Kolom skor hanya berisi skor maksimal, sedangkan rentang nilai masuk ke deskripsi.", "success");
  };

  const validateAssessmentStructure = (data = rppData) => {
    const warnings = [];
    const kisi = data.kisiKisi || [];
    const bank = data.bankSoal || [];
    const rubrik = data.rubrikPenilaian || [];
    const blueprint = getAssessmentBlueprint(data);
    const expectedSequence = getExpectedAssessmentSequence(data);
    const expectedTotal = expectedSequence.length;
    const requiredForms = kisi.length ? getBentukPenilaianList(kisi) : [...new Set(blueprint.map(row => row.bentuk))];
    if (expectedTotal < 1) warnings.push("Rencana Jumlah Soal belum valid. Isi minimal satu bentuk soal dengan jumlah lebih dari 0.");
    if (kisi.length !== expectedTotal) warnings.push(`Kisi-kisi harus tepat ${expectedTotal} baris sesuai rencana jumlah soal, saat ini ${kisi.length}.`);
    const hotsCount = kisi.filter(k => ["C4","C5","C6"].includes(k.level)).length;
    if (kisi.length >= expectedTotal && hotsCount < Math.ceil(expectedTotal * 0.6)) warnings.push(`Kisi-kisi perlu dominan C4-C6, saat ini baru ${hotsCount} indikator.`);
    const expectedGroups = {};
    const actualGroups = {};
    expectedSequence.forEach(shape => {
      const key = `${shape.bentuk}|${shape.level}`;
      expectedGroups[key] = (expectedGroups[key] || 0) + 1;
    });
    kisi.forEach(row => {
      const key = `${normalizeBentuk(row.bentuk)}|${cleanStr(row.level).toUpperCase()}`;
      actualGroups[key] = (actualGroups[key] || 0) + 1;
    });
    Object.keys(expectedGroups).forEach(key => {
      const [form, level] = key.split('|');
      const actual = actualGroups[key] || 0;
      if (actual !== expectedGroups[key]) warnings.push(`Rencana ${form} level ${level} harus tepat ${expectedGroups[key]} soal, saat ini ${actual}.`);
    });
    Object.keys(actualGroups).forEach(key => {
      if (!expectedGroups[key]) {
        const [form, level] = key.split('|');
        warnings.push(`Kisi-kisi memuat ${actualGroups[key]} soal ${form} level ${level} di luar rencana.`);
      }
    });
    kisi.forEach((k, i) => {
      if (!["C1","C2","C3","C4","C5","C6"].includes(cleanStr(k.level).toUpperCase())) warnings.push(`Kisi-kisi nomor ${i + 1}: level kognitif belum valid.`);
      const expected = expectedSequence[i];
      if (expected) {
        if (String(k.nomor || i + 1) !== String(i + 1)) warnings.push(`Kisi-kisi nomor ${i + 1}: kolom nomor harus ${i + 1}.`);
        if (normalizeBentuk(k.bentuk) !== expected.bentuk) warnings.push(`Kisi-kisi nomor ${i + 1}: bentuk harus ${expected.bentuk} sesuai rencana.`);
        if (cleanStr(k.level).toUpperCase() !== expected.level) warnings.push(`Kisi-kisi nomor ${i + 1}: level harus ${expected.level} sesuai rencana.`);
      }
      if (cleanStr(k.indikator) && ![data.tp, data.cp, data.materiEsensial, data.topik].some(src => cleanStr(src).split(/\s+/).some(word => word.length > 6 && cleanStr(k.indikator).toLowerCase().includes(word.toLowerCase())))) {
        warnings.push(`Kisi-kisi nomor ${i + 1}: indikator perlu lebih tampak menurunkan CP/TP/materi modul.`);
      }
    });
    if (bank.length !== expectedTotal) warnings.push(`Bank soal harus tepat ${expectedTotal} butir sesuai rencana jumlah soal, saat ini ${bank.length}.`);
    bank.forEach((b, i) => {
      const bentuk = normalizeBentuk(kisi[i]?.bentuk || expectedSequence[i]?.bentuk);
      const normalizedBankRow = normalizeBankRowByKisi(b, kisi[i] || expectedSequence[i], i);
      const opsi = cleanStr(normalizedBankRow.opsi);
      const kunci = cleanStr(normalizedBankRow.kunci).toUpperCase();
      const letters = extractKeyLetters(kunci, bentuk);
      if (!hasClearStimulus(normalizedBankRow.soal)) warnings.push(`Soal ${i + 1}: stimulus HOTS/literasi-numerasi perlu dibuat lebih jelas.`);
      if ((bentuk === "PG" || bentuk === "PG Kompleks") && !hasCompleteChoiceOptions(opsi, bentuk)) {
        const expectedLabels = getChoiceLabels(bentuk);
        warnings.push(`Soal ${i + 1}: ${bentuk} harus memuat tepat ${expectedLabels.length} opsi ${expectedLabels[0]}-${expectedLabels[expectedLabels.length - 1]} dan setiap opsi harus terisi.`);
      }
      if (bentuk === "PG" && letters.length !== 1) warnings.push(`Soal ${i + 1}: PG biasa harus punya 1 kunci.`);
      if (bentuk === "PG Kompleks" && letters.length !== 2) warnings.push(`Soal ${i + 1}: PG Kompleks harus tepat 2 kunci benar.`);
      if (bentuk === "Menjodohkan") {
        const parts = countMatchingParts(opsi);
        const keys = countMatchingKeys(normalizedBankRow.kunci);
        if (!/(premis|kelompok\s*a|kolom\s*a).*(respon|kelompok\s*b|kolom\s*b)/is.test(opsi)) warnings.push(`Soal ${i + 1}: menjodohkan harus memuat Premis/Kelompok A dan Respon/Kelompok B.`);
        if (parts.premis !== 5 || parts.respon !== 5 || keys !== 5) warnings.push(`Soal ${i + 1}: menjodohkan harus tepat 5 premis, 5 respon, dan 5 pasangan kunci.`);
        if (/1\s*[-=]\s*A.*2\s*[-=]\s*B.*3\s*[-=]\s*C.*4\s*[-=]\s*D.*5\s*[-=]\s*E/is.test(b.kunci)) warnings.push(`Soal ${i + 1}: pasangan menjodohkan masih terlalu berurutan, acak posisi respon agar tidak mudah ditebak.`);
      }
      if (bentuk === "Uraian" && (!opsi || opsi === "-")) warnings.push(`Soal ${i + 1}: uraian perlu pedoman/kunci jawaban ringkas di kolom pedoman jawab.`);
      if (bentuk === "Isian Singkat" && !cleanStr(normalizedBankRow.kunci)) warnings.push(`Soal ${i + 1}: isian singkat perlu kunci jawaban singkat yang pasti.`);
      if ((bentuk === "Praktik" || bentuk === "Proyek") && !/(rambu|pedoman|langkah|produk|kinerja|kriteria|rubrik)/i.test(opsi)) warnings.push(`Soal ${i + 1}: ${bentuk} perlu rambu/pedoman pengerjaan di kolom pedoman jawab.`);
    });
    requiredForms.forEach(form => {
      if (!rubrik.some(r => normalizeBentuk(r.bentukPenilaian) === form)) warnings.push(`Rubrik belum memuat bentuk penilaian: ${form}.`);
    });
    rubrik.forEach((r, i) => {
      const form = normalizeBentuk(r.bentukPenilaian);
      if (!cleanStr(r.bentukPenilaian)) warnings.push(`Rubrik nomor ${i + 1}: bentuk penilaian belum diisi.`);
      if (!hasRubrikScoreLogic(form, r.skor, r.kriteria)) warnings.push(`Rubrik ${r.bentukPenilaian || i + 1}: aturan skor belum sesuai bentuk penilaian.`);
    });
    return warnings;
  };

  const validateLkpdStructure = (data = rppData) => {
    const warnings = [];
    const pertemuanRows = syncPertemuanPembelajaran(data);
    const lkpdRows = Array.isArray(data.lkpd) ? data.lkpd : [];
    if (lkpdRows.length !== pertemuanRows.length) warnings.push(`LKPD harus tepat ${pertemuanRows.length} bagian sesuai jumlah pertemuan, saat ini ${lkpdRows.length}.`);
    lkpdRows.forEach((row, index) => {
      const merged = cleanStr(`${row.judul} ${row.tujuan} ${row.petunjuk} ${row.sumberBahan} ${row.langkahKerja} ${row.produkBukti} ${row.refleksi}`).toLowerCase();
      const pertemuanText = cleanStr(`${data.sintaksPembelajaran} ${pertemuanRows[index]?.pemetaanSintaks} ${pertemuanRows[index]?.kegiatanAwal} ${pertemuanRows[index]?.kegiatanInti} ${pertemuanRows[index]?.kegiatanPenutup} ${pertemuanRows[index]?.pengalamanMemahami} ${pertemuanRows[index]?.pengalamanMengaplikasi} ${pertemuanRows[index]?.pengalamanMerefleksi} ${pertemuanRows[index]?.asesmenAwal} ${pertemuanRows[index]?.asesmenProses} ${pertemuanRows[index]?.asesmenAkhir}`).toLowerCase();
      if (!cleanStr(row.judul)) warnings.push(`LKPD pertemuan ${index + 1}: judul belum diisi.`);
      if (countMeaningfulLines(row.tujuan) < 1) warnings.push(`LKPD pertemuan ${index + 1}: tujuan belum jelas.`);
      if (countMeaningfulLines(row.langkahKerja) < 3) warnings.push(`LKPD pertemuan ${index + 1}: langkah kerja perlu minimal 3 langkah operasional.`);
      if (!/(produk|bukti|jawaban|data|hasil|kinerja|kesimpulan)/i.test(row.produkBukti || "")) warnings.push(`LKPD pertemuan ${index + 1}: produk/bukti belajar perlu lebih eksplisit.`);
      if (pertemuanText && merged && !pertemuanText.split(/\s+/).some(word => word.length > 7 && merged.includes(word))) warnings.push(`LKPD pertemuan ${index + 1}: isi perlu lebih tampak mengikuti kegiatan pembelajaran pertemuan tersebut.`);
    });
    return warnings;
  };

  const getAiErrorText = (error) => String(error?.message || error || "");
  const getAiErrorDetailsText = (error) => {
    try {
      return JSON.stringify(error?.apiDetails || []);
    } catch (detailError) {
      return "";
    }
  };
  const isAiQuotaError = (error) => {
    const text = `${getAiErrorText(error)} ${error?.apiStatus || ""} ${getAiErrorDetailsText(error)}`;
    return Number(error?.httpStatus) === 429 || /(quota|resource[_\s-]*exhausted|rate[_\s-]*limit|free[_\s-]*tier|too many requests|exceeded your current quota)/i.test(text);
  };
  const isApiCredentialError = (error) => Number(error?.httpStatus) === 401 || /(API_KEY_INVALID|api key (?:is )?not valid|invalid api key|api key (?:is )?(?:missing|expired)|unauthenticated|unregistered caller)/i.test(`${getAiErrorText(error)} ${error?.apiStatus || ""}`);
  const isZeroGeminiQuotaError = (error) => {
    if (!isAiQuotaError(error)) return false;
    const text = `${getAiErrorText(error)} ${getAiErrorDetailsText(error)}`;
    return /(?:limit|quotaValue|quota_value)[^0-9]{0,20}0(?:\D|$)/i.test(text);
  };
  const getAiRetryWaitText = (error) => {
    const text = `${getAiErrorText(error)} ${error?.retryDelay || ""} ${getAiErrorDetailsText(error)}`;
    const secondsMatch = text.match(/(?:retry\s+(?:in|after)\s*|retryDelay[^\d]*)([\d.]+)\s*s/i);
    if (!secondsMatch) return "";
    const seconds = Math.max(1, Math.ceil(Number(secondsMatch[1]) || 0));
    if (seconds >= 60) return `Tunggu sekurang-kurangnya ${Math.ceil(seconds / 60)} menit sebelum mencoba lagi.`;
    return `Tunggu sekurang-kurangnya ${seconds} detik sebelum mencoba lagi.`;
  };
  const getFriendlyAiError = (error, actionLabel = "bagian ini") => {
    const text = getAiErrorText(error);
    const status = Number(error?.httpStatus) || 0;
    if (isApiCredentialError(error)) {
      return {
        kind: "credential",
        title: "API Key Gemini Ditolak",
        type: "error",
        message: "API key belum dapat dikenali oleh Gemini. Pastikan yang disalin adalah nilai key lengkap dari Google AI Studio, bukan nama key, Key ID, atau Project ID. Jika key berstatus Blocked/Leaked, buat key baru di Google AI Studio."
      };
    }
    if (isAiQuotaError(error)) {
      const retryText = getAiRetryWaitText(error);
      const zeroQuotaText = isZeroGeminiQuotaError(error)
        ? "Proyek Google untuk key ini melaporkan kuota API bernilai 0. Pastikan Terms of Service sudah diterima dan proyek memiliki akses Free Tier atau billing aktif di Google AI Studio. "
        : "";
      return {
        kind: "quota",
        title: "Kuota Generate AI Sedang Habis",
        type: "warning",
        message: `Kuota generate AI untuk API key yang digunakan belum tersedia atau telah mencapai batas sementara/harian, sehingga ${actionLabel} belum dapat dibuat.\n\n${zeroQuotaText}Data dan hasil yang sudah ada tetap tersimpan. ${retryText ? `${retryText} ` : ""}Jika kuota harian telah habis, coba kembali setelah kuota diperbarui atau gunakan API key lain yang masih memiliki kuota.`
      };
    }
    if (/failed to fetch|network|internet|connection|load failed/i.test(text)) {
      return { kind: "network", title: "Koneksi ke AI Terputus", type: "warning", message: `Sistem belum dapat menghubungi layanan AI untuk membuat ${actionLabel}. Periksa koneksi internet, lalu coba generate kembali. Data yang sudah diisi tetap tersimpan.` };
    }
    if ([500, 502, 503, 504].includes(status) || /(temporarily unavailable|service unavailable|overloaded|server error)/i.test(text)) {
      return { kind: "service", title: "Layanan AI Sedang Sibuk", type: "warning", message: `Layanan AI sedang sibuk sehingga ${actionLabel} belum dapat dibuat. Tunggu beberapa saat lalu coba kembali. Data yang sudah diisi tetap tersimpan.` };
    }
    if (error instanceof SyntaxError || /(respons AI kosong|output AI bukan|tidak berisi JSON|harus tepat \d+)/i.test(text)) {
      return { kind: "format", title: "Hasil AI Belum Sesuai", type: "warning", message: `AI belum menghasilkan susunan ${actionLabel} yang lengkap dan sesuai format aplikasi. Coba generate kembali; data sebelumnya tetap tersimpan dan tidak berubah.` };
    }
    if (/reported as leaked|key.*blocked|blocked.*key/i.test(text)) {
      return { kind: "credential", title: "API Key Diblokir Google", type: "error", message: "Google menandai API key ini sebagai terblokir atau pernah terekspos. Hapus key tersebut, buat key baru langsung dari Google AI Studio, lalu uji koneksinya sebelum generate." };
    }
    if (status === 403) {
      return { kind: "access", title: "Akses Gemini Belum Aktif", type: "warning", message: `API key dikenali, tetapi proyek Google belum diizinkan membuat ${actionLabel}. Buka Google AI Studio dengan akun pembuat key, terima persyaratan penggunaan, pastikan Generative Language API aktif, dan periksa apakah key berstatus aktif serta dibatasi khusus untuk Gemini API. Data yang sudah diisi tetap tersimpan.` };
    }
    if (status === 404 || /model.*(?:not found|not supported|unavailable)/i.test(text)) {
      return { kind: "model", title: "Model Gemini Belum Tersedia", type: "warning", message: `Model Gemini yang didukung proyek ini belum ditemukan untuk membuat ${actionLabel}. Aplikasi sudah mencoba model kompatibel yang tersedia; silakan uji kembali key atau periksa akses model di Google AI Studio.` };
    }
    if (status === 400) {
      return { kind: "request", title: "Permintaan Gemini Belum Diterima", type: "warning", message: `Gemini menolak format permintaan untuk membuat ${actionLabel}. Aplikasi tidak mengubah data lama. Uji koneksi API key, lalu coba kembali.` };
    }
    return { kind: "unknown", title: "Generate Belum Berhasil", type: "error", message: `Sistem AI belum berhasil membuat ${actionLabel}. Silakan coba kembali beberapa saat lagi. Data yang sudah diisi tetap tersimpan.` };
  };
  const handleAiFailure = (error, actionLabel) => {
    console.error(`Generate AI gagal: ${actionLabel}`, error);
    const friendly = getFriendlyAiError(error, actionLabel);
    if (!hasActiveApiKey() || friendly.kind === "credential") {
      setTempApiKey(geminiApiKey);
      setApiKeyFeedback({ type: "error", message: friendly.message });
      setShowApiModal(true);
      return;
    }
    notify(friendly.title, friendly.message, friendly.type);
  };

  const normalizeGeminiSchemaTypes = (value) => {
    if (Array.isArray(value)) return value.map(normalizeGeminiSchemaTypes);
    if (!value || typeof value !== "object") return value;
    return Object.fromEntries(Object.entries(value).map(([key, item]) => {
      if (key === "type" && typeof item === "string" && /^(OBJECT|ARRAY|STRING|NUMBER|INTEGER|BOOLEAN|NULL)$/.test(item)) {
        return [key, item.toLowerCase()];
      }
      return [key, normalizeGeminiSchemaTypes(item)];
    }));
  };

  const usesModernGeminiConfig = (model) => {
    const normalized = String(model || "").replace(/^models\//i, "");
    if (/latest/i.test(normalized)) return true;
    const version = normalized.match(/^gemini-(\d+)(?:\.(\d+))?/i);
    if (!version) return false;
    const major = Number(version[1]) || 0;
    const minor = Number(version[2]) || 0;
    return major > 3 || (major === 3 && minor >= 5);
  };

  const prepareGeminiPayload = (payload, model) => {
    const prepared = JSON.parse(JSON.stringify(payload || {}));
    const config = { ...(prepared.generationConfig || {}) };
    if (usesModernGeminiConfig(model)) {
      const oldMimeType = config.responseMimeType;
      const oldSchema = config.responseSchema;
      const currentTextFormat = config.responseFormat?.text || {};
      if (oldMimeType || oldSchema || config.responseFormat) {
        config.responseFormat = {
          text: {
            ...currentTextFormat,
            ...(oldMimeType ? { mimeType: oldMimeType } : {}),
            ...(oldSchema ? { schema: normalizeGeminiSchemaTypes(oldSchema) } : {}),
            ...(currentTextFormat.schema ? { schema: normalizeGeminiSchemaTypes(currentTextFormat.schema) } : {})
          }
        };
      }
      delete config.responseMimeType;
      delete config.responseSchema;
      delete config.candidateCount;
      delete config.temperature;
      delete config.topP;
      delete config.topK;
    }
    prepared.generationConfig = config;
    return prepared;
  };

  const createGeminiRequestError = (response, result, model) => {
    const apiError = new Error(result?.error?.message || `Layanan Gemini menolak permintaan pada model ${model}.`);
    apiError.httpStatus = response.status;
    apiError.apiStatus = result?.error?.status || "";
    apiError.apiDetails = result?.error?.details || [];
    apiError.retryDelay = apiError.apiDetails.find(detail => detail?.retryDelay)?.retryDelay || "";
    apiError.geminiModel = model;
    return apiError;
  };

  const shouldTryNextGeminiModel = (error) => {
    const status = Number(error?.httpStatus) || 0;
    const text = `${getAiErrorText(error)} ${error?.apiStatus || ""}`;
    if (status === 404) return true;
    if (status === 400 && /(model|response.?format|response.?schema|unknown name|unsupported|invalid argument)/i.test(text)) return true;
    if (status === 403 && !isApiCredentialError(error)) return true;
    return isAiQuotaError(error);
  };

  const normalizeGeminiModelName = (name) => String(name || "").trim().replace(/^models\//i, "");

  const isUsableGeminiTextModel = (model) => {
    const name = normalizeGeminiModelName(model);
    if (!/^gemini-/i.test(name)) return false;
    return !/(embedding|image|imagen|veo|lyria|tts|live|audio|robotics|computer-use|deep-research|banana)/i.test(name);
  };

  const getGeminiModelScore = (model) => {
    const name = normalizeGeminiModelName(model);
    const priorityIndex = GEMINI_MODEL_PRIORITY.indexOf(name);
    if (priorityIndex >= 0) return 10000 - priorityIndex;
    let score = 0;
    const version = name.match(/^gemini-(\d+)(?:\.(\d+))?/i);
    if (version) score += (Number(version[1]) || 0) * 100 + (Number(version[2]) || 0) * 10;
    if (/flash(?!-lite)/i.test(name)) score += 500;
    else if (/flash-lite/i.test(name)) score += 400;
    else if (/pro/i.test(name)) score += 250;
    if (/latest|stable/i.test(name)) score += 40;
    if (/preview|experimental|\bexp\b/i.test(name)) score -= 200;
    return score;
  };

  const getGeminiModelCandidates = (preferredModel = geminiModel, availableModels = []) => {
    const normalizedAvailable = Array.from(new Set((availableModels || []).map(normalizeGeminiModelName).filter(isUsableGeminiTextModel)));
    const availableSet = new Set(normalizedAvailable);
    const orderedDiscovered = [...normalizedAvailable].sort((a, b) => getGeminiModelScore(b) - getGeminiModelScore(a));
    const ordered = [
      normalizeGeminiModelName(preferredModel),
      ...GEMINI_MODEL_PRIORITY,
      ...orderedDiscovered
    ].filter(Boolean);
    return Array.from(new Set(ordered)).filter(model => !availableSet.size || availableSet.has(model));
  };

  const fetchAvailableGeminiModels = async (apiKey, forceRefresh = false) => {
    const cleanedKey = sanitizeGeminiApiKey(apiKey);
    const cached = geminiModelsCacheRef.current;
    if (!forceRefresh && cached.apiKey === cleanedKey && cached.models.length) return cached.models;

    const discovered = [];
    let pageToken = "";
    for (let page = 0; page < 5; page++) {
      const params = new URLSearchParams({ pageSize: "1000" });
      if (pageToken) params.set("pageToken", pageToken);
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?${params.toString()}`, {
        method: "GET",
        headers: {
          "Accept": "application/json",
          "x-goog-api-key": cleanedKey
        }
      });
      let result = {};
      try {
        result = await response.json();
      } catch (parseError) {
        result = {};
      }
      if (!response.ok) throw createGeminiRequestError(response, result, "models.list");
      (result.models || []).forEach(modelInfo => {
        const methods = Array.isArray(modelInfo?.supportedGenerationMethods) ? modelInfo.supportedGenerationMethods : [];
        const modelName = normalizeGeminiModelName(modelInfo?.name || modelInfo?.baseModelId);
        if (methods.includes("generateContent") && isUsableGeminiTextModel(modelName)) discovered.push(modelName);
      });
      pageToken = result.nextPageToken || "";
      if (!pageToken) break;
    }

    const models = Array.from(new Set(discovered));
    if (!models.length) {
      const noModelError = new Error("API key dikenali, tetapi tidak memiliki model teks Gemini yang mendukung generateContent.");
      noModelError.httpStatus = 404;
      noModelError.apiStatus = "NO_SUPPORTED_MODEL";
      throw noModelError;
    }
    geminiModelsCacheRef.current = { apiKey: cleanedKey, models };
    return models;
  };

  const callGeminiAPI = async (payload, options = {}) => {
    const apiKey = sanitizeGeminiApiKey(options.apiKey || getActiveApiKey());
    if (!apiKey) {
      const missingKeyError = new Error("API key Gemini belum diisi.");
      missingKeyError.httpStatus = 401;
      missingKeyError.apiStatus = "UNAUTHENTICATED";
      throw missingKeyError;
    }

    let models = options.models?.length ? options.models.map(normalizeGeminiModelName).filter(Boolean) : [];
    if (!models.length) {
      const fallbackModels = getGeminiModelCandidates(options.preferredModel);
      if (options.discoverModels === false) {
        models = fallbackModels;
      } else {
        try {
          const availableModels = await fetchAvailableGeminiModels(apiKey);
          models = getGeminiModelCandidates(options.preferredModel, availableModels);
        } catch (discoveryError) {
          const discoveryStatus = Number(discoveryError?.httpStatus) || 0;
          if (isApiCredentialError(discoveryError) || discoveryStatus === 403 || discoveryStatus === 404) throw discoveryError;
          models = fallbackModels;
        }
      }
    }
    if (!models.length) throw new Error("Tidak ada model Gemini yang dapat dipakai oleh API key ini.");
    const retryDelays = [0, 1200, 2500];
    let lastError = null;

    for (let modelIndex = 0; modelIndex < models.length; modelIndex++) {
      const model = models[modelIndex];
      const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`;
      const preparedPayload = prepareGeminiPayload(payload, model);

      for (let attempt = 0; attempt < retryDelays.length; attempt++) {
        if (retryDelays[attempt]) await new Promise(resolve => setTimeout(resolve, retryDelays[attempt]));
        try {
          const response = await fetch(url, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Accept": "application/json",
              "x-goog-api-key": apiKey
            },
            body: JSON.stringify(preparedPayload)
          });
          let result = {};
          try {
            result = await response.json();
          } catch (parseError) {
            result = {};
          }
          if (!response.ok) throw createGeminiRequestError(response, result, model);

          if (options.persistModel !== false) {
            setGeminiModel(model);
            try {
              localStorage.setItem(GEMINI_MODEL_STORAGE, model);
            } catch (storageError) {}
          }
          return { ...result, __appGeminiModel: model };
        } catch (error) {
          lastError = error;
          const status = Number(error?.httpStatus) || 0;
          const canRetrySameModel = !status || status >= 500;
          if (canRetrySameModel && attempt < retryDelays.length - 1) continue;
          break;
        }
      }

      if (!shouldTryNextGeminiModel(lastError) || modelIndex === models.length - 1) throw lastError;
    }
    throw lastError || new Error("Layanan Gemini belum dapat memproses permintaan.");
  };

  const testGeminiApiKey = async () => {
    const keyToTest = sanitizeGeminiApiKey(tempApiKey);
    if (!keyToTest) {
      setApiKeyFeedback({ type: "error", message: "Masukkan API key Gemini terlebih dahulu. Aplikasi menerima key standar, key auth baru, key lama, maupun key yang disisipkan Canvas." });
      return;
    }
    setIsTestingApiKey(true);
    setApiKeyFeedback({ type: "info", message: "Sedang membaca model yang tersedia untuk key ini dan menguji satu model yang kompatibel..." });
    try {
      const availableModels = await fetchAvailableGeminiModels(keyToTest, true);
      const candidateModels = getGeminiModelCandidates(geminiModel || GEMINI_DEFAULT_MODEL, availableModels);
      const result = await callGeminiAPI({
        contents: [{ role: "user", parts: [{ text: "Balas tepat dengan kata OK." }] }],
        generationConfig: { maxOutputTokens: 128 }
      }, {
        apiKey: keyToTest,
        models: candidateModels,
        discoverModels: false,
        persistModel: false
      });
      const responseText = result?.candidates?.[0]?.content?.parts?.map(part => part?.text || "").join("").trim();
      if (!responseText) throw new Error("Koneksi diterima, tetapi model tidak mengembalikan teks uji.");
      const workingModel = result.__appGeminiModel || GEMINI_DEFAULT_MODEL;
      setGeminiModel(workingModel);
      try {
        localStorage.setItem(GEMINI_MODEL_STORAGE, workingModel);
      } catch (storageError) {}
      setApiKeyFeedback({ type: "success", message: `Koneksi berhasil. Terdeteksi ${availableModels.length} model teks; generate dapat berjalan dengan ${workingModel}. Silakan simpan key.` });
    } catch (error) {
      const friendly = getFriendlyAiError(error, "uji koneksi");
      setApiKeyFeedback({ type: "error", message: friendly.message });
    } finally {
      setIsTestingApiKey(false);
    }
  };

  const getGeminiResponseText = (result) => {
    const parts = result?.candidates?.[0]?.content?.parts;
    if (!Array.isArray(parts)) return "";
    return parts
      .map(part => typeof part?.text === "string" ? part.text : "")
      .filter(Boolean)
      .join("")
      .trim();
  };

  const stableGenerationConfig = (extra = {}) => ({
    candidateCount: 1,
    temperature: 0.22,
    topP: 0.86,
    ...extra
  });

  const mapGeneratedPertemuan = (aiData = {}, prev = rppData) => {
    const count = getJumlahPertemuanValue(prev.jumlahPertemuan);
    const generatedSintaks = normalizeSintaksText(aiData.sintaksPembelajaran || prev.sintaksPembelajaran);
    const fallbackFromLegacy = {
      pemetaanSintaks: normalizePemetaanSintaksText(aiData.pemetaanSintaks) || prev.pemetaanSintaks,
      kegiatanAwal: cleanStr(aiData.kegiatanAwal) || prev.kegiatanAwal,
      pengalamanMemahami: ensureExperienceText(aiData.pengalamanMemahami || prev.pengalamanMemahami, 'memahami', prev),
      asesmenAwal: cleanStr(aiData.asesmenAwal) || prev.asesmenAwal,
      kegiatanInti: cleanStr(aiData.kegiatanInti) || prev.kegiatanInti,
      pengalamanMengaplikasi: ensureExperienceText(aiData.pengalamanMengaplikasi || prev.pengalamanMengaplikasi, 'mengaplikasi', prev),
      asesmenProses: cleanStr(aiData.asesmenProses) || prev.asesmenProses,
      kegiatanPenutup: cleanStr(aiData.kegiatanPenutup) || prev.kegiatanPenutup,
      pengalamanMerefleksi: ensureExperienceText(aiData.pengalamanMerefleksi || prev.pengalamanMerefleksi, 'merefleksi', prev),
      asesmenAkhir: cleanStr(aiData.asesmenAkhir) || prev.asesmenAkhir
    };
    const source = Array.isArray(aiData.pertemuanPembelajaran) && aiData.pertemuanPembelajaran.length ? aiData.pertemuanPembelajaran : [fallbackFromLegacy];
    const existingRows = syncPertemuanPembelajaran(prev, count);
    return Array.from({ length: count }).map((_, index) => {
      const raw = source[index] || {};
      const fallback = index === 0 ? fallbackFromLegacy : existingRows[index] || {};
      const normalized = normalizePertemuanEntry(raw, index, fallback);
      const generatedRow = {
        ...normalized,
        pemetaanSintaks: normalizePemetaanSintaksText(raw.pemetaanSintaks || fallback.pemetaanSintaks),
        kegiatanAwal: cleanStr(raw.kegiatanAwal) || fallback.kegiatanAwal || "",
        pengalamanMemahami: ensureExperienceText(raw.pengalamanMemahami || fallback.pengalamanMemahami, 'memahami', prev),
        asesmenAwal: ensureAssessmentFunctionText(cleanStr(raw.asesmenAwal) || fallback.asesmenAwal || "", "forLearning"),
        kegiatanInti: cleanStr(raw.kegiatanInti) || fallback.kegiatanInti || "",
        pengalamanMengaplikasi: ensureExperienceText(raw.pengalamanMengaplikasi || fallback.pengalamanMengaplikasi, 'mengaplikasi', prev),
        asesmenProses: ensureAssessmentFunctionText(cleanStr(raw.asesmenProses) || fallback.asesmenProses || "", "asLearning"),
        kegiatanPenutup: cleanStr(raw.kegiatanPenutup) || fallback.kegiatanPenutup || "",
        pengalamanMerefleksi: ensureExperienceText(raw.pengalamanMerefleksi || fallback.pengalamanMerefleksi, 'merefleksi', prev),
        asesmenAkhir: ensureAssessmentFunctionText(cleanStr(raw.asesmenAkhir) || fallback.asesmenAkhir || "", "ofLearning")
      };
      return repairPertemuanSyntaxMarkers(generatedRow, generatedSintaks);
    });
  };

  const handleGenerateAI = async () => {
    if (!rppData.topik || !rppData.mapel || !rppData.kelas) {
      notify("Data Belum Lengkap", "Mohon isi Mata Pelajaran, Fase/Kelas, dan Topik Pembelajaran terlebih dahulu.", "warning");
      return;
    }
    if (!hasActiveApiKey()) {
      setTempApiKey("");
      setApiKeyFeedback({ type: "error", message: "Isi dan uji API key Gemini terlebih dahulu agar generate Modul Ajar/RPP dapat berjalan." });
      setShowApiModal(true);
      return;
    }
    setIsGenerating(true);
    setActiveGenerateMode("modul");
    setCountdown(12);

    const jumlahPertemuan = getJumlahPertemuanValue(rppData.jumlahPertemuan);
    const mapelCpGuidance = getMapelCpGuidance(rppData.mapel, rppData.kelas);
    const prompt = `Anda adalah ahli kurikulum dan Pembelajaran Mendalam. Tugas Anda HANYA menyusun Modul Ajar/RPM, bukan menyusun kisi-kisi, bank soal, rubrik lampiran, atau LKPD.

${generationScopeContracts.modul}

ATURAN TETAP KURIKULER:
1. Ikuti alur CP -> analisis materi -> kompetensi awal -> TP -> pengalaman memahami, mengaplikasi, merefleksi -> asesmen awal, proses, akhir -> refleksi guru.
2. CP harus formal sesuai mapel dan fase. Jangan mengubah CP menjadi tujuan harian. Ikuti RUJUKAN CP MAPEL agar Bahasa Jawa dan Koding/KA tidak diperlakukan sebagai mapel umum.
3. Tujuan Pembelajaran WAJIB minimal 3 butir bernomor, memakai kata kerja operasional terukur, dan jelas menurunkan CP ke topik.
4. Kompetensi awal harus berupa prasyarat materi yang spesifik, bukan teks generik. Awali tiap poin dengan kemampuan prasyarat konkret.
5. Kesiapan peserta didik wajib membedakan kognitif, motivasi, kebiasaan belajar, dan kebutuhan dukungan.
6. Karakteristik materi wajib menjelaskan sifat faktual, konseptual, prosedural, kontekstual, dan/atau lintas disiplin.
7. Materi esensial/pokok materi wajib cukup lengkap dan terstruktur, bukan terlalu pendek. Tulis minimal 6 poin bernomor yang memuat: konsep inti, submateri, istilah penting, prinsip/prosedur, contoh atau konteks nyata, miskonsepsi yang perlu diantisipasi, serta batasan materi. Tetap fokus pada materi yang benar-benar diajarkan.
8. Situasi nyata lingkungan siswa wajib eksplisit minimal 3 poin: konteks lokal, masalah/fenomena nyata, dan bukti/data sederhana yang dapat diamati siswa.
9. Profil lulusan dan KSE wajib tampak sebagai konsekuensi nyata dalam kegiatan, asesmen, atau refleksi.
10. Praktik pedagogis wajib menetapkan SATU model pembelajaran utama yang paling sesuai dengan CP, TP, karakter materi, konteks siswa, dan alokasi waktu. Pendekatan/metode lain hanya sebagai pendukung. Jelaskan alasan pemilihannya.
11. Field sintaksPembelajaran wajib memuat keseluruhan urutan baku model utama dari awal sampai akhir. Baris pertama harus "Model Utama: ...". Baris berikutnya harus memakai format "Sintaks 1 - Nama tahap: tujuan operasional", "Sintaks 2 - ...", dan seterusnya sesuai jumlah tahap asli model; jangan mengarang, menukar, atau mencampur sintaks model lain.
12. Aktivitas kelas harus kaya, operasional, dan dapat dipraktikkan guru: kegiatan awal minimal 5 langkah; kegiatan inti minimal 7 langkah; kegiatan penutup minimal 4 langkah. Setiap langkah wajib memakai nomor sintaks nyata, contoh "1. [Sintaks 1 - Orientasi pada masalah] Guru ...; Siswa ...; Hasil/bukti ...". Ganti nomor dan nama tahap sesuai pemetaan; DILARANG menulis placeholder "Sintaks n".
13. Target kognitif Memahami, Mengaplikasi, dan Merefleksi masing-masing minimal 3 poin yang menunjukkan proses berpikir siswa, bukan sekadar aktivitas fisik.
14. Bedakan fungsi asesmen secara tegas dan konsisten pada setiap pertemuan:
   - asesmenAwal = Asesmen untuk Proses Pembelajaran (Assessment for Learning): diagnostik/formatif untuk memetakan kesiapan atau kemajuan dan menentukan penyesuaian pengajaran oleh guru.
   - asesmenProses = Asesmen sebagai Proses Pembelajaran (Assessment as Learning): siswa menggunakan kriteria, penilaian diri/teman sebaya, refleksi, dan umpan balik untuk memperbaiki strategi belajarnya.

  const escapeHtml = (txt) => cleanStr(txt).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

  const formatKeyForExport = (key, form) => normalizeBankKey(key, form);
  const formatText = (txt) => {
    const lines = cleanStr(txt).split(/\n+/).map(line => line.trim()).filter(Boolean);

    const getMarker = (line) => {
      let match = line.match(/^(\d+)[\.)]\s+(.+)$/);

      match = line.match(/^([A-Z])[\.)]\s+(.+)$/);
      if (match) return { type: 'upper', tag: 'ol', attr: `class="letter-list" style="margin-top:0;margin-bottom:0;margin-left:0pt;padding-left:14pt;text-align:justify" type="A" start="${match[1].charCodeAt(0) - 64}"`, text: match[2] };
      match = line.match(/^([a-z])[\.)]\s+(.+)$/);
      if (match) return { type: 'lower', tag: 'ol', attr: `class="lower-letter-list" style="margin-top:0;margin-bottom:0;margin-left:0pt;padding-left:14pt;text-align:justify" type="a" start="${match[1].charCodeAt(0) - 96}"`, text: match[2] };

    let list = null;

      if (!list) return;
      html.push(`<${list.tag} ${list.attr}>${list.items.map(item => `<li style="margin:0 0 1pt 0;text-align:justify;line-height:1.05;mso-line-height-rule:at-least">${escapeHtml(item)}</li>`).join('')}</${list.tag}>`);
      list = null;
    };
    lines.forEach(line => {
      const marker = getMarker(line);
      if (marker) {
        const sameList = list && list.type === marker.type && list.tag === marker.tag;
        if (!sameList) {
          flushList();
          list = { type: marker.type, tag: marker.tag, attr: marker.attr, items: [] };

    });
    flushList();
    return html.join('');
  };
  const parseAssessmentDetails = (txt) => {
