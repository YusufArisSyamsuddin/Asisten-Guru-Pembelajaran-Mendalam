@keyframes pulse-blue { 0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); } 100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); } }

<body class="bg-slate-50 font-sans text-slate-800">
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

const Card = ({ children, className = "" }) => (<div className={`bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden ${className}`}>{children}</div>);

const Accordion = ({ title, icon, subtitle, children, defaultOpen = false, isCompleted, onToggleComplete, headerColorClass = "bg-blue-100 text-blue-700" }) => {
  const [isOpen, setIsOpen] = useState(defaultOpen);
  return (
    <Card className={`mb-5 transition-all duration-300 ${isCompleted ? 'border-l-4 border-l-green-500 opacity-80 bg-slate-50' : 'border-l-4 border-l-blue-600'}`}>
      <div className="flex items-center justify-between p-3 sm:p-4 hover:bg-slate-50 cursor-pointer" onClick={() => setIsOpen(!isOpen)}>
        <div className="flex-1 flex items-center space-x-3 sm:space-x-4 text-left">
          <div className={`w-10 h-10 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center shadow-sm shrink-0 ${isCompleted ? 'bg-green-100 text-green-700' : headerColorClass}`}>
            <i className={`${icon} text-lg sm:text-xl`}></i>
          </div>
          <div>
            <h3 className={`font-bold text-base sm:text-lg leading-tight ${isCompleted ? 'text-green-800 line-through decoration-green-400' : 'text-slate-800'}`}>{title}</h3>
            {subtitle && <p className="text-xs sm:text-sm font-medium text-slate-500 mt-0.5">{subtitle}</p>}
          </div>
        </div>
        <div className="flex items-center space-x-2 sm:space-x-3" onClick={(e) => e.stopPropagation()}>
          <button onClick={onToggleComplete} className={`w-7 h-7 sm:w-8 sm:h-8 shrink-0 rounded-full flex items-center justify-center border-2 transition-colors shadow-sm ${isCompleted ? 'bg-green-500 border-green-500 text-white' : 'border-slate-300 bg-white text-transparent hover:border-green-400'}`} title="Tandai Selesai">✓</button>
          <button onClick={() => setIsOpen(!isOpen)} className="p-2 shrink-0">{isOpen ? <i className="fas fa-chevron-up text-slate-500"></i> : <i className="fas fa-chevron-down text-slate-500"></i>}</button>
        </div>
      </div>
      {isOpen ? <div className="p-4 sm:p-5 border-t border-slate-200 bg-white overflow-x-auto">{children}</div> : null}
    </Card>
  );
};

const LabelWithHint = ({ children, hint, className="block text-slate-700 font-semibold mb-1", onRegenerate, isLoading }) => {
  const [showHint, setShowHint] = useState(false);
  return (
    <div className="mb-1 w-full">
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2">
          <label className={className}>{children}</label>
          {onRegenerate ? (
            <button 
              type="button" 
              onClick={onRegenerate} 
              disabled={isLoading} 
              className={`w-6 h-6 shrink-0 flex items-center justify-center rounded-full transition-all shadow-sm border ${isLoading ? 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed' : 'bg-fuchsia-100 text-fuchsia-600 border-fuchsia-200 hover:bg-fuchsia-600 hover:text-white'}`} 
              title="Generate ulang bagian ini saja"
            >
              <i className={`fas fa-sync-alt text-[10px] ${isLoading ? 'fa-spin' : ''}`}></i>
            </button>
          ) : null}
        </div>
        {hint ? <button type="button" onClick={() => setShowHint(!showHint)} className={`ml-2 shrink-0 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded transition-colors flex items-center shadow-sm ${showHint ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-white border border-slate-300 text-slate-500 hover:bg-slate-100 hover:text-slate-800'}`} title="Klik untuk bantuan pengisian"><i className={`fas ${showHint ? 'fa-times' : 'fa-info-circle'} mr-1`}></i> <span className="hidden sm:inline">{showHint ? 'Tutup' : 'Petunjuk'}</span></button> : null}
      </div>
      {showHint ? <div className="mt-2 mb-3 p-3 bg-blue-50/80 border border-blue-200 text-blue-800 text-xs rounded-lg shadow-inner leading-relaxed whitespace-pre-wrap"><i className="fas fa-lightbulb text-yellow-500 mr-2 text-sm"></i>{hint}</div> : null}
    </div>
  );
};

function App() {
  const [completedSteps, setCompletedSteps] = useState({});
  const [isEditing, setIsEditing] = useState(false);
  const [isGenerating, setIsGenerating] = useState(false);
  const [individualLoading, setIndividualLoading] = useState({});
  const [instruksiKhusus, setInstruksiKhusus] = useState(""); 
  
  // State API Key Manual
  const [showApiModal, setShowApiModal] = useState(false);
  const [geminiApiKey, setGeminiApiKey] = useState(() => {
    return localStorage.getItem('gemini_api_key_eksternal_v2') || "";
  });
  const [tempApiKey, setTempApiKey] = useState("");

  const saveApiKey = () => {
    localStorage.setItem('gemini_api_key_eksternal_v2', tempApiKey);
    setGeminiApiKey(tempApiKey);
    setShowApiModal(false);
    alert("API Key berhasil disimpan! Anda sekarang menggunakan kuota pribadi Anda.");
  };

  const profilLabels = { 
    keimanan: "Keimanan dan Ketakwaan terhadap Tuhan YME", kewargaan: "Kewargaan", penalaran: "Penalaran Kritis", 
    kreativitas: "Kreativitas", kolaborasi: "Kolaborasi", kemandirian: "Kemandirian", kesehatan: "Kesehatan", komunikasi: "Komunikasi" 
  };
  
  const kseLabels = { kesadaranDiri: "Kesadaran Diri", manajemenDiri: "Manajemen Diri", kesadaranSosial: "Kesadaran Sosial", keterampilanBerelasi: "Keterampilan Berelasi", keputusanBertanggungJawab: "Keputusan Bertanggung Jawab" };

  const defaultDataObj = {
    namaSekolah: "SMP Negeri 2 Secang", namaGuru: "YUSUF ARIS SYAMSUDDIN, S.Pd.", 
    tahunPelajaran: "2025/2026", nipGuru: "19950430 202321 1 004", 
    namaKepsek: "", nipKepsek: "", mapel: "", kelas: "", topik: "", 
    waktu: "2 x 40 Menit", jumlahPertemuan: "1 Pertemuan",
    kompetensiAwal: "", kesiapanSiswa: "", karakteristikMateri: "",
    profilLulusan: { keimanan: false, kewargaan: false, penalaran: false, kreativitas: false, kolaborasi: false, kemandirian: false, kesehatan: false, komunikasi: false },
    kseLulusan: { kesadaranDiri: false, manajemenDiri: false, kesadaranSosial: false, keterampilanBerelasi: false, keputusanBertanggungJawab: false },
    cp: "", lintasDisiplin: "", tp: "", 
    praktikPedagogis: "Pembelajaran Mendalam (Deep Learning)", // Berubah menjadi String utuh
    kemitraanPembelajaran: "", lingkunganPembelajaran: "", pemanfaatanDigital: "",
    kegiatanAwal: "", kegiatanInti: "", kegiatanPenutup: "",
    pengalamanMemahami: "", pengalamanMengaplikasi: "", pengalamanMerefleksi: "",
    asesmenAwal: "", asesmenProses: "", asesmenAkhir: "", catatanRefleksi: "",
    kisiKisi: [], bankSoal: [], rubrikPenilaian: []
  };

  const [rppData, setRppData] = useState(() => {
    const saved = localStorage.getItem('asistenGuruData_v38');
    if (saved) {
      try {
        let p = JSON.parse(saved);
        // Migrasi jika praktikPedagogis sebelumnya adalah array (Dropdown)
        if (Array.isArray(p.praktikPedagogis)) {
            p.praktikPedagogis = p.praktikPedagogis.join(', ');
        }
        if (p.bankSoal && p.bankSoal.length > 0 && p.bankSoal[0].opsi === undefined) { p.bankSoal = p.bankSoal.map(b => ({...b, opsi:"", kunci:""})); }
        return { ...defaultDataObj, ...p };
      } catch (e) {}
    }
    return defaultDataObj;
  });

  useEffect(() => { localStorage.setItem('asistenGuruData_v38', JSON.stringify(rppData)); }, [rppData]);

  const toggleStep = (id) => setCompletedSteps(p => ({ ...p, [id]: !p[id] }));
  const handleInputChange = (e) => setRppData(p => ({ ...p, [e.target.name]: e.target.value }));
  const handleProfilChange = (k) => setRppData(p => ({ ...p, profilLulusan: { ...p.profilLulusan, [k]: !p.profilLulusan[k] } }));
  const handleKseChange = (k) => setRppData(p => ({ ...p, kseLulusan: { ...p.kseLulusan, [k]: !p.kseLulusan[k] } }));
  const handleTableChange = (a, i, f, v) => setRppData(p => { const n = [...p[a]]; n[i] = { ...n[i], [f]: v }; return { ...p, [a]: n }; });
  const addTableRow = (a, d) => setRppData(p => ({ ...p, [a]: [...p[a], { id: Date.now(), ...d }] }));
  const removeTableRow = (a, id) => { if(window.confirm("Hapus baris ini?")) setRppData(p => ({ ...p, [a]: p[a].filter(i => i.id !== id) })); };
  
  const resetRppData = () => {
    if(window.confirm("Kosongkan semua form?")) {
      setRppData({...defaultDataObj});
      setCompletedSteps({}); setIsEditing(true); setInstruksiKhusus("");
    }
  };

  // FUNGSI PEMBERSIH ENTER GANDA (Tepat 1 newline saja, membuang \n\n)
  const cleanStr = (str) => {
    if (!str) return "";
    let cleaned = str.replace(/\\n/g, '\n').replace(/\*\*/g, '').replace(/\*/g, '');
    cleaned = cleaned.replace(/\n\s*\n/g, '\n'); // Mencegah spasi kosong ter-enter 2x
    return cleaned.trim();
  };

  const callGeminiAPI = async (payload) => {
    const apiKey = geminiApiKey || ""; 
    const model = apiKey ? "gemini-2.5-flash" : "gemini-2.5-flash-preview-09-2025";
    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
    
    const delays = [1000, 2000, 4000, 8000, 16000]; 
    let lastError = null;

    for (let i = 0; i <= delays.length; i++) {
      try {
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (!res.ok) throw new Error(result.error?.message || `HTTP error! status: ${res.status}`);
        return result;
      } catch (error) {
        lastError = error;
        if (error.message.toLowerCase().includes("api key") || error.message.includes("API_KEY_INVALID")) {
          throw error;
        }
        if (i < delays.length) await new Promise(resolve => setTimeout(resolve, delays[i]));
      }
    }
    throw lastError; 
  };

  const handleGenerateAI = async () => {
    if (!rppData.topik || !rppData.mapel || !rppData.kelas) {
      alert("Mohon isi Mata Pelajaran, Kelas, dan Topik terlebih dahulu."); return;
    }
    setIsGenerating(true);

    const prompt = `Anda adalah Ahli Kurikulum Nasional dan Pakar Pembelajaran Mendalam (Deep Learning). Buat Modul Ajar/RPP yang SANGAT DETAIL, terstruktur, langsung pada poin-poinnya (TIDAK BOLEH ADA KATA PENGANTAR/BASA-BASI).

Data: Mapel: ${rppData.mapel}, Kelas: ${rppData.kelas}, Topik: ${rppData.topik}, Tujuan: ${rppData.tp || 'Belum dirumuskan'}
${instruksiKhusus ? `\n🔥 INSTRUKSI KHUSUS GURU: ${instruksiKhusus}\n` : ''}

ATURAN KETAT GENERATE:
1. Isian Teks: WAJIB dijabarkan dengan poin-poin. Gunakan SATU enter (\\n) saja agar setiap poin turun ke baris baru tanpa jeda berlebih. DILARANG menggunakan kata pengantar.
2. **profilLulusan** & **kseLulusan**: Pilih opsi array key yang tepat.
3. **kisiKisi**: WAJIB Buat 10 Indikator. PADA KOLOM 'bentuk', WAJIB ISI DENGAN: "PG", "PG Kompleks", "Menjodohkan", "Isian Singkat", "Uraian", "Praktik", atau "Proyek".
4. **bankSoal**: SINKRON 100% DENGAN KISI-KISI! WAJIB 10 SOAL HOTS.
   - Jika "PG": "opsi" berisi A, B, C, D (dipisah 1 enter \\n), "kunci" berisi 1 jawaban.
   - Jika "PG Kompleks": "opsi" berisi pilihan, "kunci" WAJIB berisi MINIMAL 2 JAWABAN BENAR (contoh: "A dan C").
   - Jika "Uraian": "opsi" WAJIB diisi PEDOMAN JAWABAN (dipisah 1 enter \\n), "kunci" diisi "-".
5. **rubrikPenilaian**: Kolom 'skor' isi rentang logis (contoh: "Skor 4" atau "Skala 81-100"), kolom 'kriteria' isi deskripsi poin-poin (pisahkan dengan 1 \\n).

HASILKAN OUTPUT MURNI JSON SESUAI SKEMA BERIKUT:`;

    const payload = {
      contents: [{ parts: [{ text: prompt }] }],
      systemInstruction: { parts: [{ text: "Keluarkan output hanya JSON murni. DILARANG KERAS menggunakan kalimat pembuka/penutup. Langsung isi nilainya. Gunakan \n tunggal (bukan \n\n) untuk setiap pergantian baris/poin agar teks memanjang ke bawah rapi tanpa spasi terlampau lebar." }] },
      generationConfig: {
        responseMimeType: "application/json",
        responseSchema: {
          type: "OBJECT",
          properties: {
            kesiapanSiswa: { type: "STRING" }, karakteristikMateri: { type: "STRING" },
            profilLulusan: { type: "ARRAY", items: { type: "STRING" } }, kseLulusan: { type: "ARRAY", items: { type: "STRING" } },
            praktikPedagogis: { type: "STRING" }, // Sekarang string
            cp: { type: "STRING" }, lintasDisiplin: { type: "STRING" }, tp: { type: "STRING" },
            kemitraanPembelajaran: { type: "STRING" }, lingkunganPembelajaran: { type: "STRING" }, pemanfaatanDigital: { type: "STRING" },
            kegiatanAwal: { type: "STRING" }, pengalamanMemahami: { type: "STRING" }, asesmenAwal: { type: "STRING" },
            kegiatanInti: { type: "STRING" }, pengalamanMengaplikasi: { type: "STRING" }, asesmenProses: { type: "STRING" },
            kegiatanPenutup: { type: "STRING" }, pengalamanMerefleksi: { type: "STRING" }, asesmenAkhir: { type: "STRING" },
            kisiKisi: { type: "ARRAY", items: { type: "OBJECT", properties: { materi: { type: "STRING" }, indikator: { type: "STRING" }, level: { type: "STRING" }, bentuk: { type: "STRING" }, nomor: { type: "STRING" } } } },
            bankSoal: { type: "ARRAY", items: { type: "OBJECT", properties: { soal: { type: "STRING" }, opsi: { type: "STRING" }, kunci: { type: "STRING" } } } },
            rubrikPenilaian: { type: "ARRAY", items: { type: "OBJECT", properties: { skor: { type: "STRING" }, kriteria: { type: "STRING" } } } }
          }
        }
      }
    };

    try {
      const result = await callGeminiAPI(payload);
      let aiText = result?.candidates?.[0]?.content?.parts?.[0]?.text || "";
      
      if (aiText) {
        try {
          aiText = aiText.replace(/```json/gi, '').replace(/```/g, '').trim();
          const aiData = JSON.parse(aiText);

          const newProfil = { ...rppData.profilLulusan };
          if (aiData.profilLulusan) aiData.profilLulusan.forEach(k => { if(newProfil[k] !== undefined) newProfil[k] = true; });
          const newKse = { ...rppData.kseLulusan };
          if (aiData.kseLulusan) aiData.kseLulusan.forEach(k => { if(newKse[k] !== undefined) newKse[k] = true; });

          setRppData(prev => ({
            ...prev,
            kesiapanSiswa: cleanStr(aiData.kesiapanSiswa) || prev.kesiapanSiswa, 
            karakteristikMateri: cleanStr(aiData.karakteristikMateri) || prev.karakteristikMateri,
            profilLulusan: aiData.profilLulusan ? newProfil : prev.profilLulusan, kseLulusan: aiData.kseLulusan ? newKse : prev.kseLulusan,
            praktikPedagogis: cleanStr(aiData.praktikPedagogis) || prev.praktikPedagogis,
            cp: cleanStr(aiData.cp) || prev.cp, lintasDisiplin: cleanStr(aiData.lintasDisiplin) || prev.lintasDisiplin, tp: cleanStr(aiData.tp) || prev.tp,
            kemitraanPembelajaran: cleanStr(aiData.kemitraanPembelajaran) || prev.kemitraanPembelajaran, lingkunganPembelajaran: cleanStr(aiData.lingkunganPembelajaran) || prev.lingkunganPembelajaran, pemanfaatanDigital: cleanStr(aiData.pemanfaatanDigital) || prev.pemanfaatanDigital,
            kegiatanAwal: cleanStr(aiData.kegiatanAwal) || prev.kegiatanAwal, pengalamanMemahami: cleanStr(aiData.pengalamanMemahami) || prev.pengalamanMemahami, asesmenAwal: cleanStr(aiData.asesmenAwal) || prev.asesmenAwal,
            kegiatanInti: cleanStr(aiData.kegiatanInti) || prev.kegiatanInti, pengalamanMengaplikasi: cleanStr(aiData.pengalamanMengaplikasi) || prev.pengalamanMengaplikasi, asesmenProses: cleanStr(aiData.asesmenProses) || prev.asesmenProses,
            kegiatanPenutup: cleanStr(aiData.kegiatanPenutup) || prev.kegiatanPenutup, pengalamanMerefleksi: cleanStr(aiData.pengalamanMerefleksi) || prev.pengalamanMerefleksi, asesmenAkhir: cleanStr(aiData.asesmenAkhir) || prev.asesmenAkhir,
            kisiKisi: (aiData.kisiKisi && aiData.kisiKisi.length > 0) ? aiData.kisiKisi.map((k, i) => ({ id: Date.now() + 'k' + i, ...k })) : prev.kisiKisi,
            bankSoal: (aiData.bankSoal && aiData.bankSoal.length > 0) ? aiData.bankSoal.map((b, i) => ({ id: Date.now() + 'b' + i, soal: cleanStr(b.soal), opsi: cleanStr(b.opsi), kunci: cleanStr(b.kunci) })) : prev.bankSoal,
            rubrikPenilaian: (aiData.rubrikPenilaian && aiData.rubrikPenilaian.length > 0) ? aiData.rubrikPenilaian.map((r, i) => ({ id: Date.now() + 'r' + i, skor: cleanStr(r.skor), kriteria: cleanStr(r.kriteria) })) : prev.rubrikPenilaian,
          }));
          alert("Selesai! Modul telah diperbarui secara presisi dengan format baris baru tunggal yang rapi.");
        } catch (parseError) {
          alert("Gagal membaca struktur AI. Silakan klik Generate lagi.");
        }
      }
    } catch (error) {
      if (error.message.toLowerCase().includes("api key") || error.message.includes("API_KEY_INVALID")) {
         setShowApiModal(true);
      } else {
         alert("Sistem AI sedang padat. Pastikan Anda telah memasukkan API Key manual. \nDetail: " + error.message);
      }
    } finally { setIsGenerating(false); }
  };

  const handleRegenerateSpecific = async (fieldKey, fieldTitle, type = 'string') => {
    if (!rppData.topik || !rppData.mapel) {
      alert("Mohon isi Mata Pelajaran dan Topik terlebih dahulu."); return;
    }
    setIndividualLoading(prev => ({...prev, [fieldKey]: true}));

    let fieldSpecificInstruction = "";
    if (fieldKey === 'kegiatanInti') {
        fieldSpecificInstruction = "Jabarkan aktivitas langkah fisik. Buat skenario diferensiasi TaRL. Gunakan format poin-poin yang dipisahkan dengan ENTER (\\n). DILARANG ADA BASA-BASI PEMBUKA.";
    } else if (fieldKey === 'kompetensiAwal' || fieldKey === 'kesiapanSiswa') {
        fieldSpecificInstruction = "Langsung tuliskan poin-poinnya saja, dipisah dengan ENTER (\\n). Dilarang keras menuliskan kalimat pengantar.";
    } else if (fieldKey === 'kisiKisi') {
        fieldSpecificInstruction = "WAJIB Hasilkan TEPAT 10 NOMOR/BARIS kisi-kisi soal yang lengkap, berbobot, dan terstruktur dengan rapi.";
    } else if (fieldKey === 'bankSoal') {
        const stringKisi = rppData.kisiKisi.map(k => `No.${k.nomor} (${k.bentuk}): ${k.indikator}`).join(' | ');
        fieldSpecificInstruction = `WAJIB hasilkan TEPAT 10 NOMOR SOAL HOTS. Tulis soal SINKRON dengan KISI berikut: [ ${stringKisi || 'Buat 10 soal acak sesuai materi.'} ]. 
        ATURAN TEKS: Tiap baris Opsi WAJIB dipisah dengan ENTER (\\n). 
        JIKA PG KOMPLEKS: Kunci jawaban WAJIB BERISI MINIMAL 2 BENAR (contoh: A dan C). 
        JIKA URAIAN: Tulis poin pedoman jawaban di opsi dipisah ENTER (\\n) dan kunci beri tanda '-'.`;
    } else if (fieldKey === 'rubrikPenilaian') {
        fieldSpecificInstruction = "WAJIB letakkan skor/rentang nilai pada kolom 'skor' secara tepat (Contoh: 'Skor 4' atau 'Nilai 81-100') dan letakkan penjelasan kriteria rubrik yang terperinci di kolom 'kriteria', dipisahkan dengan ENTER (\\n).";
    }

    let prompt = `Tugas Anda merancang SATU BAGIAN RPP langsung ke intinya, TANPA basa-basi pembuka atau penutup.
    Data: Mapel: ${rppData.mapel}, Topik: ${rppData.topik}
    TUGAS: Hasilkan isian untuk bagian "${fieldTitle}".
    ${fieldSpecificInstruction ? `\n🔥 FOKUS UTAMA: ${fieldSpecificInstruction}\n` : ''}`;

    let payload = { contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: "DILARANG menggunakan kalimat pengantar/penutup. Langsung berikan poin isiannya. Gunakan 1 kali newline/enter (\\n) agar setiap poin tersusun rapi ke bawah tanpa celah ganda." }] } };

    if (type === 'string') {
      prompt += `\n\nHANYA kembalikan teks isian. Setiap poin WAJIB dipisahkan dengan 1 baris baru (ENTER tunggal).`;
    } else {
      let schemaObj = {};
      if (type === 'array_kisi') {
          schemaObj = { type: "ARRAY", items: { type: "OBJECT", properties: { materi: { type: "STRING" }, indikator: { type: "STRING" }, level: { type: "STRING" }, bentuk: { type: "STRING" }, nomor: { type: "STRING" } } } };

      else if (type === 'array_rubrik') {
          schemaObj = { type: "ARRAY", items: { type: "OBJECT", properties: { skor: { type: "STRING" }, kriteria: { type: "STRING" } } } };
      }
      payload.generationConfig = { responseMimeType: "application/json", responseSchema: schemaObj };
    }

    try {
      const result = await callGeminiAPI(payload);
      let aiText = result?.candidates?.[0]?.content?.parts?.[0]?.text || "";
      
      if (aiText) {

  return (
