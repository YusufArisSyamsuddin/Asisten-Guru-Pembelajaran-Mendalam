<script type="text/babel">
const { useState, useEffect, useRef } = React;

const Card = ({ children, className = "" }) => (<div className={`bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden ${className}`}>{children}</div>);

const Accordion = ({ title, icon, subtitle, children, defaultOpen = false, isCompleted, onToggleComplete, headerColorClass = "bg-blue-100 text-blue-700" }) => {
  const [isOpen, setIsOpen] = useState(defaultOpen);
  return (
    <Card className={`mb-5 transition-all duration-300 ${isCompleted ? 'border-l-4 border-l-green-500 opacity-80 bg-slate-50' : 'border-l-4 border-l-blue-600'}`}>
      <div className="flex items-center justify-between p-3 sm:p-4 hover:bg-slate-50 cursor-pointer" onClick={() => setIsOpen(!isOpen)}>
        <div className="flex-1 flex items-center space-x-3 sm:space-x-4 text-left">
          <div className={`w-10 h-10 sm:w-12 sm:h-12 rounded-xl flex items-center justify-center shadow-sm shrink-0 ${isCompleted ? 'bg-green-100 text-green-700' : headerColorClass}`}>
            <i className={`${icon} text-lg sm:text-xl`}></i>
          </div>
          <div>
            <h3 className={`font-bold text-base sm:text-lg leading-tight ${isCompleted ? 'text-green-800 line-through decoration-green-400' : 'text-slate-800'}`}>{title}</h3>
            {subtitle && <p className="text-xs sm:text-sm font-medium text-slate-500 mt-0.5">{subtitle}</p>}
          </div>
        </div>
        <div className="flex items-center space-x-2 sm:space-x-3" onClick={(e) => e.stopPropagation()}>
          <button onClick={onToggleComplete} className={`w-7 h-7 sm:w-8 sm:h-8 shrink-0 rounded-full flex items-center justify-center border-2 transition-colors shadow-sm ${isCompleted ? 'bg-green-500 border-green-500 text-white' : 'border-slate-300 bg-white text-transparent hover:border-green-400'}`} title="Tandai Selesai">✓</button>
          <button onClick={() => setIsOpen(!isOpen)} className="p-2 shrink-0">{isOpen ? <i className="fas fa-chevron-up text-slate-500"></i> : <i className="fas fa-chevron-down text-slate-500"></i>}</button>
        </div>
      </div>
      {isOpen && <div className="p-4 sm:p-5 border-t border-slate-200 bg-white overflow-x-auto">{children}</div>}
    </Card>
  );
};

// Komponen Label dengan Hint & Tombol Generate Satuan
const LabelWithHint = ({ children, hint, className="block text-slate-700 font-semibold mb-1", onRegenerate, isLoading }) => {
  const [showHint, setShowHint] = useState(false);
  return (
    <div className="mb-1 w-full">
      <div className="flex items-center justify-between">
        <div className="flex items-center gap-2">
          <label className={className}>{children}</label>
          {onRegenerate && (
            <button 
              type="button" 
              onClick={onRegenerate} 
              disabled={isLoading} 
              className={`w-6 h-6 shrink-0 flex items-center justify-center rounded-full transition-all shadow-sm border ${isLoading ? 'bg-slate-100 text-slate-400 border-slate-200 cursor-not-allowed' : 'bg-fuchsia-100 text-fuchsia-600 border-fuchsia-200 hover:bg-fuchsia-600 hover:text-white'}`} 
              title="Generate AI khusus untuk isian ini saja"
            >
              <i className={`fas fa-sync-alt text-[10px] ${isLoading ? 'fa-spin' : ''}`}></i>
            </button>
          )}
        </div>
        {hint && <button type="button" onClick={() => setShowHint(!showHint)} className={`ml-2 shrink-0 text-[10px] font-bold uppercase tracking-wider px-2 py-1 rounded transition-colors flex items-center shadow-sm ${showHint ? 'bg-blue-600 text-white hover:bg-blue-700' : 'bg-white border border-slate-300 text-slate-500 hover:bg-slate-100 hover:text-slate-800'}`} title="Klik untuk bantuan pengisian"><i className={`fas ${showHint ? 'fa-times' : 'fa-info-circle'} mr-1`}></i> <span className="hidden sm:inline">{showHint ? 'Tutup' : 'Petunjuk'}</span></button>}
      </div>
      {showHint && <div className="mt-2 mb-3 p-3 bg-blue-50/80 border border-blue-200 text-blue-800 text-xs rounded-lg shadow-inner leading-relaxed"><i className="fas fa-lightbulb text-yellow-500 mr-2 text-sm"></i>{hint}</div>}
    </div>
  );
};

const MultiSelectDropdown = ({ options, selectedOptions, toggleOption }) => {
  const [isOpen, setIsOpen] = useState(false);
  const dropdownRef = useRef(null);
  useEffect(() => {
    function handleClickOutside(event) { if (dropdownRef.current && !dropdownRef.current.contains(event.target)) setIsOpen(false); }
    document.addEventListener("mousedown", handleClickOutside);
    return () => document.removeEventListener("mousedown", handleClickOutside);
  }, [dropdownRef]);

  return (
    <div className="relative w-full" ref={dropdownRef}>
      <button type="button" onClick={() => setIsOpen(!isOpen)} className="w-full p-3 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 bg-white text-left flex justify-between items-center shadow-sm transition-colors hover:bg-slate-50 min-h-[46px]">
        <div className="flex-1 min-w-0 pr-3">
          <span className="block truncate text-slate-700 font-medium text-sm sm:text-base">{selectedOptions.length > 0 ? selectedOptions.join(', ') : '-- Pilih Praktik Pedagogis --'}</span>
        </div>
        <div className="flex items-center shrink-0">
          {selectedOptions.length > 0 && <span className="bg-indigo-100 text-indigo-800 text-[10px] font-bold px-2 py-1 rounded-full mr-2">{selectedOptions.length}</span>}
          <i className={`fas fa-chevron-${isOpen ? 'up' : 'down'} text-slate-500`}></i>
        </div>
      </button>
      {isOpen && (
        <div className="absolute z-50 mt-2 w-full bg-white border border-indigo-200 rounded-lg shadow-xl max-h-[60vh] overflow-y-auto dropdown-animate">
          <div className="p-2 bg-indigo-50 text-xs text-indigo-800 font-bold border-b border-indigo-100 sticky top-0 z-10"><i className="fas fa-check-square mr-1"></i> Centang model/strategi:</div>
          {options.map((opt) => (
            <div key={opt.id} className={`p-3 border-b border-slate-100 cursor-pointer flex items-start space-x-3 transition-colors ${selectedOptions.includes(opt.title) ? 'bg-indigo-50/50' : 'hover:bg-slate-50'}`} onClick={() => toggleOption(opt.title)}>
              <input type="checkbox" className="mt-1 w-5 h-5 sm:w-4 sm:h-4 text-indigo-600 rounded cursor-pointer border-slate-300 shrink-0" checked={selectedOptions.includes(opt.title)} readOnly />
              <div className="flex-1">
                <div className={`text-sm font-bold ${selectedOptions.includes(opt.title) ? 'text-indigo-800' : 'text-slate-800'}`}>{opt.title}</div>
                <div className="text-xs text-slate-500 mt-1 leading-snug">{opt.desc}</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
};

function App() {
  const [completedSteps, setCompletedSteps] = useState({});
  const [isEditing, setIsEditing] = useState(false);
  const [isGenerating, setIsGenerating] = useState(false);
  const [individualLoading, setIndividualLoading] = useState({});
  const [instruksiKhusus, setInstruksiKhusus] = useState(""); 
  
  // 8 Dimensi Lulusan Sesuai Kebijakan Pembelajaran Mendalam (Deep Learning) 2025
  const profilLabels = { 
    keimanan: "Keimanan dan Ketakwaan terhadap Tuhan YME", 
    kewargaan: "Kewargaan", 
    penalaran: "Penalaran Kritis", 
    kreativitas: "Kreativitas", 
    kolaborasi: "Kolaborasi", 
    kemandirian: "Kemandirian", 
    kesehatan: "Kesehatan", 
    komunikasi: "Komunikasi" 
  };
  
  const kseLabels = { kesadaranDiri: "Kesadaran Diri", manajemenDiri: "Manajemen Diri", kesadaranSosial: "Kesadaran Sosial", keterampilanBerelasi: "Keterampilan Berelasi", keputusanBertanggungJawab: "Keputusan Bertanggung Jawab" };
  
  const praktikOptions = [
    { id: 'dl', title: "Pembelajaran Mendalam (Deep Learning)", desc: "Menerapkan prinsip Mindful, Meaningful, dan Joyful." },
    { id: 'ubd', title: "Understanding by Design (UbD)", desc: "Desain Mundur: Menentukan hasil akhir dan merancang asesmen terlebih dahulu." },
    { id: 'tarl', title: "Teaching at the Right Level (TaRL) / Diferensiasi", desc: "Instruksi yang disesuaikan dengan tingkat capaian/kemampuan awal." },
    { id: 'crt', title: "Culturally Responsive Teaching (CRT)", desc: "Mengaitkan materi dengan latar belakang budaya lokal." },
    { id: 'pbl', title: "Problem Based Learning (PBL)", desc: "Pemecahan masalah kontekstual dunia nyata." },
    { id: 'pjbl', title: "Project Based Learning (PjBL)", desc: "Investigasi mendalam untuk menghasilkan karya nyata." },
    { id: 'inquiry', title: "Inquiry Based Learning", desc: "Menyusun pertanyaan, meneliti, dan menemukan konsep mandiri." },
    { id: 'discovery', title: "Discovery Learning", desc: "Menemukan pengetahuan baru melalui pengamatan & percobaan." },
    { id: 'experiential', title: "Experiential Learning", desc: "Siklus mengalami langsung, observasi, konseptualisasi." },
    { id: 'sel', title: "Pembelajaran Sosial Emosional (SEL)", desc: "Pengintegrasian keterampilan empati & regulasi emosi (CASEL)." },
    { id: 'montessori', title: "Pendekatan Montessori", desc: "Membebaskan siswa memilih aktivitas belajar secara mandiri." },
    { id: 'lainnya', title: "Lainnya (Ketik Manual)", desc: "Pilih opsi ini jika menggunakan model lainnya." }
  ];

  const defaultDataObj = {
    namaSekolah: "SMP Negeri 2 Secang", 
    namaGuru: "YUSUF ARIS SYAMSUDDIN, S.Pd.", 
    tahunPelajaran: "2025/2026", 
    nipGuru: "19950430 202321 1 004", 
    namaKepsek: "", nipKepsek: "",
    mapel: "", kelas: "", topik: "", 
    waktu: "2 x 40 Menit", 
    jumlahPertemuan: "1 Pertemuan",
    kompetensiAwal: "", kesiapanSiswa: "", karakteristikMateri: "",
    profilLulusan: { keimanan: false, kewargaan: false, penalaran: false, kreativitas: false, kolaborasi: false, kemandirian: false, kesehatan: false, komunikasi: false },
    kseLulusan: { kesadaranDiri: false, manajemenDiri: false, kesadaranSosial: false, keterampilanBerelasi: false, keputusanBertanggungJawab: false },
    cp: "", lintasDisiplin: "", tp: "", praktikPedagogis: ["Pembelajaran Mendalam (Deep Learning)"], praktikLainnya: "",
    kemitraanPembelajaran: "", lingkunganPembelajaran: "", pemanfaatanDigital: "",
    kegiatanAwal: "", kegiatanInti: "", kegiatanPenutup: "",
    pengalamanMemahami: "", pengalamanMengaplikasi: "", pengalamanMerefleksi: "",
    asesmenAwal: "", asesmenProses: "", asesmenAkhir: "", catatanRefleksi: "",
    kisiKisi: [], bankSoal: [], rubrikPenilaian: []
  };

  const [rppData, setRppData] = useState(() => {
    const saved = localStorage.getItem('asistenGuruData_v31');
    if (saved) {
      try {
        let p = JSON.parse(saved);
        if (typeof p.praktikPedagogis === 'string') p.praktikPedagogis = [p.praktikPedagogis];
        if (p.bankSoal && p.bankSoal.length > 0 && p.bankSoal[0].opsi === undefined) { p.bankSoal = p.bankSoal.map(b => ({...b, opsi:"", kunci:""})); }
        return { ...defaultDataObj, ...p };
      } catch (e) {}
    }
    return defaultDataObj;
  });

  useEffect(() => { localStorage.setItem('asistenGuruData_v31', JSON.stringify(rppData)); }, [rppData]);

  const toggleStep = (id) => setCompletedSteps(p => ({ ...p, [id]: !p[id] }));
  const handleInputChange = (e) => setRppData(p => ({ ...p, [e.target.name]: e.target.value }));
  const handleProfilChange = (k) => setRppData(p => ({ ...p, profilLulusan: { ...p.profilLulusan, [k]: !p.profilLulusan[k] } }));
  const handleKseChange = (k) => setRppData(p => ({ ...p, kseLulusan: { ...p.kseLulusan, [k]: !p.kseLulusan[k] } }));
  const togglePraktikPedagogis = (m) => setRppData(p => {
    let c = Array.isArray(p.praktikPedagogis) ? [...p.praktikPedagogis] : [];
    c.includes(m) ? c = c.filter(i => i !== m) : c.push(m);
    return { ...p, praktikPedagogis: c };
  });
  const handleTableChange = (a, i, f, v) => setRppData(p => { const n = [...p[a]]; n[i] = { ...n[i], [f]: v }; return { ...p, [a]: n }; });
  const addTableRow = (a, d) => setRppData(p => ({ ...p, [a]: [...p[a], { id: Date.now(), ...d }] }));
  const removeTableRow = (a, id) => { if(window.confirm("Hapus baris ini?")) setRppData(p => ({ ...p, [a]: p[a].filter(i => i.id !== id) })); };
  
  const resetRppData = () => {
    if(window.confirm("Kosongkan semua form dan mulai dari nol? (Hanya menyisakan Nama Sekolah, Guru, NIP, Waktu dan Tahun Pelajaran)")) {
      setRppData({...defaultDataObj});
      setCompletedSteps({}); setIsEditing(true); setInstruksiKhusus("");
    }
  };

  const formatNewline = (str) => str ? str.replace(/\\n/g, '\n') : "";

  const handleGenerateAI = async () => {
    if (!rppData.topik || !rppData.mapel || !rppData.kelas) {
      alert("Mohon isi Mata Pelajaran, Kelas/Fase, dan Topik Pembelajaran terlebih dahulu agar AI dapat menyusun modul dengan akurat.");
      return;
    }
    setIsGenerating(true);
    const apiKey = ""; // API Key disediakan via runtime env
    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

    const prompt = `Anda adalah Ahli Kurikulum Nasional, Pakar Pembelajaran Mendalam (Deep Learning), dan Guru Penggerak di Indonesia. Buat rancangan Modul Ajar/RPP yang SANGAT DETAIL, aplikatif, dan langsung bisa dieksekusi di kelas berdasarkan Naskah Akademik Pembelajaran Mendalam Kemdikdasmen RI 2025.

Data Kelas & Input Guru:
- Mata Pelajaran: ${rppData.mapel}
- Kelas / Fase: ${rppData.kelas}
- Topik: ${rppData.topik}
- Tujuan Pembelajaran (jika ada): ${rppData.tp || 'Belum dirumuskan'}

${instruksiKhusus ? `\n🔥 **INSTRUKSI KHUSUS DARI GURU (PATUHI 100%):**\n${instruksiKhusus}\n` : `\n🔥 **INSTRUKSI METODE:** Gunakan pendekatan TaRL, kelompok kolaboratif, dan kaitkan dengan sosial budaya pedesaan/industri di Secang, Magelang.\n`}

🔥 **PARADIGMA WAJIB (PEMBELAJARAN MENDALAM 2025):**
Dalam merancang pengalaman belajar (kegiatanAwal, kegiatanInti, kegiatanPenutup), Anda WAJIB mengimplementasikan 3 pilar:
1. **Mindful (Sadar):** Siswa sadar apa yang mereka pelajari dan mengapa itu penting (reflektif).
2. **Meaningful (Bermakna):** Materi dikaitkan erat dengan konteks nyata kehidupan siswa (HOTS, bukan sekadar hafalan).
3. **Joyful (Menyenangkan):** Lingkungan belajar inklusif, aman, tanpa ancaman, memicu eksplorasi aktif.

ATURAN GENERATE UNTUK SETIAP FIELD:
1. **kesiapanSiswa & karakteristikMateri**: Analisis mendalam. WAJIB gunakan (\\n) untuk pisah baris/poin.
2. **profilLulusan**: Berikan array Dimensi Lulusan. WAJIB HANYA MEMILIH DARI: "keimanan", "kewargaan", "penalaran", "kreativitas", "kolaborasi", "kemandirian", "kesehatan", "komunikasi".
3. **kseLulusan**: Berikan array CASEL. WAJIB HANYA MEMILIH DARI: "kesadaranDiri", "manajemenDiri", "kesadaranSosial", "keterampilanBerelasi", "keputusanBertanggungJawab".
4. **kegiatanAwal, kegiatanInti, kegiatanPenutup**: JABARKAN DENGAN FORMAT POIN. Implementasikan pilar Mindful, Meaningful, Joyful. WAJIB gunakan (\\n) untuk ganti baris.
5. **kisiKisi**: WAJIB BUAT TEPAT 10 Indikator berlevel HOTS (C4-C6). PADA KOLOM 'bentuk', WAJIB ISI DENGAN: "PG", "PG Kompleks", "Menjodohkan", "Isian Singkat", "Uraian", "Praktik", atau "Proyek".
6. **bankSoal**: WAJIB BUAT TEPAT 10 Soal berstandar AKM (Literasi/Numerasi) berlevel HOTS (C4-C6). 
   - WAJIB gunakan (\\n) untuk memisahkan STIMULUS (cerita konteks) dengan PERTANYAAN.
   - Pada kolom "opsi", WAJIB gunakan (\\n) untuk memisahkan setiap pilihan (A... \\n B... \\n C... \\n D...).

HASILKAN OUTPUT MURNI JSON SESUAI SKEMA BERIKUT:`;

    const payload = {
      contents: [{ parts: [{ text: prompt }] }],
      systemInstruction: { parts: [{ text: "Keluarkan output hanya dalam JSON valid yang ketat. Pastikan array profilLulusan dan kseLulusan HANYA berisi *exact matching strings* sesuai yang diminta di prompt. Kolom 'bentuk' pada kisiKisi juga harus exact match." }] },
      generationConfig: {
        responseMimeType: "application/json",
        responseSchema: {
          type: "OBJECT",
          properties: {
            kesiapanSiswa: { type: "STRING" }, karakteristikMateri: { type: "STRING" },
            profilLulusan: { type: "ARRAY", items: { type: "STRING" } }, kseLulusan: { type: "ARRAY", items: { type: "STRING" } },
            praktikPedagogis: { type: "ARRAY", items: { type: "STRING" } },
            cp: { type: "STRING" }, lintasDisiplin: { type: "STRING" }, tp: { type: "STRING" },
            kemitraanPembelajaran: { type: "STRING" }, lingkunganPembelajaran: { type: "STRING" }, pemanfaatanDigital: { type: "STRING" },
            kegiatanAwal: { type: "STRING" }, pengalamanMemahami: { type: "STRING" }, asesmenAwal: { type: "STRING" },
            kegiatanInti: { type: "STRING" }, pengalamanMengaplikasi: { type: "STRING" }, asesmenProses: { type: "STRING" },
            kegiatanPenutup: { type: "STRING" }, pengalamanMerefleksi: { type: "STRING" }, asesmenAkhir: { type: "STRING" },
            kisiKisi: { type: "ARRAY", items: { type: "OBJECT", properties: { materi: { type: "STRING" }, indikator: { type: "STRING" }, level: { type: "STRING" }, bentuk: { type: "STRING" }, nomor: { type: "STRING" } } } },
            bankSoal: { type: "ARRAY", items: { type: "OBJECT", properties: { soal: { type: "STRING" }, opsi: { type: "STRING" }, kunci: { type: "STRING" } } } },
            rubrikPenilaian: { type: "ARRAY", items: { type: "OBJECT", properties: { skor: { type: "STRING" }, kriteria: { type: "STRING" } } } }
          }
        }
      }
    };

    try {
      const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const result = await res.json();
      let aiText = result.candidates?.[0]?.content?.parts?.[0]?.text;
      
      if (aiText) {
        aiText = aiText.replace(/```json/gi, '').replace(/```/g, '').trim();
        const aiData = JSON.parse(aiText);

        const newProfil = { ...rppData.profilLulusan };
        if (aiData.profilLulusan) aiData.profilLulusan.forEach(k => { if(newProfil[k] !== undefined) newProfil[k] = true; });
        const newKse = { ...rppData.kseLulusan };
        if (aiData.kseLulusan) aiData.kseLulusan.forEach(k => { if(newKse[k] !== undefined) newKse[k] = true; });

        setRppData(prev => ({
          ...prev,
          kesiapanSiswa: formatNewline(aiData.kesiapanSiswa) || prev.kesiapanSiswa, 
          karakteristikMateri: formatNewline(aiData.karakteristikMateri) || prev.karakteristikMateri,
          profilLulusan: aiData.profilLulusan ? newProfil : prev.profilLulusan, kseLulusan: aiData.kseLulusan ? newKse : prev.kseLulusan,
          praktikPedagogis: aiData.praktikPedagogis || prev.praktikPedagogis,
          cp: aiData.cp || prev.cp, lintasDisiplin: aiData.lintasDisiplin || prev.lintasDisiplin, tp: aiData.tp || prev.tp,
          kemitraanPembelajaran: aiData.kemitraanPembelajaran || prev.kemitraanPembelajaran, lingkunganPembelajaran: aiData.lingkunganPembelajaran || prev.lingkunganPembelajaran, pemanfaatanDigital: aiData.pemanfaatanDigital || prev.pemanfaatanDigital,
          kegiatanAwal: formatNewline(aiData.kegiatanAwal) || prev.kegiatanAwal, pengalamanMemahami: formatNewline(aiData.pengalamanMemahami) || prev.pengalamanMemahami, asesmenAwal: formatNewline(aiData.asesmenAwal) || prev.asesmenAwal,
          kegiatanInti: formatNewline(aiData.kegiatanInti) || prev.kegiatanInti, pengalamanMengaplikasi: formatNewline(aiData.pengalamanMengaplikasi) || prev.pengalamanMengaplikasi, asesmenProses: formatNewline(aiData.asesmenProses) || prev.asesmenProses,
          kegiatanPenutup: formatNewline(aiData.kegiatanPenutup) || prev.kegiatanPenutup, pengalamanMerefleksi: formatNewline(aiData.pengalamanMerefleksi) || prev.pengalamanMerefleksi, asesmenAkhir: formatNewline(aiData.asesmenAkhir) || prev.asesmenAkhir,
          kisiKisi: (aiData.kisiKisi && aiData.kisiKisi.length > 0) ? aiData.kisiKisi.map((k, i) => ({ id: Date.now() + 'k' + i, ...k })) : prev.kisiKisi,
          bankSoal: (aiData.bankSoal && aiData.bankSoal.length > 0) ? aiData.bankSoal.map((b, i) => ({ id: Date.now() + 'b' + i, soal: formatNewline(b.soal), opsi: formatNewline(b.opsi), kunci: b.kunci })) : prev.bankSoal,

  const handleRegenerateSpecific = async (fieldKey, fieldTitle, type = 'string') => {

    setIndividualLoading(prev => ({...prev, [fieldKey]: true}));

    const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

    let prompt = `Anda adalah Pakar Kurikulum Nasional dan Pembelajaran Mendalam (Deep Learning). Tugas Anda merevisi/membuat SATU BAGIAN SAJA dari RPP berdasarkan data:

    Bagian yang harus Anda buat/revisi adalah: "${fieldTitle}". Pastikan mencerminkan prinsip Mindful, Meaningful, dan Joyful.`;

    let payload = { contents: [{ parts: [{ text: prompt }] }], systemInstruction: { parts: [{ text: "Berikan respon ringkas, padat, dan langsung pada intinya." }] } };

    if (type === 'string') {
      prompt += `\nHANYA kembalikan teks isiannya saja tanpa kata pengantar/penutup markdown. WAJIB gunakan newline/enter (\\n) untuk memisahkan poin-poin/paragraf.`;

          schemaObj = { type: "ARRAY", items: { type: "OBJECT", properties: { materi: { type: "STRING" }, indikator: { type: "STRING" }, level: { type: "STRING" }, bentuk: { type: "STRING" }, nomor: { type: "STRING" } } } };

           <p className="font-bold text-slate-600 text-sm sm:text-base mb-1">Dikembangkan oleh: YUSUF ARIS SYAMSUDDIN</p>
           <p className="font-medium">NIP: 19950430 202321 1 004 | Guru IPA & Informatika - SMPN 2 Secang</p>
        </div>

}

root.render(<App />);
